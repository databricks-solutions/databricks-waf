<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>
      {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/favicon.svg' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/landing.css' | relative_url }}"
    />
  </head>
  <body>
    <a class="landing-skip-link" href="#landing-content"
      >Skip to product tour</a
    >
    <header class="landing-header">
      <a
        class="landing-brand"
        href="{{ '/' | relative_url }}"
        aria-label="Databricks WAF assessment home"
      >
        <img
          class="landing-brand-logo"
          src="{{ '/assets/databricks-logo.svg' | relative_url }}"
          width="20"
          height="21"
          alt=""
          aria-hidden="true"
        />
        <span>Databricks WAF assessment</span>
      </a>
      <nav class="landing-nav" aria-label="Product tour">
        <a href="{{ '/' | relative_url }}#journey">Journey</a>
        <a href="{{ '/' | relative_url }}#review">Review</a>
        <a href="{{ '/' | relative_url }}#publish">Publish</a>
        <a href="{{ '/' | relative_url }}#investigate">Investigate</a>
        <a href="{{ '/' | relative_url }}#improve">Improve</a>
        <a href="{{ '/' | relative_url }}#operate">Operate</a>
        <a href="{{ '/pillars/' | relative_url }}">Pillars</a>
        <a href="{{ '/install/' | relative_url }}">Install</a>
        <a href="https://github.com/databricks-solutions/databricks-waf"
          >GitHub</a
        >
      </nav>
    </header>
    <main id="landing-content" class="landing-main" tabindex="-1">
      {{ content }}
    </main>
    <footer class="landing-footer">
      <p>Databricks Well-Architected Framework assessment</p>
      <div>
        <a href="{{ '/user-guide/' | relative_url }}">Read the guide</a>
        <a href="https://github.com/databricks-solutions/databricks-waf"
          >View on GitHub</a
        >
      </div>
    </footer>
  </body>
</html>
