name: Documentation drift

# The Well-Architected Framework documentation moves. When Databricks publishes,
# retitles or removes a best practice, this catalogue silently stops
# representing the framework it claims to represent. That is the failure this
# job exists to catch, and it is a failure of correctness rather than of
# freshness, which is why it fails loudly rather than warning.
#
# Scoped to provenance:waf-docs controls only. Extension controls have no source
# anchor to diff and would otherwise be reported as deletions on every run.

on:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "app/config/controls/**"
      - "app/scripts/docs-drift.mjs"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Diff catalogue against published documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Check for drift
        id: drift
        run: npm run drift:docs -- --report ../docs-drift-report.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docs-drift-report
          path: docs-drift-report.md
          if-no-files-found: ignore

      # On the scheduled run a failure should become a tracked item rather than
      # a red tick nobody looks at.
      - name: Open an issue on drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = 'The catalogue no longer matches the published Well-Architected Framework documentation.';
            try {
              body = fs.readFileSync('docs-drift-report.md', 'utf8');
            } catch {}
            const title = 'Documentation drift: catalogue no longer matches published guidance';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'docs-drift',
            });
            if (existing.data.some((i) => i.title === title)) {
              core.info('An open drift issue already exists; not filing a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['docs-drift', 'catalogue'],
            });
