name: Documentation issue
description: Report missing, incorrect or unclear public guidance.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: URL or repository path
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: checked
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, customer data, workspace identifiers and personal information.
          required: true

