# Exceptions to the OSV dependency scan.
#
# Every entry needs a reason that would survive a security review and a date on
# which it expires. An exception without an expiry is a decision nobody revisits;
# when the date passes the scan fails again and someone has to look.
#
# The bar for an entry here is that the finding cannot be acted on, not that it is
# inconvenient. Anything reachable from the shipped app is fixed, not ignored.
#
# There are no entries today: every advisory in the tree has a published fix and is
# resolved in the lockfile. Add an entry only for a finding with no published fix.
