# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: cost-optimization
  code: CO
  title: Cost optimization
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices
principles:
  - id: CO-01
    title: 1. Choose optimal resources
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#1-choose-optimal-resources
    controls:
      - id: CO-01-01
        title: Use performance optimized data formats
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-performance-optimized-data-formats
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: high
        alias_group: open-table-formats
        criteria: >-
          At least 95% of tables that store a format use Delta or Iceberg. Views, metric views and
          foreign tables are out of the denominator — they have no storage format to choose. Below
          70% fails; in between is partial, because a migration under way is a different state from
          one never started.
        thresholds:
          pass_share: 0.95
          partial_share: 0.7
        remediation:
          summary: >-
            Convert remaining Parquet, CSV and JSON tables to Delta so they gain transactions and
            statistics.
          sql: CONVERT TO DELTA parquet.`s3://bucket/path`;
          doc_url: https://docs.databricks.com/aws/en/delta/convert-to-delta
      - id: CO-01-02
        title: Use job compute
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-job-compute
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: medium
        criteria: >-
          Almost no scheduled work runs on all-purpose compute. All-purpose is billed at a higher
          rate and stays up between runs, so a job on it is paid for twice over.
        thresholds:
          pass_share: 0.98
          partial_share: 0.85
        remediation:
          summary: Move scheduled work off all-purpose clusters onto job compute or serverless jobs.
          cli: |-
            databricks jobs get 620112326920 | jq '{job_id, new_settings: .settings}' > job.json
            # in job.json, drop existing_cluster_id from each task and give it a job_clusters entry
            databricks jobs reset --json @job.json
          doc_url: https://docs.databricks.com/aws/en/jobs/compute
          caveat: >-
            A task with no cluster at all runs on serverless, which is usually the cheaper answer
            again. Reach for a job cluster where the workload needs a specific runtime, an init
            script or an instance type.
      - id: CO-01-03
        title: Use SQL warehouse for SQL workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-sql-warehouse-for-sql-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:workload.sql_paths
        severity: medium
        criteria: >-
          At least 90% of the statements a person submitted ran on a SQL warehouse rather than on an
          all-purpose cluster. Statements a job or pipeline submitted are outside the population:
          they say nothing about which path is easiest for a human, which is what the requirement is
          about.
        thresholds:
          pass_share: 0.9
          partial_share: 0.6
        remediation:
          summary: >-
            Give the people running ad-hoc SQL a warehouse and take away the need to start a cluster
            for it.
          cli: >-
            databricks warehouses create --json
            '{"name":"analyst-sql","warehouse_type":"PRO","cluster_size":"Small","enable_serverless_compute":true,"auto_stop_mins":10}'

            # then grant CAN_USE on it to the group that has been starting clusters instead
          doc_url: https://docs.databricks.com/aws/en/compute/sql-warehouse/create
          caveat: >-
            Access is the half a warehouse does not fix. Somebody who cannot use a warehouse but can
            start a cluster will start a cluster, so check the entitlements and the cluster policy
            alongside — that is what makes one path easier than the other.
      - id: CO-01-04
        title: Use up-to-date runtimes for your workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-up-to-date-runtimes-for-your-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: medium
        criteria: >-
          At least 90% of all-purpose clusters run DBR 14 or later. Older runtimes lack performance
          work that has since landed, so they cost more to do the same job.
        thresholds:
          pass_share: 0.9
          partial_share: 0.6
          min_runtime_major: 14
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Upgrade clusters to the latest long-term-support runtime.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set spark_version to the
            current LTS release

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/release-notes/runtime/
          caveat: >-
            Editing a running cluster restarts it, so the work on it stops. Apply this in a window
            where that is acceptable.
      - id: CO-01-05
        title: Only use GPUs for the right workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#only-use-gpus-for-the-right-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: low
        criteria: >-
          GPU compute exists only where a workload needs it. Reported rather than banded, because
          whether a given GPU cluster is justified cannot be read from its configuration.
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: >-
            Confirm each GPU cluster serves a deep-learning workload, and move the rest to CPU
            compute.
          by_hand: >-
            The finding names the GPU clusters. For each one, ask the team that runs it whether the
            workload trains or serves a model on the GPU. Where it does not — the common case is a
            general ETL cluster that was copied from a machine-learning template — change
            node_type_id to the equivalent CPU instance and restart. Where it does, nothing needs
            doing: this control is reported rather than banded for exactly that reason.
          doc_url: https://docs.databricks.com/aws/en/compute/gpu
      - id: CO-01-06
        title: Use serverless services for your workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-serverless-services-for-your-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: high
        alias_group: serverless-adoption
        criteria: >-
          At least 80% of compute spend runs on serverless. The partial band is wide because
          serverless migration is a programme of work rather than a setting, and partial adoption is
          real progress.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
        remediation:
          summary: Move eligible jobs, pipelines and warehouses to serverless compute.
          cli: >-
            databricks warehouses edit abc123def456 --enable-serverless-compute

            databricks pipelines update 0f1e2d3c --serverless

            # a task with no cluster of its own runs serverless, so the fix for a job is a removal

            databricks jobs get 620112326920 | jq '{job_id, new_settings: (.settings |
            del(.job_clusters) | .tasks |= map(del(.job_cluster_key, .existing_cluster_id,
            .new_cluster)))}' > job.json

            databricks jobs reset --json @job.json
          doc_url: https://docs.databricks.com/aws/en/compute/serverless/
          caveat: >-
            Serverless does not take an init script, a custom container or a specific instance type.
            Where a workload depends on one of those, the honest answer is that it stays on classic
            compute, and this requirement is the one to accept rather than fix.
      - id: CO-01-07
        title: Use the right instance type
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-the-right-instance-type
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is instance type chosen deliberately for each workload class, or does new work inherit
            whatever the last person used?
          evidence_guidance: >-
            The compute policies or job templates that fix instance families, and any note recording
            why those families were chosen for memory-bound, compute-bound or IO-bound work.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Node types are recorded per cluster and per-node CPU and memory are recorded alongside
              them, so a family mismatched to the load it carries is visible. Whether the family was
              chosen for the workload class or inherited is a fact about a decision, and no table
              holds it.
            signal: system.compute.clusters.worker_node_type with system.compute.node_timeline
      - id: CO-01-08
        title: Choose the most efficient compute size
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#choose-the-most-efficient-compute-size
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.node_utilization
        severity: medium
        criteria: >-
          No cluster averages under 5% combined CPU across every sample it has for the window. A
          cluster that idles that low for the whole window has never used what it is given; a
          cluster above the threshold is not thereby shown to be right-sized, so the measure only
          ever fails an estate over the clusters it can show are idle, and reports unmeasured rather
          than a pass otherwise.
        remediation:
          summary: >-
            Reduce the worker count or instance size on a cluster idling near zero for the whole
            window.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # reduce num_workers, or the
            node_type_id, to match the CPU it actually uses

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/compute/cluster-config-best-practices
          caveat: >-
            Confirm the window covered the workload’s normal running time before downsizing — a
            cluster idle because it caught a quiet week reads identically to one that is genuinely
            oversized, and the fix for one is a schedule change rather than a smaller instance.
      - id: CO-01-09
        title: Right-size compute resources at deployment
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#right-size-compute-resources-at-deployment
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Do new workloads get sized against a measured baseline before they go to production, or
            sized generously and left?
          evidence_guidance: >-
            The deployment checklist or review step that requires a sizing figure, and one recent
            example where the figure changed the configuration that shipped.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              A cluster’s size at creation and its utilisation over the days after are both
              recorded, so sizing generously and leaving it shows up without anybody being asked.
              Whether a sizing figure was required at review is a property of a process the platform
              does not see.
            signal: system.compute.clusters.create_time with system.compute.node_timeline
      - id: CO-01-10
        title: Evaluate performance-optimized query engines
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#evaluate-performance-optimized-query-engines
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: medium
        alias_group: photon
        criteria: >-
          At least 70% of eligible spend runs on a vectorised engine. An estate almost entirely on
          serverless gets this by architecture, since Photon is not a setting there.
        thresholds:
          pass_share: 0.7
          partial_share: 0.3
          serverless_credit_share: 0.95
        remediation:
          summary: Enable Photon on clusters running SQL and Delta workloads.
          cli: >-
            databricks warehouses edit abc123def456 --enable-photon

            databricks pipelines update 0f1e2d3c --photon

            databricks clusters get 1234-567890-abc123 > cluster.json   # set runtime_engine to
            PHOTON

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/compute/photon
          caveat: >-
            Photon bills at a higher DBU rate and earns it back by finishing sooner, which it does
            for SQL and Delta work and does not for a Python UDF that spends its time outside the
            engine. Compare the job’s cost before and after rather than assuming either direction.
  - id: CO-02
    title: 2. Dynamically allocate resources
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#2-dynamically-allocate-resources
    controls:
      - id: CO-02-01
        title: Use auto-scaling compute
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-auto-scaling-compute
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: medium
        alias_group: compute-autoscaling
        criteria: At least 80% of all-purpose clusters autoscale rather than running at a fixed size.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Enable autoscaling with a sensible minimum on long-lived clusters.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # replace num_workers with
            autoscale: {min_workers, max_workers}

            databricks clusters edit --json @cluster.json

            databricks cluster-policies create --name autoscaling-required \
              --definition '{"autoscale.min_workers": {"type": "range", "minValue": 1}, "autoscale.max_workers": {"type": "range", "maxValue": 8}}'
          doc_url: https://docs.databricks.com/aws/en/compute/configure
          caveat: >-
            A minimum of one worker is not always right: a cluster serving interactive queries with
            a minimum of one will scale up while somebody waits. Set the minimum to the size the
            workload needs at rest.
      - id: CO-02-02
        title: Use auto termination
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-auto-termination
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          Every all-purpose cluster terminates automatically. An idle cluster without it bills until
          someone notices, which is the most common avoidable cost in an estate.
        thresholds:
          pass_share: 1
          partial_share: 0.7
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Set auto-termination on every all-purpose cluster and enforce it through a policy.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set
            autotermination_minutes to 30

            databricks clusters edit --json @cluster.json

            databricks cluster-policies create --name termination-required \
              --definition '{"autotermination_minutes": {"type": "range", "maxValue": 60, "defaultValue": 30}}'
          doc_url: https://docs.databricks.com/aws/en/compute/configure
      - id: CO-02-03
        title: Use compute policies to control costs
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#use-compute-policies-to-control-costs
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          At least 90% of clusters are created from a policy. Policies are what make the other
          compute controls hold over time instead of being re-fixed after every drift.
        thresholds:
          pass_share: 0.9
          partial_share: 0.5
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Define compute policies and restrict cluster creation to them.
          cli: |-
            databricks cluster-policies create --name governed-all-purpose \
              --definition '{"autotermination_minutes": {"type": "range", "maxValue": 60, "defaultValue": 30}, "custom_tags.cost_centre": {"type": "unlimited", "isOptional": false}}'
            databricks cluster-policies set-permissions <policy-id> \
              --json '{"access_control_list": [{"group_name": "data-engineers", "permission_level": "CAN_USE"}]}'
            # then take "Unrestricted cluster creation" off those groups in the account console
          doc_url: https://docs.databricks.com/aws/en/admin/clusters/policies
          caveat: >-
            Clusters created before the policy keep their configuration: a policy constrains new
            clusters and edits, not existing ones. Both halves of this finding stay until the fleet
            is recreated or edited.
  - id: CO-03
    title: 3. Monitor and control cost
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#3-monitor-and-control-cost
    controls:
      - id: CO-03-01
        title: Setup tagging for cost attribution
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#setup-tagging-for-cost-attribution
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.attribution
        severity: high
        criteria: >-
          At least 80% of spend carries a custom tag attributing it to a team or workload. Untagged
          spend has no owner, which is what makes it nobody's to reduce.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
        remediation:
          summary: >-
            Require cost-centre tags through compute policies, and budget policies for serverless
            spend.
          cli: |-
            databricks cluster-policies create --name cost-attributed \
              --definition '{"custom_tags.cost_centre": {"type": "unlimited", "isOptional": false}, "custom_tags.owner": {"type": "unlimited", "isOptional": false}}'
          doc_url: https://docs.databricks.com/aws/en/admin/account-settings/usage-detail-tags
          caveat: >-
            Serverless spend carries no cluster tags, because there is no cluster to tag. It is
            attributed through a budget policy in the account console instead, and an estate mostly
            on serverless will not close this finding with compute policies alone.
      - id: CO-03-02
        title: Set up budgets and alerts to enable monitoring of account spending
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#set-up-budgets-and-alerts-to-enable-monitoring-of-account-spending
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are budgets set with alert thresholds that reach a named person, and has an alert
            actually been acted on?
          evidence_guidance: >-
            The budget configuration and the destination alerts go to. A shared mailbox nobody reads
            is a not-met, however well configured.
          cadence_days: 180
          asked_because:
            verdict: beyond-telemetry
            why: >-
              Budgets are account-plane objects. Checked rather than assumed: `system.billing` holds
              four tables — usage, attributed usage, list prices and account prices — and no budget
              among them, and `/api/2.1/budget-policies` answers Not Found from a workspace. The
              part that decides the answer is further out still: whether an alert reached somebody
              who acted on it is not recorded by anything.
      - id: CO-03-03
        title: Monitor costs to align spending with expectations
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#monitor-costs-to-align-spending-with-expectations
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Does someone compare actual spend against what was expected on a regular cadence, and
            does that comparison have consequences?
          evidence_guidance: >-
            The dashboard or report used, the cadence it is reviewed at, and one decision that came
            out of a review.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Reads of the billing tables are recorded like any other query, so whether anybody
              looks at spend, and how regularly, is measurable. Whether the comparison has
              consequences is the half the question is really for, and nothing records a decision
              that followed a dashboard.
            signal: system.query.history filtered to reads of system.billing
      - id: CO-03-04
        title: Manage costs to align usage with organizational needs
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#manage-costs-to-align-usage-with-organizational-needs
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When spend on a workload turns out not to be worth it, is there a route by which that
            workload changes or stops?
          evidence_guidance: >-
            A recent example: a job retired, a schedule reduced, a warehouse downsized because of
            cost. Without one, this is aspiration rather than practice.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              A warehouse downsized, a schedule reduced or a job retired are all recorded as changes
              with timestamps, so the route existing is observable. That cost was the reason is not:
              the platform records the edit and never the motive.
            signal: >-
              system.compute.warehouses change history with system.lakeflow.jobs.paused and
              delete_time
      - id: CO-03-05
        title: Monitor storage volume, cost and growth
        provenance: extension
        rationale: >-
          The cost pillar covers compute spend in detail but does not treat stored bytes as a cost
          to monitor, yet storage is a standing charge that grows without anyone deciding to grow
          it. An estate can be compute-efficient and still waste substantially on abandoned tables,
          unbounded history and orphaned files. Proposed for upstream inclusion.
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        evaluator_status: implemented
        coverage_mode: sampled
        criteria: >-
          Active bytes and file counts are measured, so growth is visible before it becomes a
          surprise, and small-file pressure is reported alongside the total because bytes alone hide
          it. Read from the platform's per-table storage snapshot where that has rows, and otherwise
          from the per-table Delta log pass, which covers a stated subset. Neither counts bytes that
          are no longer referenced by any table version, so the cloud-side bill is larger than the
          number here.
        remediation:
          summary: >-
            Review growth against expectation, and OPTIMIZE the tables reported as holding small
            files. For total bucket size including unreferenced files, measure at the cloud provider
            against the external locations.
          sql: |-
            OPTIMIZE main.sales.orders;
            ALTER TABLE main.sales.orders CLUSTER BY AUTO;
          doc_url: https://docs.databricks.com/aws/en/delta/optimize
          caveat: >-
            Sampled where the platform's per-table snapshot is empty, so a passing result describes
            the tables read rather than every table. Cloud-side storage totals need a Unity Catalog
            service credential, which the app does not require.
      - id: CO-03-06
        title: Run VACUUM to reclaim storage from stale files
        provenance: extension
        rationale: >-
          Delta retains files that are no longer part of the current table version. Without VACUUM
          they accumulate indefinitely and are paid for indefinitely. Predictive optimization
          performs this automatically on managed tables, so this control is only meaningful where it
          is absent. Proposed for upstream inclusion.
        measurability: system-table
        collector: sql:maintenance.recency
        severity: medium
        evaluator_status: implemented
        coverage_mode: complete
        criteria: Tables not covered by predictive optimization show a VACUUM within the expected interval.
        thresholds:
          max_days_since_vacuum: 30
        applicability:
          preconditions:
            - signal: describe:predictive_optimization.coverage
              operator: eq
              value: enabled
              outcome: satisfied-by-architecture
              scope: segment
              reason: >-
                Predictive optimization runs VACUUM automatically for these tables, so the absence
                of manual VACUUM is correct behaviour rather than a gap.
        remediation:
          summary: Run VACUUM on tables outside predictive optimization coverage, or enable it for them.
          sql: VACUUM catalog.schema.table;
          caveat: >-
            VACUUM permanently removes files older than the retention window, which shortens how far
            back time travel and RESTORE can reach. Reclaiming storage and retaining history are in
            direct tension; choose the retention deliberately rather than accepting the default.
      - id: CO-03-07
        title: Manage Delta history and time-travel retention
        provenance: extension
        alias_group: delta-history-retention
        rationale: >-
          Unbounded Delta history is simultaneously a cost problem and a recovery capability, which
          is why it appears in both this pillar and reliability and is scored once. Neither pillar
          currently addresses retention as a decision to be made rather than a default to inherit.
          Proposed for upstream inclusion.
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        evaluator_status: implemented
        coverage_mode: sampled
        criteria: >-
          Retention is set deliberately per table rather than left at the default, and no table pays
          to keep log history beyond the data files that make it usable. Scored once with its
          reliability counterpart, since shortening retention lowers the bill and narrows recovery
          by the same act.
        thresholds:
          min_reachable_days: 7
        remediation:
          summary: Set each Delta table to the shortest recovery window it safely needs.
          sql: |-
            ALTER TABLE main.sales.orders SET TBLPROPERTIES (
              'delta.logRetentionDuration' = 'interval 30 days',
              'delta.deletedFileRetentionDuration' = 'interval 8 days'
            );
          doc_url: https://docs.databricks.com/aws/en/delta/history
          caveat: >-
            Shortening retention reduces both storage cost and the recoverable window. The right
            value depends on the table's role, so there is no single correct setting. Setting the
            log window shorter than the file window pays to keep files no history can reach, which
            is the one combination that is wrong whatever the table does.
  - id: CO-04
    title: 4. Design cost-effective workloads
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#4-design-cost-effective-workloads
    controls:
      - id: CO-04-01
        title: Balance always-on and triggered streaming
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#balance-always-on-and-triggered-streaming
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        criteria: >-
          Streaming jobs that do not need continuous processing use triggered execution. A
          continuous stream holds compute permanently, so a job whose data arrives hourly pays for
          24 hours of readiness.
        thresholds:
          max_continuous_share: 0.25
        remediation:
          summary: Switch streams with relaxed latency requirements to AvailableNow triggers.
          by_hand: >-
            In the streaming query, replace .trigger(processingTime="...") or
            .trigger(continuous=...) with .trigger(availableNow=True), and give the job a schedule
            at the interval the data actually arrives on. The stream keeps its checkpoint, so it
            resumes where the continuous version stopped rather than reprocessing. Leave the streams
            where a consumer is waiting on sub-minute latency: this control asks which ones are not.
          doc_url: https://docs.databricks.com/aws/en/structured-streaming/triggers
      - id: CO-04-02
        title: Balance between on-demand and capacity excess instances
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices#balance-between-on-demand-and-capacity-excess-instances
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: low
        criteria: >-
          Spot capacity is used where interruption is tolerable. The band is low deliberately: spot
          is wrong for latency-critical work, so a low figure is not automatically a failure.
        thresholds:
          pass_share: 0.5
          partial_share: 0.2
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Use spot instances for fault-tolerant batch work, keeping the driver on-demand.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set
            aws_attributes.availability to SPOT_WITH_FALLBACK, first_on_demand to 1

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/compute/cluster-config-best-practices
          caveat: >-
            first_on_demand: 1 keeps the driver on guaranteed capacity, which is the difference
            between losing a worker and losing the run. On Azure the equivalent fields are
            azure_attributes.availability and spot_bid_max_price; on GCP,
            gcp_attributes.use_preemptible_executors.
