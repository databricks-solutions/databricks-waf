# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: interoperability-and-usability
  code: IU
  title: Interoperability and usability
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices
principles:
  - id: IU-01
    title: 1. Define standards for integration
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#1-define-standards-for-integration
    controls:
      - id: IU-01-01
        title: Use standard and reusable integration patterns for external integration
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-standard-and-reusable-integration-patterns-for-external-integration
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When a new external system needs to be integrated, is there a pattern to follow — or
            does each integration get designed from scratch?
          evidence_guidance: >-
            The documented patterns and one recent integration that used one. Count reuse, not the
            existence of a wiki page.
          cadence_days: 365
          asked_because:
            verdict: beyond-telemetry
            why: >-
              The platform records the integration that exists, never whether it followed an
              established pattern or was designed from scratch again. Reuse is a fact about how a
              design was arrived at, and two identical connections can differ entirely on it.
      - id: IU-01-02
        title: Use optimized connectors to ingest data sources into Databricks
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-optimized-connectors-to-ingest-data-sources-into-databricks
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.platform_census
        severity: medium
        criteria: >-
          Lakehouse Federation connections exist, so external sources are queried in place with
          pushdown rather than extracted on a schedule. An estate with none is unmeasured rather
          than failed: managed ingestion connectors, Auto Loader and partner tools register no
          connection.
        remediation:
          summary: Register external databases as federated connections instead of building extracts.
          sql: >-
            CREATE CONNECTION postgres_prod TYPE postgresql
              OPTIONS (host 'db.internal', port '5432', user secret('warehouse', 'user'), password secret('warehouse', 'password'));
            CREATE FOREIGN CATALOG postgres_prod USING CONNECTION postgres_prod OPTIONS (database
            'orders');
          doc_url: https://docs.databricks.com/aws/en/query-federation/
          caveat: >-
            Federation queries the source system, so a heavy query runs against the database
            somebody else depends on. Where the load matters, federate first and then materialise
            the parts that are read often — which is still a smaller job than maintaining an extract
            pipeline.
      - id: IU-01-03
        title: Use certified partner tools
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-certified-partner-tools
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are the third-party tools in your data path ones with a supported Databricks
            integration, or do some rely on generic JDBC and goodwill?
          evidence_guidance: >-
            The BI, ingestion and orchestration tools in use, and which of them are certified
            partners.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Every statement records the application that sent it, so the tools in the data path
              are enumerable and the question should arrive with that list already filled in —
              `sql:workload.sql_paths` reads it. What the enumeration cannot do is the part the
              requirement turns on. Which of those tools hold a current Databricks certification is
              a list Databricks maintains and revises, and an app carrying its own copy would answer
              from a stale one; the first audit of this said the app could hold that list, which was
              wrong in the direction that matters, because a confidently wrong certification claim
              is worse than a question.
            signal: system.query.history.client_application
      - id: IU-01-04
        title: Reduce complexity of data engineering pipelines
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#reduce-complexity-of-data-engineering-pipelines
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Has anyone deliberately reduced the number of hops and tools a dataset passes through,
            or has the pipeline only ever accreted?
          evidence_guidance: >-
            A simplification made in the last year: a stage removed, two jobs merged, a tool
            retired.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Lineage records how many hops a dataset passes through and how that has moved, so
              accretion is visible as a trend. Whether a simplification was made deliberately in the
              last year is a claim about intent that a shorter graph does not establish.
            signal: system.access.table_lineage
      - id: IU-01-05
        title: Use infrastructure as code (IaC) for deployments and maintenance
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-infrastructure-as-code-iac-for-deployments-and-maintenance
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: infrastructure-as-code
        criteria: Same measurement as OE-02-01, read from the interoperability side. Scored once.
  - id: IU-02
    title: 2. Utilize open interfaces and open data formats
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#2-utilize-open-interfaces-and-open-data-formats
    controls:
      - id: IU-02-01
        title: Use open data formats
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-open-data-formats
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        alias_group: open-table-formats
        criteria: >-
          Same requirement as CO-01-01, read as the open-format requirement: the reason to prefer
          Delta or Iceberg is that another engine can read it without a copy. Scored once through
          the alias group.
        thresholds:
          pass_share: 0.95
          partial_share: 0.7
      - id: IU-02-02
        title: Enable secure data and AI sharing for all data assets
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#enable-secure-data-and-ai-sharing-for-all-data-assets
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.platform_census
        severity: medium
        criteria: >-
          Where data crosses the account boundary it travels through Delta Sharing, with shares
          actually granted to recipients. An estate that shares nothing is not applicable rather
          than failing — whether to share is a business decision, not a posture defect.
        remediation:
          summary: Publish shared datasets through Delta Sharing rather than exporting copies.
          sql: |-
            CREATE SHARE IF NOT EXISTS sales_products;
            ALTER SHARE sales_products ADD TABLE main.sales.orders;
            CREATE RECIPIENT acme USING ID 'aws:us-west-2:<their-sharing-identifier>';
            GRANT SELECT ON SHARE sales_products TO RECIPIENT acme;
          doc_url: https://docs.databricks.com/aws/en/delta-sharing/
          caveat: >-
            A recipient without a sharing identifier is on the open protocol instead, which
            authenticates with a bearer token you have to deliver and rotate. Prefer the
            Databricks-to-Databricks form where the other side has an account.
      - id: IU-02-03
        title: Use open standards for developing agents, LLMs, and ML models
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-open-standards-for-developing-agents-llms-and-ml-models
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are models and agents built against portable interfaces, or tied to one vendor’s SDK in
            a way that would be costly to change?
          evidence_guidance: >-
            The frameworks and serving interfaces in use, and what a move away from one of them
            would require.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Whether serving points at an external vendor model or at a portable artefact is
              recorded per served entity, which answers the concrete half. What a move away would
              cost is a judgement about code the platform does not hold.
            signal: system.serving.served_entities.external_model_config and foundation_model_config
  - id: IU-03
    title: 3. Simplify new use case implementation
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#3-simplify-new-use-case-implementation
    controls:
      - id: IU-03-01
        title: Provide a self-service experience across the platform
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#provide-a-self-service-experience-across-the-platform
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Can a team start a new use case — get compute, a catalogue location and access — without
            a ticket to a central team?
          evidence_guidance: >-
            The actual path a new team takes today and how long it takes. If the answer involves
            waiting on an admin, say so.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Who creates compute and catalogue objects is audited, so whether teams provision for
              themselves or a central few do it for everybody is visible. How long a ticket takes,
              and whether one is needed at all, is not recorded.
            signal: system.access.audit create actions by principal
      - id: IU-03-02
        title: Use serverless compute
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-serverless-compute
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: medium
        alias_group: serverless-adoption
        criteria: >-
          Same requirement as CO-01-06, read from the interoperability side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
      - id: IU-03-03
        title: Use predefined compute templates
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-predefined-compute-templates
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: medium
        alias_group: compute-templates
        criteria: Same measurement as OE-02-02, read as the predefined-templates requirement. Scored once.
        thresholds:
          pass_share: 0.9
          partial_share: 0.5
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
      - id: IU-03-04
        title: Use AI capabilities to increase productivity
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#use-ai-capabilities-to-increase-productivity
        evaluator_status: implemented
        measurability: rest-api
        collector: rest:workspace:serving-endpoints
        severity: medium
        criteria: >-
          Model serving or vector search endpoints exist. Read from the two control-plane scopes an
          app can actually be granted. SQL AI functions, Genie and the assistant leave no endpoint
          behind, so an estate using only those is unmeasured rather than failing — which is what
          the attestation asks about.
        remediation:
          summary: >-
            Use Model Serving, Vector Search or AI functions instead of building the equivalent
            yourself.
          cli: |-
            databricks serving-endpoints create summarise \
              --json '{"config": {"served_entities": [{"name": "llama", "entity_name": "system.ai.llama_v3_3_70b_instruct", "entity_version": "1", "scale_to_zero_enabled": true, "workload_size": "Small"}]}}'
          doc_url: https://docs.databricks.com/aws/en/machine-learning/model-serving/
          caveat: >-
            The SQL ai_* functions need no endpoint at all and are the right answer for
            classification, extraction and summarisation inside a query. They leave nothing behind
            for this control to read, which is why an estate using only those reports as unmeasured
            rather than failing.
  - id: IU-04
    title: 4. Ensure data consistency and usability
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#4-ensure-data-consistency-and-usability
    controls:
      - id: IU-04-01
        title: Offer reusable data-as-products that the business can trust
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#offer-reusable-data-as-products-that-the-business-can-trust
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.platform_census
        severity: medium
        alias_group: data-products
        criteria: >-
          Published assets carry tags, so a consumer can tell a product from a working table. Caps
          at partial: whether the business trusts them is not something the metastore records.
        remediation:
          summary: Tag published tables with their status and owner so consumers can tell what to build on.
          sql: >-
            ALTER TABLE main.sales.orders SET TAGS ('certification' = 'gold', 'owner' =
            'sales-platform');

            ALTER SCHEMA main.sales SET TAGS ('layer' = 'published');
          doc_url: https://docs.databricks.com/aws/en/database-objects/tags
          caveat: >-
            Tag the schema where a whole layer shares a status, and the table where it does not.
            Tagging every table individually is how a tagging convention stops being maintained.
      - id: IU-04-02
        title: Publish data products semantically consistent across the enterprise
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#publish-data-products-semantically-consistent-across-the-enterprise
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.platform_census
        severity: medium
        alias_group: data-products
        criteria: Same measurement as IU-04-01, read as the semantic-consistency requirement. Scored once.
      - id: IU-04-03
        title: Provide a central catalog for discovery and lineage
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/interoperability-and-usability/best-practices#provide-a-central-catalog-for-discovery-and-lineage
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        criteria: >-
          Scored on the weaker of description and lineage rather than their average, because
          discovery fails at its weakest link: a table nobody described is not findable, and a
          well-described one with no lineage cannot be traced to its source. Registration is not
          scored — every table the census can see is already in Unity Catalog — and an empty lineage
          window drops lineage out of the verdict rather than scoring it as zero.
        thresholds:
          pass_share: 0.7
          partial_share: 0.3
        remediation:
          summary: >-
            Describe the tables consumers use, and run production work on compute that emits
            lineage.
          by_hand: >-
            The finding reports two shares — described, and appearing in lineage — and the score is
            the weaker of them, so start there. Descriptions are the one you can change directly,
            with COMMENT ON TABLE. Lineage cannot be written at all: it accumulates as workloads run
            through Unity Catalog compute, so the fix for that share is the compute, and then
            waiting. An empty lineage window is left out of the verdict rather than scored as zero,
            so do not invent lineage work to fill a fortnight nothing ran in. Registration is not a
            third share: every table the census can see is already in Unity Catalog.
          doc_url: https://docs.databricks.com/aws/en/discover/
