# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: operational-excellence
  code: OE
  title: Operational excellence
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices
principles:
  - id: OE-01
    title: 1. Optimize build and release processes
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#1-optimize-build-and-release-processes
    controls:
      - id: OE-01-01
        title: Create a dedicated Databricks operations team
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#create-a-dedicated-databricks-operations-team
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is there a named team or person accountable for the platform itself, distinct from the
            teams building on it?
          evidence_guidance: Who is on call for the platform, and what they own that the workload teams do not.
          cadence_days: 365
          asked_because:
            verdict: beyond-telemetry
            why: >-
              Whether a team exists and what it is accountable for is an organisational fact. No
              table records reporting lines, and a workspace with one attentive engineer looks
              identical to a workspace with a staffed platform team.
      - id: OE-01-02
        title: Use Enterprise source code management (SCM)
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-enterprise-source-code-management-scm
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: infrastructure-as-code
        criteria: >-
          Same measurement as OE-02-01, read as the source-control requirement. Scored once. Caps at
          partial for the same reason: a Terraform-managed estate carries no marker and cannot be
          told from a hand-built one, so the absence of bundles asks rather than fails.
      - id: OE-01-03
        title: Standardize DevOps processes (CI/CD)
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#standardize-devops-processes-cicd
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Does production code reach production through a pipeline with review and tests, rather
            than by being edited in place?
          evidence_guidance: >-
            The CI/CD system, what it runs before deploying, and whether production write access
            exists outside it.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Deployment provenance shows code arrived by a deploy rather than by hand, which is the
              observable half. Whether review and tests ran before that deploy happened in a
              pipeline outside the platform, and nothing here records it.
            signal: system.lakeflow.jobs.deployment
      - id: OE-01-04
        title: Standardize MLOps processes
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#standardize-mlops-processes
        evaluator_status: implemented
        measurability: system-table
        collector: sql:serving.model_entities
        severity: medium
        criteria: >-
          Custom models on managed serving endpoints and job-sourced MLflow runs together evidence
          that MLOps tooling is in use. Caps at partial: the presence of the right platform features
          does not prove the process is documented, gated or reproducible. Empty on both signals →
          unmeasurable, following the same asymmetry as PE-02-02: a workspace serving models from
          its own service or training on a separate platform leaves nothing here to read.
        remediation:
          summary: >-
            Define the end-to-end path a model takes from experiment to production: training run
            tracked in MLflow, model registered in Unity Catalog with a version, served through a
            managed endpoint pinned to that version.
          sql: >-
            -- Register the model from a tracked run

            CREATE MODEL IF NOT EXISTS prod.models.fraud_scoring;

            -- Tag the experiment for auditability

            ALTER EXPERIMENT 'fraud/experiments/v3' SET TAGS ('team' = 'data-science', 'env' =
            'prod');
          doc_url: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
      - id: OE-01-05
        title: Define environment isolation strategy
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#define-environment-isolation-strategy
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are development, test and production genuinely isolated, such that a mistake in
            development cannot reach production data?
          evidence_guidance: >-
            The boundary: separate workspaces, separate catalogues, separate credentials. Note any
            identity that spans two of them.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              Grants held by a development identity on production catalogues are recorded, so the
              catalogue half of isolation is measurable. Isolation at the network and cloud account
              layer is outside a workspace’s view, and it is where the question’s worst case lives.
            signal: system.information_schema.table_privileges with system.access.audit
      - id: OE-01-06
        title: Define catalog strategy for your enterprise
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#define-catalog-strategy-for-your-enterprise
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        criteria: >-
          Assets are spread across more than one catalog rather than piled into a single one. Caps
          at partial: the metastore shows that a boundary exists but not whether it is the
          environment, domain or team boundary you intended.
        remediation:
          summary: >-
            Choose a catalog boundary — environment, domain or team — and organise catalogs along
            it.
          sql: >-
            CREATE CATALOG IF NOT EXISTS prod COMMENT 'Production data. Written by scheduled jobs
            only.';

            GRANT USE CATALOG ON CATALOG prod TO `analysts`;

            CREATE SCHEMA prod.sales;
          doc_url: https://docs.databricks.com/aws/en/catalogs/
          caveat: >-
            Moving an existing table between catalogs is a copy, not a rename, so pick the boundary
            before the estate grows into the wrong one. Environment is the boundary most
            organisations regret not choosing: it is the one that lets a grant say "nobody writes to
            production by hand".
  - id: OE-02
    title: 2. Automate deployments and workloads
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#2-automate-deployments-and-workloads
    controls:
      - id: OE-02-01
        title: Use infrastructure as code (IaC) for deployments and maintenance
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-infrastructure-as-code-iac-for-deployments-and-maintenance
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: infrastructure-as-code
        criteria: >-
          Jobs carry a bundle deployment marker. Caps at partial and never fails: the Terraform
          provider writes jobs through the same API a person uses and leaves no marker, so an
          unmarked estate is either Terraform-managed or hand-built and this signal cannot tell them
          apart.
        remediation:
          summary: Define jobs and pipelines in a Databricks Asset Bundle and deploy them from CI.
          cli: |-
            databricks bundle init default-python
            databricks bundle generate job --existing-job-id 620112326920 --key nightly_load --bind
            databricks bundle deploy --target prod
          doc_url: https://docs.databricks.com/aws/en/dev-tools/bundles/
          caveat: >-
            A deployed bundle takes ownership of the job: edits made in the UI afterwards are
            reverted on the next deploy. That is the point, and it is worth telling the people who
            edit those jobs before the first deploy rather than after.
      - id: OE-02-02
        title: Standardize compute configurations
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#standardize-compute-configurations
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: medium
        alias_group: compute-templates
        criteria: >-
          At least 90% of all-purpose clusters are created from a compute policy. Not applicable to
          an all-serverless estate, which exposes no configuration for a template to settle.
        thresholds:
          pass_share: 0.9
          partial_share: 0.5
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Define compute policies and require them for cluster creation.
          cli: |-
            databricks policy-families list
            databricks cluster-policies create --name job-compute --policy-family-id job-cluster \
              --policy-family-definition-overrides '{"autotermination_minutes": {"type": "fixed", "value": 30}}'
          doc_url: https://docs.databricks.com/aws/en/admin/clusters/policies
          caveat: >-
            A template only settles the estate if the teams have to use it, which is a permission
            rather than a policy: while "unrestricted cluster creation" is granted, the next cluster
            can still be anything.
      - id: OE-02-03
        title: Use Unity Catalog managed tables
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-unity-catalog-managed-tables
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        criteria: >-
          At least 80% of tables with storage are Unity Catalog managed rather than external, so
          layout, statistics and cleanup are the platform’s responsibility. Views are excluded —
          they have no storage to manage.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: Create new tables as managed, and convert external tables whose storage you own.
          sql: |-
            ALTER CATALOG main SET MANAGED LOCATION 's3://our-bucket/main';
            -- no LOCATION clause, which is what makes it managed
            CREATE TABLE main.sales.orders AS SELECT * FROM main.sales.orders_external;
          doc_url: https://docs.databricks.com/aws/en/tables/managed
          caveat: >-
            Converting copies the data, so it costs a write of the table and leaves the old files
            behind for you to remove. Do it where the storage location is yours and nothing outside
            Databricks reads the path.
      - id: OE-02-04
        title: Use automated workflows for jobs
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-automated-workflows-for-jobs
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        criteria: >-
          At least 90% of jobs run on a schedule, a trigger or continuously. A paused schedule
          counts as unautomated, because it fires nothing until someone un-pauses it.
        thresholds:
          pass_share: 0.9
          partial_share: 0.6
        remediation:
          summary: Give each job a schedule or a file-arrival trigger instead of running it by hand.
          cli: |-
            databricks jobs update 620112326920 \
              --json '{"new_settings": {"schedule": {"quartz_cron_expression": "0 0 6 * * ?", "timezone_id": "UTC", "pause_status": "UNPAUSED"}}}'
          doc_url: https://docs.databricks.com/aws/en/jobs/schedule-jobs
          caveat: >-
            PAUSED counts as unautomated here, and it is the state a schedule is most often left in
            after an incident. A file-arrival trigger is the better answer where the work depends on
            data landing rather than on the clock.
      - id: OE-02-05
        title: Use automated and event-driven file ingestion
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-automated-and-event-driven-file-ingestion
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        criteria: >-
          Passes when any job in the estate is triggered by file arrival. A job on a periodic or
          cron schedule is not evidence of the opposite: `trigger_type` records how a job starts,
          not what it does, so an estate with none is unmeasured rather than failed.
        remediation:
          summary: Replace a schedule that polls for a file with a file-arrival trigger on the same path.
          cli: |-
            databricks jobs update 620112326920 \
              --json '{"new_settings": {"trigger": {"file_arrival": {"url": "/Volumes/main/landing/incoming/"}}}}'
          doc_url: https://docs.databricks.com/aws/en/jobs/file-arrival-triggers
          caveat: >-
            A file-arrival trigger watches one Unity Catalog volume or external location path; a job
            landing files in several places needs one trigger per path, or a single upstream
            location the others feed.
      - id: OE-02-06
        title: Use ETL frameworks for data pipelines
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-etl-frameworks-for-data-pipelines
        evaluator_status: implemented
        measurability: system-table
        collector: sql:pipelines.inventory
        severity: medium
        alias_group: declarative-pipelines
        criteria: >-
          At least half of orchestration is declarative pipelines rather than jobs. The share is
          biased low on purpose: a job that exists only to start a pipeline counts on the job side,
          because the jobs inventory does not record which jobs call a pipeline.
        thresholds:
          pass_share: 0.5
          partial_share: 0.15
        remediation:
          summary: Move transformation logic into a declarative pipeline and put it in production mode.
          cli: |-
            databricks bundle init default-python   # a pipeline resource, then
            databricks pipelines update 0f1e2d3c --development=false
          doc_url: https://docs.databricks.com/aws/en/dlt/
          caveat: >-
            A job whose only task starts a pipeline still counts on the job side of this
            measurement, deliberately: the orchestration is the job. Move the transformation itself,
            not the trigger.
      - id: OE-02-07
        title: Follow the deploy-code approach for ML workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#follow-the-deploy-code-approach-for-ml-workloads
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is the artefact promoted between environments the training code, or a model binary built
            in one environment and copied?
          evidence_guidance: >-
            What moves from development to production for one live model, and where the production
            model was trained.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              A served version that traces to a run recorded in this workspace, versus one that
              appears without any, separates promoted code from a copied binary in the common case.
              It does not do so reliably, because a legitimate promotion can carry its run history
              with it.
            signal: system.mlflow.runs_latest with system.serving.served_entities.entity_version
      - id: OE-02-08
        title: Use a model registry to decouple code and model lifecycle
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-a-model-registry-to-decouple-code-and-model-lifecycle
        measurability: system-table
        collector: sql:serving.model_entities
        severity: medium
        evaluator_status: implemented
        criteria: >-
          Every custom model on a managed serving endpoint carries a model version, so the endpoint
          resolves to a fixed registry entry rather than to whatever a name currently points at.
          Foundation and external models are excluded: the platform resolves those itself and they
          have no registry entry to reference. Which stage a version sits in is not on the serving
          row, so this reads the reference and not the promotion around it.
        remediation:
          summary: >-
            Point the endpoint at a registered model at a stated version rather than at a name that
            can move underneath it.
          cli: |-
            databricks serving-endpoints update-config --json '{
              "name": "fraud-scoring",
              "served_entities": [{"entity_name": "prod.models.fraud", "entity_version": "7"}]
            }'
          doc_url: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
          caveat: >-
            Pinning a version means a retrained model does not reach the endpoint until something
            updates it, which is the point and is also a deployment step somebody now owns. An alias
            gives the same audit trail with the update in one place.
      - id: OE-02-09
        title: Automate ML experiment tracking
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#automate-ml-experiment-tracking
        measurability: system-table
        collector: sql:mlflow.run_tracking
        severity: medium
        evaluator_status: implemented
        criteria: >-
          At least some MLflow runs in the window were started by a job or an MLflow project rather
          than by a person at a notebook. A check on existence, and the share is reported beside it
          rather than gating it: developing models in notebooks is the ordinary shape, so a low
          share is not a finding. Runs the platform recorded no source for are left out of the share
          rather than counted as manual.
        remediation:
          summary: >-
            Run the training notebook or script from a scheduled job, so the run is tracked without
            anybody remembering to track it.
          cli: |-
            databricks jobs create --json '{
              "name": "retrain-fraud-model",
              "tasks": [{"task_key": "train",
                "notebook_task": {"notebook_path": "/Repos/ml/train"},
                "environment_key": "default"}],
              "schedule": {"quartz_cron_expression": "0 0 3 * * ?", "timezone_id": "UTC"}
            }'
          doc_url: https://docs.databricks.com/aws/en/mlflow/tracking
          caveat: >-
            The source tag this reads is written by the MLflow client, so a run logged through a
            direct REST call carries no source and is unreadable here rather than manual. That group
            was an eighth of the runs on the estate this was calibrated against.
      - id: OE-02-10
        title: Reuse the same infrastructure to manage ML pipelines
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#reuse-the-same-infrastructure-to-manage-ml-pipelines
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Do ML pipelines run on the same managed infrastructure as data pipelines, or on
            separately maintained compute?
          evidence_guidance: What ML training and inference run on, and who patches it.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              ML work running as jobs and pipelines on the platform’s own compute is recorded and
              countable. Work running on separately maintained infrastructure is invisible precisely
              because it is elsewhere, so an empty result cannot distinguish good practice from a
              blind spot.
            signal: system.lakeflow.jobs and pipelines with system.compute.clusters
      - id: OE-02-11
        title: Utilize declarative management for complex data and ML projects
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#utilize-declarative-management-for-complex-data-and-ml-projects
        evaluator_status: implemented
        measurability: system-table
        collector: sql:pipelines.inventory
        severity: medium
        alias_group: declarative-pipelines
        criteria: Same measurement as OE-02-06, read as the declarative-management requirement. Scored once.
        thresholds:
          pass_share: 0.5
          partial_share: 0.15
  - id: OE-03
    title: 3. Manage capacity and quotas
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#3-manage-capacity-and-quotas
    controls:
      - id: OE-03-01
        title: Manage service limits and quotas
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#manage-service-limits-and-quotas
        evaluator_status: implemented
        measurability: system-table
        collector: sql:query.capacity
        severity: medium
        criteria: >-
          Statements with waiting_at_capacity_duration_ms > 0 prove a service limit was reached. Any
          positive count → partial (limits are biting; monitoring cannot be confirmed). Zero →
          partial (no events detected, but proactive monitoring is beyond telemetry). No queries at
          all → not-applicable. Caps at partial in all non-empty cases because headroom and forward
          awareness are account-plane facts not visible from the workspace.
        thresholds:
          partial_share: 0.01
        remediation:
          summary: >-
            Review your account service limits and quotas in the admin console. If statements are
            regularly waiting at capacity, raise a support ticket to increase the relevant quota, or
            reduce peak concurrency by staggering scheduled jobs.
          cli: |-
            # Query capacity events from the last 30 days
            databricks statement-execution execute --warehouse-id <id> \
              --statement "SELECT workspace_id, COUNT(*) as events, SUM(waiting_at_capacity_duration_ms) as total_wait_ms FROM system.query.history WHERE start_time >= current_timestamp() - make_dt_interval(30) AND waiting_at_capacity_duration_ms > 0 GROUP BY 1 ORDER BY 2 DESC"
          doc_url: https://docs.databricks.com/aws/en/admin/account-settings/service-quotas.html
          caveat: >-
            Account-level quota headroom is visible in the account console under Settings → Quotas,
            not in a workspace system table. Set up a Databricks alert on
            waiting_at_capacity_duration_ms from system.query.history if sustained capacity pressure
            is observed.
      - id: OE-03-02
        title: Invest in capacity planning
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#invest-in-capacity-planning
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is there a forward view of capacity and cost — growth, seasonality, new workloads —
            rather than reacting to invoices?
          evidence_guidance: The plan or model, when it was last updated, and what changed as a result.
          cadence_days: 180
          asked_because:
            verdict: beyond-telemetry
            why: >-
              A forward view is a plan. Growth and seasonality are measurable in arrears from
              billing, but whether anybody looked ahead and produced a number is not something the
              estate records.
  - id: OE-04
    title: 4. Set up monitoring, alerting, and logging
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#4-set-up-monitoring-alerting-and-logging
    controls:
      - id: OE-04-01
        title: Establish monitoring processes
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#establish-monitoring-processes
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: job-monitoring
        criteria: >-
          At least 80% of jobs whose definitions record the field carry a health rule. Job
          definitions older than the health-rules column are excluded from both halves rather than
          counted as unmonitored.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
        remediation:
          summary: Add a health rule and a failure notification to each production job.
          cli: |-
            databricks jobs update 620112326920 \
              --json '{"new_settings": {"health": {"rules": [{"metric": "RUN_DURATION_SECONDS", "op": "GREATER_THAN", "value": 5400}]}, "email_notifications": {"on_failure": ["platform-oncall@example.com"], "on_duration_warning_threshold_exceeded": ["platform-oncall@example.com"]}}}'
          doc_url: https://docs.databricks.com/aws/en/jobs/notifications
          caveat: >-
            Set the duration threshold from the job’s own history rather than a round number: a rule
            at twice the normal runtime catches a hang, and one at ten times catches nothing.
      - id: OE-04-02
        title: Use native and external tools for platform monitoring
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/operational-excellence/best-practices#use-native-and-external-tools-for-platform-monitoring
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: job-monitoring
        criteria: >-
          Same measurement as OE-04-01, read as the native-and-external-tooling requirement. Scored
          once. External monitoring built on the audit logs is invisible here, which is what the
          attestation asks about.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
