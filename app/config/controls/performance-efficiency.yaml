pillar:
  id: performance-efficiency
  code: PE
  title: Performance efficiency
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices
principles:
  - id: PE-01
    title: 1. Vertical scaling, horizontal scaling, and linear scalability
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#1-vertical-scaling-horizontal-scaling-and-linear-scalability
    controls: []
  - id: PE-02
    title: 2. Use serverless architectures
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#2-use-serverless-architectures
    controls:
      - id: PE-02-01
        title: Use serverless compute
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-serverless-compute
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: high
        alias_group: serverless-adoption
        criteria: >-
          Same requirement as CO-01-06, read from the performance side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
      - id: PE-02-02
        title: Use an enterprise grade model serving service
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-an-enterprise-grade-model-serving-service
        measurability: system-table
        collector: sql:serving.model_entities
        severity: medium
        evaluator_status: implemented
        criteria: >-
          Models are served on managed serving endpoints. A positive check, and the only direction
          this table can be read in: it records managed serving and nothing else, so an account with
          no endpoints is one that serves no models or one that built its own service, and the
          resolver reports that as unreadable rather than as a fail.
        remediation:
          summary: >-
            Serve the model from a Databricks serving endpoint rather than from a service the team
            maintains.
          cli: |-
            databricks serving-endpoints create --json '{
              "name": "fraud-scoring",
              "config": {"served_entities": [{
                "entity_name": "prod.models.fraud", "entity_version": "7",
                "workload_size": "Small", "scale_to_zero_enabled": true}]}
            }'
          doc_url: https://docs.databricks.com/aws/en/machine-learning/model-serving/
          caveat: >-
            Scale-to-zero costs a cold start on the first request after an idle period, which is the
            trade that makes an endpoint affordable to leave up. Where the caller cannot wait for
            it, the endpoint has to stay warm and be budgeted for.
  - id: PE-03
    title: 3. Design workloads for performance
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#3-design-workloads-for-performance
    controls:
      - id: PE-03-01
        title: Understand your data ingestion and access patterns
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#understand-your-data-ingestion-and-access-patterns
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Do you know how your largest datasets are read — which columns, which filters, how often
            — rather than inferring it?
          evidence_guidance: >-
            The query history or profiling used to establish access patterns, and one layout
            decision that followed from it.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              How the largest datasets are read is recorded in detail — partitions touched, files
              pruned, bytes scanned, how often. Whether the team knows any of that is a different
              claim, and it is the one asked.
            signal: system.query.history.read_partitions, pruned_files and read_bytes
      - id: PE-03-02
        title: Use parallel computation where it is beneficial
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-parallel-computation-where-it-is-beneficial
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Where work could run in parallel, does it — or do pipelines run stages sequentially
            because that is how they were written?
          evidence_guidance: >-
            One pipeline where parallelism was introduced deliberately, and one where sequence is a
            known limitation.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              The task graph records where a job runs stages in sequence with no dependency between
              them, which is the common form of this problem. Parallelism inside a single task is
              invisible, so a clean graph does not settle the answer.
            signal: system.lakeflow.job_tasks.depends_on_keys
      - id: PE-03-03
        title: Analyze the whole chain of execution
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#analyze-the-whole-chain-of-execution
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When something is slow, do you profile the whole chain — source, transfer, compute, sink
            — or tune the Spark job by reflex?
          evidence_guidance: >-
            The last performance investigation: where the time actually went, and whether that was
            where you first looked.
          cadence_days: 180
          asked_because:
            verdict: beyond-telemetry
            why: >-
              This asks how people diagnose a problem — whether they look at the whole chain or
              reach for the Spark job. The platform records the workload and never the method used
              to look at it.
      - id: PE-03-04
        title: Prefer larger clusters
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#prefer-larger-clusters
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Has anyone tested whether a larger cluster finishes your heavy jobs faster for the same
            or lower cost?
          evidence_guidance: >-
            A comparison run at two sizes, with the runtime and cost of each. Intuition about
            cluster size is usually wrong in one direction or the other.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Cluster size, node utilisation and run duration together show whether heavy jobs are
              under-provisioned, which is the substance. Whether a larger size was actually tried
              and compared on cost is an experiment, and an untried option leaves no trace.
            signal: system.compute.clusters.worker_count with node_timeline and job_task_run_timeline
      - id: PE-03-05
        title: Use predictive optimization
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-predictive-optimization
        evaluator_status: implemented
        measurability: system-table
        collector: describe:predictive_optimization.coverage
        severity: medium
        criteria: >-
          Predictive optimization is enabled across managed tables, so layout maintenance happens
          without anyone scheduling it. Where it is on, absent manual maintenance is correct rather
          than a finding.
        thresholds:
          pass_share: 1
          partial_share: 0.5
        remediation:
          summary: Enable predictive optimization at catalog level so new schemas inherit it.
          sql: ALTER CATALOG main ENABLE PREDICTIVE OPTIMIZATION;
          doc_url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization
      - id: PE-03-06
        title: Use Unity Catalog managed tables
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-unity-catalog-managed-tables
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        criteria: >-
          At least 80% of tables are managed, so the platform can maintain them. External tables put
          layout, compaction and cleanup back on you.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: >-
            Prefer managed tables for new data, and convert external tables where the location is
            not required.
          sql: |-
            CREATE TABLE main.sales.orders AS SELECT * FROM main.sales.orders_external;
            ALTER CATALOG main ENABLE PREDICTIVE OPTIMIZATION;
          doc_url: https://docs.databricks.com/aws/en/tables/managed
          caveat: >-
            Being managed is what lets the platform compact, cluster and vacuum a table without
            being asked, which is why this is a performance requirement and not only a governance
            one. An external table gets none of that until somebody schedules it.
      - id: PE-03-07
        title: Use native Spark operations
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-native-spark-operations
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is transformation logic written in native Spark operations, or does it fall back to
            row-at-a-time UDFs and Python loops in hot paths?
          evidence_guidance: Any UDF or driver-side loop in a production hot path, and why it is there.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              A UDF registered in Unity Catalog is catalogued with the language it is written in, so
              Python functions callable from SQL are enumerable — four of them on the labs
              workspace. That is one of the two shapes this warns about. The other happens inside
              notebook Python, where a driver-side loop over a collected DataFrame is a property of
              code the platform neither stores nor parses, and no count of registered functions
              reaches it.
            signal: system.information_schema.routines.external_language
      - id: PE-03-08
        title: Use native platform engines
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-native-platform-engines
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: medium
        alias_group: photon
        criteria: >-
          Same requirement as CO-01-10, read from the performance side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.7
          partial_share: 0.3
          serverless_credit_share: 0.95
      - id: PE-03-09
        title: Understand your hardware and workload type
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#understand-your-hardware-and-workload-type
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is compute matched to workload character — memory-heavy, shuffle-heavy, GPU — rather
            than one family used for everything?
          evidence_guidance: >-
            The mapping from workload type to instance family, and any workload known to be on the
            wrong one.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Whether a workload is memory-bound or CPU-bound is recorded as utilisation, and the
              hardware it was given is recorded beside it, so a mismatch is visible. Whether the
              match was intended is not, and one family used for everything can still fit everything
              by luck.
            signal: system.compute.node_timeline with system.compute.clusters node types
      - id: PE-03-10
        title: Use caching
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-caching
        evaluator_status: implemented
        measurability: system-table
        collector: sql:workload.sql_paths
        severity: medium
        criteria: >-
          At least half the bytes read from files came from cache. The denominator is the statements
          that read a file at all: on the workspace this was measured against, 3,621 of 5,885
          statements read nothing — answered from metadata or from memory — and a hit rate computed
          over those describes the workload rather than the cache. Result-cache hits are reported
          separately rather than counted as a miss, because a statement answered from them never
          reached the cache below.
        thresholds:
          pass_share: 0.5
          partial_share: 0.2
        remediation:
          summary: >-
            Find the repeated reads that are missing the cache, and give them compute that can hold
            the data.
          sql: |-
            -- Where the misses are, over the statements that read files
            SELECT compute.warehouse_id, count(*) AS statements,
                   round(sum(read_bytes * coalesce(read_io_cache_percent, 0) / 100.0) / sum(read_bytes) * 100, 1)
                     AS cached_percent
            FROM system.query.history
            WHERE start_time >= current_date() - INTERVAL 7 DAYS AND read_files > 0
            GROUP BY 1 ORDER BY statements DESC;
          doc_url: https://docs.databricks.com/aws/en/optimizations/disk-cache
          caveat: >-
            A low share is not always wrong. A workload that reads each row once has nothing to
            re-read, and the cache cannot help it — read this against what the queries do rather
            than as a target to hit.
      - id: PE-03-11
        title: Use compaction
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-compaction
        evaluator_status: implemented
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        criteria: >-
          Files average at least 16 MiB on tables large enough to hold one, whether kept that way by
          predictive optimization or by scheduled OPTIMIZE. The file size decides it rather than
          whether the command ran, because running OPTIMIZE and still holding tiny files is not a
          pass. Tables smaller than one target file are excluded rather than counted as failures:
          they cannot reach the target however they are written, and a control that says otherwise
          asks for work that cannot be done.
        thresholds:
          min_average_file_bytes: 16777216
        coverage_mode: sampled
        remediation:
          summary: Enable predictive optimization, or schedule OPTIMIZE on the tables queried most.
          sql: OPTIMIZE main.default.events;
          doc_url: https://docs.databricks.com/aws/en/delta/optimize
      - id: PE-03-12
        title: Use data skipping
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#use-data-skipping
        evaluator_status: implemented
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        criteria: >-
          No table disables file statistics, which turns skipping off outright, and tables large
          enough for skipping to change what a query reads organise their files by liquid
          clustering, automatic clustering or partitioning. Whether skipping is effective is not
          tested: that depends on the predicates queries use, which this scan does not read against
          table layout. So this measures whether skipping is possible, and says so.
        thresholds:
          min_bytes_for_skipping: 1073741824
          min_files_for_skipping: 10
          pass_share: 0.8
          partial_share: 0.4
        coverage_mode: sampled
        remediation:
          summary: >-
            Set liquid clustering on the largest actively read tables, and leave
            delta.dataSkippingNumIndexedCols at its default of 32.
          sql: ALTER TABLE catalog.schema.table CLUSTER BY (order_date);
          doc_url: https://docs.databricks.com/aws/en/delta/data-skipping
          caveat: >-
            Restoring the statistics property does not backfill statistics for files already
            written; those are collected when each file is next rewritten. Clustering an existing
            table rewrites data, so it costs compute once.
      - id: PE-03-13
        title: Avoid over-partitioning
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#avoid-over-partitioning
        evaluator_status: implemented
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        criteria: >-
          No table holding data below the size floor is partitioned. The floor is the WAF’s own
          published number, and liquid clustering counts in a table’s favour because the same page
          recommends it in preference to partitioning. A partitioned table holding nothing is
          excluded rather than failed: it has no partitions of any size, so how finely it is
          partitioned is not a question about reads. The companion rule — each partition holding at
          least 1GB — is not tested, because it needs partition cardinality that the per-table
          describe does not return.
        thresholds:
          min_bytes_before_partitioning: 1099511627776
        coverage_mode: sampled
        remediation:
          summary: >-
            Drop partitioning on tables below 1TB and use liquid clustering instead, which adapts as
            access patterns change.
          sql: ALTER TABLE catalog.schema.table CLUSTER BY (event_date);
          doc_url: https://docs.databricks.com/aws/en/delta/clustering
          caveat: >-
            Removing partitioning rewrites the table layout, so schedule it like any other rewrite.
            Liquid clustering and partitioning are mutually exclusive on the same table.
      - id: PE-03-14
        title: Optimize join performance
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#optimize-join-performance
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Have the joins in your heaviest queries been examined for strategy and skew, or are they
            left to the optimiser?
          evidence_guidance: >-
            One join that was changed after examination — broadcast, reordered, skew handled — and
            its effect.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Shuffle volume and local spill are recorded per statement and mark joins going badly,
              which finds the problem. Join strategy and skew live in the query profile, which has
              no system table, so the diagnosis the question asks for cannot be completed from
              telemetry.
            signal: system.query.history.shuffle_read_bytes and spilled_local_bytes
      - id: PE-03-15
        title: Run analyze table to collect table statistics
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#run-analyze-table-to-collect-table-statistics
        evaluator_status: implemented
        measurability: system-table
        collector: sql:maintenance.recency
        severity: low
        criteria: >-
          Statistics are refreshed, so the optimiser plans against the data as it is rather than as
          it was. Predictive optimization covers this on managed tables.
        remediation:
          summary: Run ANALYZE TABLE on large tables, or rely on predictive optimization for managed ones.
          sql: ANALYZE TABLE main.default.events COMPUTE STATISTICS FOR ALL COLUMNS;
          doc_url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-analyze-table
      - id: PE-03-16
        title: Enable deletion vectors to avoid rewriting files on delete and update
        provenance: extension
        rationale: >-
          This pillar covers compaction, data skipping and statistics, but not deletion vectors,
          which change the cost profile of every DELETE, UPDATE and MERGE by marking rows instead of
          rewriting whole files. It sits directly alongside the compaction and file-layout practices
          already documented here. Proposed for upstream inclusion.
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        evaluator_status: implemented
        coverage_mode: sampled
        criteria: >-
          Actively read tables mark deleted rows rather than rewriting whole files. Scored against
          tables read in the window rather than against every table, because on a table nobody
          modifies the feature changes nothing, and requiring it everywhere would be advice to churn
          table protocols for no gain.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: Enable deletion vectors on tables that see frequent DELETE, UPDATE or MERGE.
          sql: ALTER TABLE catalog.schema.table SET TBLPROPERTIES (delta.enableDeletionVectors = true);
          doc_url: https://docs.databricks.com/aws/en/delta/deletion-vectors
          caveat: >-
            Enabling deletion vectors raises the table's minimum reader version, so clients older
            than that can no longer read it. Check what reads the table before enabling.
  - id: PE-04
    title: 4. Run performance testing in the scope of development
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#4-run-performance-testing-in-the-scope-of-development
    controls:
      - id: PE-04-01
        title: Test on data representative of production data
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#test-on-data-representative-of-production-data
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is performance tested against data of production shape and scale, or against a small
            sample that hides the problems?
          evidence_guidance: What the test dataset is, and how its size and skew compare to production.
          cadence_days: 365
          asked_because:
            verdict: beyond-telemetry
            why: >-
              This compares test data against production data, and the platform records no notion of
              which estate is which. Volumes are visible; deciding that one catalogue is the test
              one requires a naming convention the platform neither knows nor enforces.
      - id: PE-04-02
        title: Consider prewarming resources
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#consider-prewarming-resources
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: For workloads with a start-of-day deadline, is compute warmed before the work arrives?
          evidence_guidance: Which workloads have a latency commitment and what is done about cold start for each.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              The cold start is timed rather than inferred: every statement records how long it
              waited for compute, and the warehouse event log records the start that made it wait.
              So a workload whose first run of the day pays a start-up penalty is identifiable. What
              is not recorded is the deadline — nothing says which workloads have one — so a penalty
              cannot be told from an acceptable wait, and warm compute cannot be told from compute
              that happened to still be up.
            signal: >-
              system.query.history.waiting_for_compute_duration_ms with
              system.compute.warehouse_events
      - id: PE-04-03
        title: Identify bottlenecks
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#identify-bottlenecks
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are bottlenecks identified from evidence — query profiles, Spark UI, metrics — rather
            than from where people expect them?
          evidence_guidance: >-
            The last bottleneck found, the tool that found it, and whether it was where you
            expected.
          cadence_days: 180
          asked_because:
            verdict: beyond-telemetry
            why: >-
              Asks where a diagnosis started: evidence or expectation. That is a fact about how
              people work, and the estate looks the same either way.
  - id: PE-05
    title: 5. Monitor performance
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#5-monitor-performance
    controls:
      - id: PE-05-01
        title: Configure performance monitoring at deployment
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#configure-performance-monitoring-at-deployment
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is monitoring configured when a workload ships, or added later when something goes
            wrong?
          evidence_guidance: >-
            The deployment checklist item covering monitoring, and one recent workload that shipped
            with it in place.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Health rules are recorded on a job with a change time, so monitoring added long after
              the job shipped is distinguishable from monitoring configured with it. Dashboards and
              monitoring built outside the platform are not recorded, and are common.
            signal: system.lakeflow.jobs.health_rules
      - id: PE-05-02
        title: Monitor query performance
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#monitor-query-performance
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Does anyone watch query performance over time, such that a query getting slower is
            noticed before a user reports it?
          evidence_guidance: The dashboard or alert on query latency, and the last regression it caught.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Whether anybody reads query history, and whether alerts exist over it, is recorded.
              Whether a query getting slower would be noticed before a user complained is a claim
              about attention that no signal settles.
            signal: system.query.history with system.access.audit for alert use
      - id: PE-05-03
        title: Monitor streaming workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#monitor-streaming-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        criteria: >-
          At least 80% of continuous jobs whose health rules are recorded carry a streaming-backlog
          rule (`STREAMING_BACKLOG_BYTES`, `_RECORDS`, `_SECONDS` or `_FILES`). An estate with no
          continuous job is not applicable: there is no streaming workload for a backlog alert to
          watch.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
        remediation:
          summary: Add a streaming-backlog health rule and its notification to each continuous job.
          cli: |-
            databricks jobs update 620112326920 \
              --json '{"new_settings": {"health": {"rules": [{"metric": "STREAMING_BACKLOG_SECONDS", "op": "GREATER_THAN", "value": 300}]}, "email_notifications": {"on_streaming_backlog_exceeded": ["platform-oncall@example.com"]}}}'
          doc_url: https://docs.databricks.com/aws/en/jobs/notifications
          caveat: >-
            Requires the Jobs service to track the streaming query directly — a task calling
            `awaitTermination()` blocks the driver and hides the query from it, so the rule never
            fires. Pick the metric (bytes, records, seconds or files) that matches what a consumer
            of the output actually cares about.
      - id: PE-05-04
        title: Monitor job performance
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/performance-efficiency/best-practices#monitor-job-performance
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: medium
        alias_group: job-monitoring
        criteria: >-
          Same measurement as OE-04-01, read as the job-performance requirement. Scored once. A
          duration health rule is what makes a job that has slowed visible without somebody watching
          it.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
