# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: data-and-ai-governance
  code: DG
  title: Data and AI governance
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices
principles:
  - id: DG-01
    title: 1. Unify data and AI management
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#1-unify-data-and-ai-management
    controls:
      - id: DG-01-01
        title: Establish a data and AI governance process
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#establish-a-data-and-ai-governance-process
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is there a written governance process for data and AI assets with named owners, and is
            it followed for new assets?
          evidence_guidance: >-
            The document, plus how a new dataset or model actually gets an owner assigned today. A
            process document nobody routes work through is partially met at best.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              An owner is recorded on every catalogue asset, so whether new assets get one is
              measurable and is the part of this that bites. Whether a written process exists and
              work is routed through it is an organisational fact with no telemetry.
            signal: system.information_schema.tables.table_owner
      - id: DG-01-02
        title: Design Unity Catalog for your organization
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#design-unity-catalog-for-your-organization
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: critical
        alias_group: unity-catalog-governed
        criteria: >-
          The tables, catalogs and schemas this Unity Catalog metastore holds. The census cannot see
          a legacy metastore, so the finding is a count of what is governed and not a share of an
          estate — a pass says how many, and does not claim that it is everything.
        remediation:
          summary: Migrate remaining Hive metastore tables to Unity Catalog.
          sql: |-
            SYNC SCHEMA main.sales FROM hive_metastore.sales DRY RUN;
            SYNC SCHEMA main.sales FROM hive_metastore.sales SET OWNER `data-platform`;
          doc_url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/migrate
          caveat: >-
            SYNC upgrades external tables in place, leaving the data where it is and pointing Unity
            Catalog at it. A managed Hive table has to be copied instead, with CREATE TABLE ... AS
            SELECT, because its storage belongs to the old metastore.
      - id: DG-01-03
        title: Manage metadata for all data and AI assets in one place
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#manage-metadata-for-all-data-and-ai-assets-in-one-place
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: critical
        alias_group: unity-catalog-governed
        criteria: >-
          Same measurement as DG-01-02, read as the single-place-for-metadata requirement. Scored
          once through the alias group. The count is of what this metastore holds, not of whether
          anything sits beside it.
      - id: DG-01-04
        title: Track data and AI lineage to drive visibility of the data
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#track-data-and-ai-lineage-to-drive-visibility-of-the-data
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.lineage_coverage
        severity: medium
        criteria: >-
          At least half of tables appear in lineage. Lineage is emitted by activity, so a table
          nothing read or wrote in the window is absent for a reason that is not a governance gap —
          which is why this band is far below the others.
        thresholds:
          pass_share: 0.5
          partial_share: 0.15
        remediation:
          summary: >-
            Run workloads through Unity Catalog-enabled compute so lineage is captured
            automatically.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set data_security_mode to
            USER_ISOLATION

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage
          caveat: >-
            Lineage follows activity, so a table nothing has read or written in the window stays
            absent even after the compute is fixed. The share this control measures moves as the
            next runs happen, not when the cluster is edited. Serverless and SQL warehouses already
            emit it.
      - id: DG-01-05
        title: Add consistent descriptions to your metadata
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#add-consistent-descriptions-to-your-metadata
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: low
        criteria: >-
          At least 80% of tables carry a description. The failure worth catching is an estate with
          almost none, so the partial band reaches down to 40%.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: Add comments to tables and columns, or generate them with AI-suggested documentation.
          sql: >-
            COMMENT ON TABLE main.sales.orders IS 'One row per placed order, from the checkout
            service.';

            ALTER TABLE main.sales.orders ALTER COLUMN order_id COMMENT 'Checkout service order
            id.';
          doc_url: https://docs.databricks.com/aws/en/comments/
          caveat: >-
            Catalog Explorer will suggest a description for a table from its schema and sample data,
            which is faster than writing several hundred by hand and worth reading before accepting:
            a generated comment describing what a column contains is useful, and one guessing why it
            exists is not.
      - id: DG-01-06
        title: Allow easy data discovery for data consumers
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#allow-easy-data-discovery-for-data-consumers
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.discovery
        severity: medium
        criteria: >-
          At least 80% of the tables that appear as a read in lineage over the window carry a
          description — the same band as DG-01-05, over the assets consumers reach for rather than
          the whole estate. Tags, owners and column comments are reported alongside and do not enter
          the band. An estate nothing read in the window is unmeasured rather than failed: there is
          no population to take the share over.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: >-
            Describe the tables consumers actually read first — the finding names how many there
            are, and it is a far shorter list than the estate.
          sql: >-
            COMMENT ON TABLE main.sales.orders IS 'One row per placed order, from the checkout
            service.';

            ALTER TABLE main.sales.orders SET TAGS ('domain' = 'sales');
          doc_url: https://docs.databricks.com/aws/en/discover/
          caveat: >-
            A consumer who searched, could not tell what an asset held and gave up reads nothing, so
            they leave no lineage and are not in the population this measures. Describing the read
            tables raises this share without reaching them, which is the argument for DG-01-05 as
            well as this one.
      - id: DG-01-07
        title: Govern AI assets together with data
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#govern-ai-assets-together-with-data
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: medium
        criteria: >-
          AI assets — models, functions, volumes — are registered in Unity Catalog alongside data
          rather than governed separately or not at all.
        remediation:
          summary: Register models in Unity Catalog and grant on them the same way as on tables.
          sql: |-
            GRANT EXECUTE ON MODEL main.ml.churn TO `ml-consumers`;
            GRANT READ VOLUME ON VOLUME main.ml.features TO `ml-consumers`;
          doc_url: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
          caveat: >-
            A model reaches the catalogue from the training run: set the MLflow registry URI to
            databricks-uc and register under a three-level name. Models left in the workspace
            registry cannot be granted on, which is what this requirement is asking about.
  - id: DG-02
    title: 2. Unify data and AI security
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#2-unify-data-and-ai-security
    controls:
      - id: DG-02-01
        title: Centralize access control for all data and AI assets
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#centralize-access-control-for-all-data-and-ai-assets
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is access to data and AI assets granted in one place, or do some assets still have
            permissions managed outside Unity Catalog?
          evidence_guidance: >-
            Any remaining access path that bypasses the catalogue: direct cloud storage grants,
            table ACLs on a legacy metastore, per-tool permissions.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              Unity Catalog grants are visible. The two common bypasses are not: a legacy metastore
              is invisible to every census this app runs, and grants made directly in cloud IAM are
              outside the platform, so no reading here can prove the absence of either.
            signal: system.information_schema.table_privileges, for the grants the catalogue can see
      - id: DG-02-02
        title: Configure audit logging
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#configure-audit-logging
        evaluator_status: implemented
        measurability: system-table
        collector: sql:governance.audit_coverage
        severity: high
        alias_group: audit-logging
        criteria: >-
          Audit events are being written and are no more than two days stale. A gap here is not only
          a governance failure; it removes the evidence any later investigation would depend on.
        thresholds:
          max_days_since_event: 2
        remediation:
          summary: >-
            Enable audit system tables at account level and grant the assessing identity SELECT on
            them.
          cli: |-
            databricks metastores current                              # the metastore id
            databricks system-schemas enable <metastore-id> access
            databricks system-schemas enable <metastore-id> compute
          sql: GRANT SELECT ON SCHEMA system.access TO `waf-assessor`;
          doc_url: https://docs.databricks.com/aws/en/admin/system-tables/audit-logs
          caveat: >-
            Events start arriving from the point the schema is enabled, not retroactively, so the
            staleness this control measures takes a day to clear even once the fix is in. Enabling
            the schema is an account-admin action; the grant is a metastore-admin one.
      - id: DG-02-03
        title: Audit data platform events
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#audit-data-platform-events
        evaluator_status: implemented
        measurability: system-table
        collector: sql:governance.audit_coverage
        severity: high
        alias_group: audit-logging
        criteria: >-
          Same measurement as DG-02-02, read as the platform-events requirement. Scored once through
          the alias group: one audit configuration satisfies both.
        thresholds:
          max_days_since_event: 2
  - id: DG-03
    title: 3. Establish data quality standards
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#3-establish-data-quality-standards
    controls:
      - id: DG-03-01
        title: Define clear data quality standards
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#define-clear-data-quality-standards
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are data quality expectations written down per dataset — completeness, freshness,
            accuracy — rather than assumed?
          evidence_guidance: >-
            Where the expectations for a specific production dataset are recorded, and who agreed
            them with the consumer.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              A declared constraint is the machine-readable form of an expectation, and a CHECK
              constraint is readable — as a `delta.constraints.*` table property, which this app
              already reads for the tables it samples. Not from the information schema:
              `check_constraints` carries the right columns and stays empty, verified by declaring
              one on a labs table and finding it in the properties and in neither constraint view.
              An expectation agreed with a consumer and written in a document rather than declared
              on the table is invisible either way, and is what this asks about.
            signal: >-
              DESCRIBE DETAIL properties, delta.constraints.* (already read as
              describe:storage.table_details)
      - id: DG-03-02
        title: Use data quality tools for profiling, cleansing, validating, and monitoring data
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#use-data-quality-tools-for-profiling-cleansing-validating-and-monitoring-data
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.quality_monitoring
        severity: medium
        criteria: >-
          The latest quality-monitor verdict per customer table is counted and reported. It is not
          scored: estate coverage measures whether the monitor was turned on, and a Healthy share of
          the tables it already watches is what the monitor is for. What happens on failure —
          expect, expect_or_drop, expect_or_fail — is not in this signal, so the requirement stays a
          question after the reading.
        remediation:
          summary: >-
            Declare pipeline expectations with an action on violation — expect_or_fail or
            expect_or_drop — so a bad row stops or is quarantined rather than being logged and
            published.
          by_hand: >-
            Open the pipeline that writes a published table, and on each expectation set
            expect_or_fail for an invariant that must hold or expect_or_drop for rows that can be
            discarded. A bare expect only logs. This scan cannot read that action — it is not in
            table_results — so the finding names the monitor counts and still asks what happens on
            failure. Enabling the quality monitor is not the remedy.
          doc_url: https://docs.databricks.com/aws/en/ldp/expectations
          caveat: >-
            This reading does not fail. The counts it reports are not a shortfall, and a Healthy
            verdict is not evidence a pipeline stops a violating row.
      - id: DG-03-03
        title: Implement and enforce standardized data formats and definitions
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/data-governance/best-practices#implement-and-enforce-standardized-data-formats-and-definitions
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: high
        alias_group: open-table-formats
        criteria: >-
          Same requirement as CO-01-01, read from the governance side. Scored once through the alias
          group.
        thresholds:
          pass_share: 0.95
          partial_share: 0.7
