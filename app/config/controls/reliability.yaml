# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: reliability
  code: REL
  title: Reliability
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices
principles:
  - id: REL-01
    title: 1. Design for failure
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#1-design-for-failure
    controls:
      - id: REL-01-01
        title: Use a data format that supports ACID transactions
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-a-data-format-that-supports-acid-transactions
        evaluator_status: implemented
        measurability: system-table
        collector: sql:uc.census
        severity: high
        alias_group: open-table-formats
        criteria: >-
          Same requirement as CO-01-01, read from the reliability side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.95
          partial_share: 0.7
      - id: REL-01-02
        title: Use a resilient distributed data engine for all workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-a-resilient-distributed-data-engine-for-all-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          Every job or pipeline cluster runs with a fixed worker count above zero or an autoscale
          range starting above zero. A single-node cluster has no worker to fail over to, so losing
          its one node stops the run rather than degrading it. All-purpose clusters used
          interactively are out of scope.
        thresholds:
          pass_share: 1
          partial_share: 0.9
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Give the cluster at least one worker, or an autoscale floor above zero.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # replace num_workers: 0 (or
            an all-zero autoscale range) with a fixed count or a floor above zero

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/compute/single-node
          caveat: >-
            Single-node is a deliberate choice for some workloads — a driver-only ML training job, a
            small batch that never benefits from a second executor — and moving one of those to
            multi-node adds idle worker cost for no resilience it needed. This flags dependence on
            one machine; whether that machine is production is still worth confirming before
            changing it.
      - id: REL-01-03
        title: Automatically rescue invalid or nonconforming data
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#automatically-rescue-invalid-or-nonconforming-data
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When a record arrives malformed, is it captured for inspection — or does it fail the
            job, or silently vanish?
          evidence_guidance: The rescue or quarantine mechanism in your ingestion path, and where bad records end up.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Pipeline expectations and what they do on violation are recorded where pipelines are
              used, which answers it for that estate. Rescue logic hand-written in a notebook is not
              recorded, and the silent-vanish case the question warns about is exactly the
              hand-written one. The table-constraint half is read from `delta.constraints.*`
              properties rather than from the information schema, which does not carry CHECK
              constraints.
            signal: system.lakeflow.pipelines.settings with DESCRIBE DETAIL properties
      - id: REL-01-04
        title: Configure jobs for automatic retries and termination
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#configure-jobs-for-automatic-retries-and-termination
        evaluator_status: implemented
        measurability: system-table
        collector: sql:jobs.inventory
        severity: high
        criteria: >-
          At least 80% of jobs with a recorded timeout setting carry a timeout above zero. Without
          one a hung run bills until someone notices missing data, which is the slowest detection
          available. Jobs whose timeout is not recorded in the system table are excluded from the
          share rather than counted as failures.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: Set a timeout, retries and an on-failure notification on each scheduled job.
          cli: |-
            databricks jobs update 620112326920 \
              --json '{"new_settings": {"timeout_seconds": 7200, "health": {"rules": [{"metric": "RUN_DURATION_SECONDS", "op": "GREATER_THAN", "value": 5400}]}}}'
          doc_url: https://docs.databricks.com/aws/en/jobs/settings
          caveat: >-
            Retries are a task setting, not a job one: max_retries and min_retry_interval_millis go
            inside each task. Retrying a task that is not idempotent turns one failure into two
            partial writes, so set them where a rerun is safe and leave them at zero where it is
            not.
      - id: REL-01-05
        title: Use scalable and production-grade model serving infrastructure
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-scalable-and-production-grade-model-serving-infrastructure
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is model serving able to survive an instance failure and a traffic spike without manual
            intervention?
          evidence_guidance: >-
            The serving configuration: replicas, scaling bounds, and what happened during the last
            spike or failure.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Managed serving and its scaling configuration are recorded, so the infrastructure half
              is readable. Whether it survived an instance failure or a traffic spike is a fact
              about an event that may never have happened.
            signal: system.serving.served_entities with system.serving.endpoint_usage
      - id: REL-01-06
        title: Use managed services where possible
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-managed-services-where-possible
        evaluator_status: implemented
        measurability: system-table
        collector: sql:cost.compute_mix
        severity: high
        alias_group: serverless-adoption
        criteria: >-
          Same requirement as CO-01-06, read from the reliability side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.8
          partial_share: 0.3
  - id: REL-02
    title: 2. Manage data quality
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#2-manage-data-quality
    controls:
      - id: REL-02-01
        title: Use a layered storage architecture
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-a-layered-storage-architecture
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is there a deliberate layering — raw, refined, serving — such that a bad transformation
            can be rerun from retained source data?
          evidence_guidance: >-
            The layers as they exist, and whether raw data is retained long enough to reprocess
            from.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Lineage depth records whether data passes through distinct layers before it is served,
              which is the shape the question describes. Whether the layering is deliberate, and
              whether raw data is retained long enough to rerun from, are separate claims one graph
              does not answer.
            signal: system.access.table_lineage with system.information_schema.schemata
      - id: REL-02-02
        title: Improve data integrity by reducing data redundancy
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#improve-data-integrity-by-reducing-data-redundancy
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is the same fact stored once and derived from, or copied into several tables that can
            now disagree?
          evidence_guidance: >-
            Any known duplicate of a core dataset, why it exists, and whether the copies have
            diverged.
          cadence_days: 365
          asked_because:
            verdict: partial-telemetry
            why: >-
              Column-level lineage records where each column came from, so one source column landing
              in many tables is countable — 43,014 edges on the labs workspace. It narrows rather
              than settles, because a fan-out is what a well-built mart looks like as much as what a
              redundant copy looks like, and deciding which needs the meaning of the tables. A copy
              made by a job that read one table and wrote another without a declared derivation
              leaves no edge at all, and that is the case that causes the disagreement.
            signal: system.access.column_lineage
      - id: REL-02-03
        title: Actively manage schemas
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#actively-manage-schemas
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When an upstream schema changes, is it detected and handled — or does it break a
            pipeline or silently drop a column?
          evidence_guidance: >-
            The schema handling in place — enforcement, evolution rules, contracts — and the last
            upstream change and what it cost you.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Column additions and drops are audited, so schema movement is visible after it
              happens. Whether the change was detected and handled, or silently dropped a column
              that a consumer was reading, is the half that matters and is not recorded.
            signal: system.access.audit schema change operations
      - id: REL-02-04
        title: Use constraints and data expectations
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#use-constraints-and-data-expectations
        evaluator_status: implemented
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        criteria: >-
          A share of the sampled tables declare a Delta CHECK constraint, read from the
          `delta.constraints.*` properties rather than from the information schema. Presence is the
          only verdict this settles: a strong share passes, a smaller share is partial, and none is
          unmeasured rather than failed, because a table may enforce its rules through a pipeline
          expectation or a column NOT NULL that this signal does not carry. Primary and foreign keys
          do not count — Unity Catalog records them without enforcing them.
        thresholds:
          pass_share: 0.8
        coverage_mode: sampled
        remediation:
          summary: >-
            Declare CHECK constraints on the columns consumers depend on, so a violating write fails
            at the write rather than propagating; declare pipeline expectations for row-level rules,
            with an action on violation.
          sql: ALTER TABLE catalog.schema.table ADD CONSTRAINT amount_positive CHECK (amount > 0);
          doc_url: https://docs.databricks.com/aws/en/tables/constraints
          caveat: >-
            A CHECK constraint is validated against existing rows when it is added, so adding one to
            a table that already violates it fails until the data is corrected. Pipeline
            expectations and column NOT NULL rules enforce the same way and are not read here, so a
            table this reports without a CHECK constraint may still be enforcing its rules
            elsewhere.
      - id: REL-02-05
        title: Take a data-centric approach to machine learning
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#take-a-data-centric-approach-to-machine-learning
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When a model underperforms, is the data investigated first — or does tuning start with
            the model?
          evidence_guidance: The last model quality problem and where the cause turned out to be.
          cadence_days: 365
          asked_because:
            verdict: beyond-telemetry
            why: >-
              Asks what an investigation started with — the data or the model. A sequence of human
              decisions, leaving no mark on the estate either way.
  - id: REL-03
    title: 3. Design for autoscaling
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#3-design-for-autoscaling
    controls:
      - id: REL-03-01
        title: Enable autoscaling for ETL workloads
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#enable-autoscaling-for-etl-workloads
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.clusters
        severity: medium
        alias_group: compute-autoscaling
        criteria: >-
          Same requirement as CO-02-01, read from the reliability side. Scored once through the
          alias group.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
      - id: REL-03-02
        title: Enable autoscaling for SQL warehouse
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#enable-autoscaling-for-sql-warehouse
        evaluator_status: implemented
        measurability: system-table
        collector: sql:compute.warehouses
        severity: medium
        criteria: >-
          At least 80% of warehouses scale across a range rather than running at a fixed cluster
          count, so peaks do not queue and troughs are not paid for.
        thresholds:
          pass_share: 0.8
          partial_share: 0.4
        remediation:
          summary: Set a scaling range and a short auto-stop on each warehouse.
          cli: >-
            databricks warehouses edit abc123def456 --min-num-clusters 1 --max-num-clusters 4
            --auto-stop-mins 10
          doc_url: https://docs.databricks.com/aws/en/compute/sql-warehouse/create
          caveat: >-
            Warehouse scaling adds clusters for concurrency, not size: a single slow query is not
            helped by a wider range, and a queue of small ones is. Raise the cluster size for the
            first and the maximum count for the second.
  - id: REL-04
    title: 4. Test recovery procedures
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#4-test-recovery-procedures
    controls:
      - id: REL-04-01
        title: Recover from Structured Streaming query failures
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#recover-from-structured-streaming-query-failures
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Have you tested that a killed streaming query resumes from its checkpoint without loss
            or duplication?
          evidence_guidance: >-
            The test: when it was last run, on which query, and what was verified about the output.
            Answer not-applicable if you run no streaming workloads.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              A streaming task that failed and resumed is recorded, which is evidence the recovery
              path ran at least once. Whether it was tested deliberately, and whether the resume
              lost or duplicated records, is not something the run timeline can tell.
            signal: system.lakeflow.job_task_run_timeline
      - id: REL-04-02
        title: Recover ETL jobs using data time travel capabilities
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#recover-etl-jobs-using-data-time-travel-capabilities
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Have you actually restored a table to an earlier version after a bad write, rather than
            assuming time travel will work?
          evidence_guidance: >-
            The last restore performed or rehearsed, and whether the retention window was long
            enough to reach the point you needed.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              A restore that happened is audited, so where the answer is yes there is a record of
              it. A no is indistinguishable from a workspace that has never needed one, which is why
              the question still has to be asked.
            signal: system.access.audit restore operations
      - id: REL-04-03
        title: Leverage a job automation framework with built-in recovery
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#leverage-a-job-automation-framework-with-built-in-recovery
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            When a job fails part way through, does the framework retry and resume safely — or does
            someone work out by hand what to rerun?
          evidence_guidance: >-
            The retry and idempotency behaviour of your main pipeline, and what the last failure
            required of a human.
          cadence_days: 180
          asked_because:
            verdict: partial-telemetry
            why: >-
              Repeat attempts on a failed task are recorded, so retries that happened are visible.
              The configured retry policy is in no system table, and whether a resume was safe
              rather than merely successful is a property of the code.
            signal: system.lakeflow.job_task_run_timeline with system.lakeflow.job_tasks.timeout_seconds
      - id: REL-04-04
        title: Configure high availability and disaster recovery
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#configure-high-availability-and-disaster-recovery
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is there a disaster recovery plan with a stated recovery objective, and has it been
            exercised rather than written?
          evidence_guidance: The RTO and RPO you are committed to, the date of the last exercise, and what it found.
          cadence_days: 90
          asked_because:
            verdict: beyond-telemetry
            why: >-
              A plan, a stated recovery objective, and an exercise. None of the three is an estate
              fact, and a workspace that has rehearsed failover looks exactly like one that intends
              to.
      - id: REL-04-05
        title: Manage Delta history and time-travel retention
        provenance: extension
        alias_group: delta-history-retention
        rationale: >-
          Time travel and RESTORE are the recovery mechanism for accidental deletion and bad writes,
          but the window they can reach is a function of retention settings that most estates never
          set. This pillar tests recovery procedures without checking that the history those
          procedures depend on still exists. Scored once with its cost-pillar counterpart, since it
          is one decision with two consequences. Proposed for upstream inclusion.
        measurability: system-table
        collector: describe:storage.table_details
        severity: medium
        evaluator_status: implemented
        coverage_mode: sampled
        criteria: >-
          Every table examined can be restored at least as far back as Delta's own default, and no
          table retains log history beyond the data files that make it usable. Both retentions are
          read from the table's Delta properties, and the reachable window is the lesser of the two,
          because time travel to a version needs the log entry and the files for that version. A
          table setting neither property inherits the default and takes partial credit: seven days
          is a defensible window, but nothing states the one this table's role needs.
        thresholds:
          min_reachable_days: 7
        remediation:
          summary: Set each critical Delta table's recovery window to cover likely incidents.
          sql: |-
            DESCRIBE HISTORY main.sales.orders;
            ALTER TABLE main.sales.orders SET TBLPROPERTIES (
              'delta.logRetentionDuration' = 'interval 90 days',
              'delta.deletedFileRetentionDuration' = 'interval 90 days'
            );
          doc_url: https://docs.databricks.com/aws/en/delta/history
          caveat: >-
            Longer retention costs storage. This is the same setting the cost pillar wants
            shortened, which is why the two are scored as one decision rather than as competing
            findings.
  - id: REL-05
    title: 5. Automate deployments and workloads
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#5-automate-deployments-and-workloads
    controls: []
  - id: REL-06
    title: 6. Monitor systems and workloads
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/reliability/best-practices#6-monitor-systems-and-workloads
    controls: []
