          doc_url: https://docs.databricks.com/data-sharing/create-recipient.html
      - id: SCP-05-10
        title: Streamline the usage and management of various large language model(LLM) providers
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/generative-ai/external-models/index.html
        source_ref: INFO-29
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
        collector: rest:workspace:serving-endpoints
        criteria: >-
          Check if there is not at least one EXTERNAL_MODEL in model serving endpoints configured
          and alert in case of none
        remediation:
          summary: >-
            Secure third-party models hosted outside of Databricks with Model Serving to streamline
            the usage and management of various large language model (LLM) providers such as OpenAI
            and Anthropic within an organization by storing API keys in one secure location
          doc_url: https://docs.databricks.com/en/generative-ai/external-models/index.html
          cli: |-
            databricks secrets create-scope llm
            databricks secrets put-secret llm openai_key
            databricks serving-endpoints create openai-chat \
              --json '{"config": {"served_entities": [{"name": "gpt", "external_model": {"name": "gpt-4o", "provider": "openai", "task": "llm/v1/chat", "openai_config": {"openai_api_key": "{{secrets/llm/openai_key}}"}}}]}}'
          caveat: >-
            The point of routing an external model through Model Serving is that the provider key
            lives in one secret scope instead of in every notebook that calls the API, and the calls
            appear in the request logs with everything else. Keys pasted into notebooks stay a
            finding whatever endpoints exist.
