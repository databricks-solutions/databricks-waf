      - id: SCP-05-15
        title: Git repository allowlist configured
        provenance: security-guide
        source_anchor: https://docs.databricks.com/repos/repos-setup.html#configure-an-allowlist-for-repos
        source_ref: INFO-42
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableProjectsAllowList setting
        remediation:
          summary: >-
            Enable the Git repository allowlist to restrict which external Git repositories
            workspace users can connect notebooks to. Without an allowlist users can connect to any
            external repository enabling code exfiltration and introduction of malicious code from
            unreviewed sources.
          doc_url: https://docs.databricks.com/repos/repos-setup.html#configure-an-allowlist-for-repos
          cli: |-
            # add the permitted prefixes under Advanced settings first, then enforce them
            databricks workspace-conf set-status --json '{"enableProjectsAllowList": "true"}'
          caveat: >-
            Enforcing an empty allowlist stops anybody connecting a repository at all, so populate
            it before switching this on. Existing Git folders keep working; the list applies when a
            repository is added.
