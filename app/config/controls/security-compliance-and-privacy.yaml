          - gcp
        collector: rest:workspace:secrets.scopes.list
        criteria: >-
          Check if there are any secrets configured in the workspace by listing scopes and looking
          for the secrets count against the configured baseline value in those scopes
        remediation:
          summary: Store and use secrets securely
          doc_url: https://docs.databricks.com/security/secrets/index.html
      - id: SCP-02-02
        title: Cluster instance disk encryption
        provenance: security-guide
        source_anchor: https://docs.databricks.com/clusters/configure.html#local-disk-encryption
        source_ref: DP-2
        measurability: rest-api
        severity: low
        evaluator_status: planned
        clouds:
          - aws
          - azure
        collector: rest:workspace:clusters.list
        criteria: Check if enable_local_disk_encryption is set as false for any cluster
        remediation:
          summary: All clusters should enable local disk encryption
          doc_url: https://docs.databricks.com/clusters/configure.html#local-disk-encryption
      - id: SCP-02-03
        title: Customer-managed keys for managed services and workspace storage
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/keys/customer-managed-keys-storage-aws.html
