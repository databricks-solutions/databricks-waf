          - azure
          - gcp
        collector: rest:workspace:global-init-scripts
        criteria: Check if there are any global-init-scripts configured
        remediation:
          summary: >-
            Global init scripts are discouraged for security, improved startup and flexibility
            reasons
          doc_url: https://docs.databricks.com/clusters/init-scripts.html#init-script-types
      - id: SCP-05-03
        title: Number of admins
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/users-groups/users.html
        source_ref: INFO-6
        measurability: rest-api
        severity: informational
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.scim.v2.Groups
        criteria: >-
          Check members count of displayName "admins" in groups to report if the count is more than
          the configured threshold
        remediation:
          summary: >-
            Limit the number of admin accounts so that most users are not admins. Note: the
            threshold for this SAT check can be configured
          doc_url: https://docs.databricks.com/administration-guide/users-groups/users.html
      - id: SCP-05-04
        title: Job view ACLs are set consistently
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/access-control/jobs-acl.html
        source_ref: INFO-8
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableJobViewAcls setting
        remediation:
          summary: >-
            Use job visibility control to prevent users from viewing jobs where they do not have
            permissions
          doc_url: https://docs.databricks.com/administration-guide/access-control/jobs-acl.html
          cli: 'databricks workspace-conf set-status --json ''{"enableJobViewAcls": "true"}'''
      - id: SCP-05-05
        title: Cluster view ACLs are set consistently
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/access-control/cluster-acl.html
        source_ref: INFO-9
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enforceClusterViewAcls setting
        remediation:
          summary: >-
            Use cluster visibility control to prevent users from viewing clusters where they do not
            have permissions
          doc_url: https://docs.databricks.com/security/access-control/cluster-acl.html
          cli: 'databricks workspace-conf set-status --json ''{"enforceClusterViewAcls": "true"}'''
      - id: SCP-05-06
        title: Workspace View ACLs are set consistently
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/access-control/workspace-acl.html
        source_ref: INFO-10
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enforceWorkspaceViewAcls setting
        remediation:
          summary: >-
            Use workspace visibility control to prevent users from viewing notebooks and other
            objects where they do not have permissions in the workspace
          doc_url: https://docs.databricks.com/security/access-control/workspace-acl.html
          cli: 'databricks workspace-conf set-status --json ''{"enforceWorkspaceViewAcls": "true"}'''
          caveat: >-
            Once enforced, a notebook in a folder somebody has no permission on disappears from
            their workspace rather than appearing and refusing to open. Expect people to report
            missing work: the fix for that is a grant on the folder, not turning enforcement back
            off.
      - id: SCP-05-07
        title: Workspace for supporting Git repos
        provenance: security-guide
        source_anchor: https://docs.databricks.com/repos/index.html
        source_ref: INFO-11
        measurability: rest-api
        severity: informational
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableProjectTypeInWorkspace setting
        remediation:
          summary: It is recommended to store code in Git repos
          doc_url: https://docs.databricks.com/repos/index.html
          cli: 'databricks workspace-conf set-status --json ''{"enableProjectTypeInWorkspace": "true"}'''
          caveat: >-
            Present by default on current workspaces, and absent from the settings on those, which
            is why this reports as unmeasured rather than failing when the app cannot see it. Only
            worth running where a workspace old enough to have it switched off is in front of you.
      - id: SCP-05-08
