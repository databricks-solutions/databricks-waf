        collector: rest:account:accounts.workspaces
        criteria: >-
          Check if storage_customer_managed_key_id and managed_services_customer_managed_key_id are
          set for each workspace
        remediation:
          summary: Add a customer-managed key for managed services and workspace storage
          doc_url: https://docs.databricks.com/security/keys/customer-managed-keys-storage-aws.html
      - id: SCP-02-04
        title: Downloading results is disabled
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
        source_ref: DP-5
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableResultsDownloading setting
        remediation:
          summary: Disable download button for notebook results
          doc_url: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
          cli: 'databricks workspace-conf set-status --json ''{"enableResultsDownloading": "false"}'''
          caveat: >-
            This is the setting people notice: an analyst who exported a result set to a spreadsheet
            every morning will find it gone. Where that workflow is legitimate, the answer is
            usually a shared dashboard or a Delta share rather than leaving downloads on for
            everyone.
      - id: SCP-02-05
        title: Notebook export
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
        source_ref: DP-6
        measurability: rest-api
        severity: low
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableExportNotebook setting
        remediation:
          summary: Disable exporting notebooks and cells within notebooks
          doc_url: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
          cli: 'databricks workspace-conf set-status --json ''{"enableExportNotebook": "false"}'''
      - id: SCP-02-06
        title: Notebook table clipboard features
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
        source_ref: DP-7
        measurability: rest-api
        severity: low
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableNotebookTableClipboard setting
        remediation:
          summary: Disable the ability of users to copy tabular data to the clipboard via the notebooks UI
          doc_url: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-download-results
          cli: 'databricks workspace-conf set-status --json ''{"enableNotebookTableClipboard": "false"}'''
      - id: SCP-02-07
        title: Enable storing interactive notebook results only in the customer account
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-where-notebook-results-are-stored
        source_ref: DP-8
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for storeInteractiveNotebookResultsInCustomerAccount setting
        remediation:
          summary: Enable store interactive notebook results in your account
          doc_url: https://docs.databricks.com/administration-guide/workspace/notebooks.html#manage-where-notebook-results-are-stored
          cli: >-
            databricks workspace-conf set-status --json
            '{"storeInteractiveNotebookResultsInCustomerAccount": "true"}'
          caveat: >-
            Results already stored in the Databricks-managed account stay there; this changes where
            new ones go. On a workspace that predates the setting, expect the two to coexist for as
            long as the old notebooks keep their output.
      - id: SCP-02-08
        title: FileStore endpoint for HTTPS file serving
        provenance: security-guide
        source_anchor: https://docs.databricks.com/dbfs/filestore.html#filestore
        source_ref: DP-9
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableFileStoreEndpoint setting
        remediation:
          summary: Review and disable FileStore endpoint in admin console workspace settings
          doc_url: https://docs.databricks.com/dbfs/filestore.html#filestore
          cli: 'databricks workspace-conf set-status --json ''{"enableFileStoreEndpoint": "false"}'''
      - id: SCP-02-09
        title: Store and retrieve embeddings securely
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/generative-ai/vector-search.html
        source_ref: DP-14
        measurability: rest-api
        severity: low
        evaluator_status: implemented
        clouds:
          - aws
          - azure
        collector: rest:workspace:vector-search.endpoints
        criteria: List all the Vector Search endpoints and see if at least one endpoint is configured
        remediation:
          summary: Store and retrieve embeddings securely using the Vector Search
          doc_url: https://docs.databricks.com/en/generative-ai/vector-search.html
          cli: >-
            databricks vector-search-endpoints create-endpoint embeddings STANDARD

            databricks vector-search-indexes create-index main.rag.docs_index --endpoint-name
            embeddings \
              --primary-key id --index-type DELTA_SYNC
          caveat: >-
            A vector index inherits the grants of the table it syncs from, which is the reason to
            use one rather than a self-managed store: embeddings of governed text are as sensitive
            as the text, and a copy in an external vector database is outside every grant in the
            metastore.
      - id: SCP-02-10
        title: Disable legacy DBFS root and mounts
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/dbfs/disable-dbfs-root-mounts
        source_ref: DP-10
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:settings.types.disable_legacy_dbfs.names.default
        criteria: Check Settings v2 disable_legacy_dbfs type and verify setting is enabled
        remediation:
          summary: >-
            Enable the disable_legacy_dbfs workspace setting to prevent the workspace from accessing
            DBFS root and mounts and enforce Unity Catalog as the data access layer
          doc_url: https://docs.databricks.com/aws/en/dbfs/disable-dbfs-root-mounts
      - id: SCP-02-11
        title: SQL warehouse results download disabled
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks#enable-users-to-download-sql-query-results
        source_ref: DP-11
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:settings.types.sql_results_download.names.default
        criteria: Check Settings v2 sql_results_download type and verify download is disabled
        remediation:
          summary: Disable SQL results download to prevent data exfiltration via SQL Editor and Dashboards
          doc_url: https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks#enable-users-to-download-sql-query-results
      - id: SCP-02-12
        title: DBFS file browser disabled
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/workspace-settings/dbfs-browser
        source_ref: DP-13
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableDbfsFileBrowser setting
        remediation:
          summary: >-
            Disable the DBFS file browser to prevent users from browsing shared storage paths
            through the UI without an audit trail or access control
          doc_url: https://docs.databricks.com/aws/en/admin/workspace-settings/dbfs-browser
          cli: 'databricks workspace-conf set-status --json ''{"enableDbfsFileBrowser": "false"}'''
          caveat: >-
            The browser is the visible half. The mount points it browses are still readable from a
            notebook, so the finding worth chasing next is what is on DBFS at all: data that matters
            belongs in a Unity Catalog volume, where a grant applies to it.
  - id: SCP-03
    title: 3. Secure your network and protect endpoints
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#3-secure-your-network-and-protect-endpoints
    controls:
      - id: SCP-03-01
        title: Network deployment considerations for AWS
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#network-deployment-considerations-for-aws
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Was the network design chosen deliberately — customer-managed VPC, private connectivity,
            egress path — or accepted as the default?
          evidence_guidance: The deployment as built, and the decision record or diagram behind it.
          cadence_days: 90
          asked_because:
            verdict: beyond-telemetry
            why: >-
              Network topology is cloud-plane configuration with no workspace-readable source, and
              the question is about whether a design was chosen rather than accepted — which nothing
              records even where the topology is visible.
      - id: SCP-03-02
        title: Network security best practices
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#network-security-best-practices
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Is workspace access restricted to known networks, and is outbound traffic from compute
            constrained?
          evidence_guidance: >-
            The IP access lists, private connectivity and egress restrictions in force, and any path
            that bypasses them.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              The first clause is read already. `enableIpAccessLists` is one of the fifteen keys
              this app asks `workspace-conf` for on every scan, and it settles SCP-03-10 — so the
              claim that the scope is unavailable was wrong about the setting this very question
              opens with. What is left is the egress half: serverless egress is logged, but that
              table is empty on a workspace that constrains nothing and on one that logs nothing,
              and the cloud-side network design behind it is outside the platform.
            signal: >-
              workspace-conf enableIpAccessLists, already read for SCP-03-10, with
              system.access.outbound_network
      - id: SCP-03-03
        title: Front-end private connectivity
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/cloud-configurations/aws/privatelink.html
        source_ref: NS-3
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.workspaces
        criteria: Check if private_access_settings_id is set for the workspace
        remediation:
          summary: >-
            Configure either private network connectivity or IP access lists (NS-5) for workspace
            access and REST APIs. You can configure AWS PrivateLink, Azure Private Link, or Google
            Private Service Connect. Note that enabling and requiring front-end private connectivity
            are different, see the documentation for details.
          doc_url: https://docs.databricks.com/administration-guide/cloud-configurations/aws/privatelink.html
      - id: SCP-03-04
        title: Workspace uses a customer-managed VPC (AWS, GCP) or enables VNet injection (Azure)
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/cloud-configurations/aws/customer-managed-vpc.html
        source_ref: NS-4
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.workspaces
        criteria: Check if network_id is set for this workspace
        remediation:
          summary: >-
            Deploy with a customer-managed VPC (AWS, GCP) or use VNet injection (Azure) to help
            enforce data exfiltration protections
          doc_url: https://docs.databricks.com/administration-guide/cloud-configurations/aws/customer-managed-vpc.html
      - id: SCP-03-05
        title: IP access lists for workspace access
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/network/ip-access-list.html#add-an-ip-access-list
        source_ref: NS-5
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:ip-access-lists
        criteria: Check if ip-access-lists are configured and enabled
        remediation:
          summary: >-
            Configure IP access lists or private network connectivity (NS-3) for workspaces that
            restrict the IP addresses that can authenticate to help protect against data
            exfiltration and account takeover
          doc_url: https://docs.databricks.com/security/network/ip-access-list.html#add-an-ip-access-list
      - id: SCP-03-06
        title: Secure cluster connectivity (on Azure this is also called NoPublicIp)
        provenance: security-guide
        source_anchor: https://learn.microsoft.com/en-us/azure/databricks/security/secure-cluster-connectivity
        source_ref: NS-6
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - azure
        collector: rest:workspace:accounts.workspaces
        criteria: Check if enableNoPublicIp are configured and enabled
        remediation:
          summary: Configure secure cluster connectivity (On Azure, this is called NoPublicIP / NPIP)
          doc_url: https://learn.microsoft.com/en-us/azure/databricks/security/secure-cluster-connectivity
      - id: SCP-03-07
        title: Secure model serving endpoints
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/machine-learning/model-serving/manage-serving-endpoints.html
        source_ref: NS-7
        measurability: rest-api
        severity: high
        evaluator_status: implemented
        clouds:
          - aws
          - azure
        collector: rest:workspace:serving-endpoints
        criteria: >-
          Check if there are any model serving endpoints configured then check if IP Access lists or
          PL is deployed to prevent the endpoints from being accessed from the public internet
        remediation:
          summary: >-
            Secure endpoints of the underlying models served as REST API endpoints using Private
            connectivity or IP Access Lists
          doc_url: https://docs.databricks.com/en/machine-learning/model-serving/manage-serving-endpoints.html
          cli: >-
            databricks ip-access-lists create office ALLOW --json '{"ip_addresses":
            ["203.0.113.0/24"]}'

            databricks workspace-conf set-status --json '{"enableIpAccessLists": "true"}'
          caveat: >-
            IP access lists are the control this app can see. Private connectivity — AWS
            PrivateLink, Azure Private Link — is the stronger answer and is configured at the
            network layer rather than through a workspace setting, so an estate using it will still
            report this finding and should record the decision against it.
      - id: SCP-03-08
        title: IP access lists for account console access
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/network/ip-access-list.html#add-an-ip-access-list
        source_ref: NS-8
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.{account_id}.ip-access-lists
        criteria: Check if ip-access-lists are configured and enabled
        remediation:
          summary: >-
            Configure IP access lists for the account console to allow users to connect to the
            account console UI and account-level REST APIs only through a set of approved IP
            addresses to reduce the risk of account takeover
          doc_url: https://docs.databricks.com/security/network/ip-access-list.html#add-an-ip-access-list
      - id: SCP-03-09
        title: Workspaces have proper network policy configuration
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/security/network/serverless-network-security/network-policies
        source_ref: NS-9
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.network-policies
        criteria: >-
          Check each workspace for: (1) Has policy assigned (2) Policy uses RESTRICTED_ACCESS mode
          (3) Policy is fully ENFORCED
        remediation:
          summary: >-
            Ensure workspaces have network policies assigned with restricted access mode and
            enforced (not dry-run for all products)
          doc_url: https://docs.databricks.com/aws/en/security/network/serverless-network-security/network-policies
      - id: SCP-03-10
        title: Workspace IP access list enforcement enabled
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
        source_ref: NS-11
        measurability: rest-api
        severity: high
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableIpAccessLists setting
        remediation:
          summary: >-
            Enable IP access list enforcement so that the configured workspace IP access lists are
            actually applied — having entries without enforcement leaves the workspace open to
            access from any IP
          doc_url: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
          cli: >-
            databricks ip-access-lists create office ALLOW --json '{"ip_addresses":
            ["203.0.113.0/24"]}'

            databricks workspace-conf set-status --json '{"enableIpAccessLists": "true"}'
          caveat: >-
            In that order, and check the allow list contains the address you are connecting from
            before enabling: enforcement applies immediately and locks out anybody outside the list,
            including whoever ran the command. Databricks-internal traffic is unaffected.
      - id: SCP-03-11
        title: Context-Based Ingress (CBI) policy configured
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/security/network/front-end/context-based-ingress
        source_ref: NS-12
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.network-policies
        criteria: >-
          Check account_networkpolicies table ingress.public_access.restriction_mode and verify the
          workspace policy uses RESTRICTED_ACCESS
        remediation:
          summary: >-
            Adopt Context-Based Ingress (CBI) by setting ingress.public_access.restriction_mode to
            RESTRICTED_ACCESS on the network policy attached to each workspace. Dry-run enforcement
            is an acceptable first step toward full enforcement.
          doc_url: https://docs.databricks.com/aws/en/security/network/front-end/context-based-ingress
      - id: SCP-03-12
        title: Account console IP access list enforcement enabled
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-account
        source_ref: NS-13
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:account:accounts.{account_id}.ip-access-lists
        criteria: >-
          Check account_ipaccess_list for at least one enabled ALLOW-type entry — ALLOW list absent
          means account console is reachable from any IP
        remediation:
          summary: >-
            Configure and enable an ALLOW-type IP access list for the account console to restrict
            console access to known IP ranges — a BLOCK-only configuration does not prevent access
            from unknown IPs
          doc_url: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-account
      - id: SCP-03-13
        title: Egress control from compute — live connectivity test
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/security/network/classic/customer-managed-vpc#configure-a-firewall-and-outbound-access
        source_ref: NS-14
        measurability: attestation
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        criteria: >-
          Attempt HTTP HEAD requests to public destinations (google.com and ifconfig.me) from
          compute. If all destinations are reachable the workspace has no egress control.
        attestation:
          question: >-
            Has anyone verified from inside a cluster that egress is actually blocked, rather than
            trusting the configuration?
          evidence_guidance: >-
            The test performed from compute — which destinations were attempted, which were refused
            — and when.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              The experiment is not recorded — its result exists only if somebody ran it — but the
              thing the experiment is trying to establish partly is: serverless egress is logged, so
              a destination compute actually reached is visible. It narrows rather than settles for
              two reasons. The table is empty on a workspace whose egress is genuinely constrained
              and on one where the logging is not enabled, and it covers serverless compute rather
              than the classic cluster the question asks about.
            signal: system.access.outbound_network
        remediation:
          summary: >-
            Use an egress firewall or proxy appliance to limit outbound traffic to a list of allowed
            internal or external data sources.
          doc_url: https://docs.databricks.com/aws/en/security/network/classic/customer-managed-vpc#configure-a-firewall-and-outbound-access
  - id: SCP-04
    title: 4. Meet compliance and data privacy requirements
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#4-meet-compliance-and-data-privacy-requirements
    controls:
      - id: SCP-04-01
        title: PAT tokens are about to expire
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/access-control/tokens.html#manage-personal-access-tokens
        source_ref: GOV-2
        measurability: rest-api
        severity: high
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:token.list
        criteria: Check each token expiry_time and report if the expiry_time is within configured days
        remediation:
          summary: >-
            Set an expiration day (maximum lifetime) for tokens. Also regularly review PAT tokens to
            avoid expired tokens.
          doc_url: https://docs.databricks.com/administration-guide/access-control/tokens.html#manage-personal-access-tokens
          cli: >-
            databricks token-management list   # order by expiry_time

            databricks tokens create --comment 'etl-service, rotated 2026-08' --lifetime-seconds
            7776000

            databricks token-management delete <old-token-id>
          caveat: >-
            New token first, then the deletion, in that order: doing it the other way round is an
            outage for however long the change takes to reach the caller. A token created by this
            command belongs to whoever ran it, so run it as the identity the workload uses rather
            than as yourself.
      - id: SCP-04-02
        title: Log delivery configurations
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/account-settings/audit-logs.html#configure-audit-log-delivery
        source_ref: GOV-3
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
        collector: rest:account:accounts.log-delivery
        criteria: >-
          Check account log-delivery configuration and look for audit log config with log_type set
          as "AUDIT_LOGS" and status set as "ENABLED"
        remediation:
          summary: Configure Databricks audit log delivery (or see GOV-34)
          doc_url: https://docs.databricks.com/administration-guide/account-settings/audit-logs.html#configure-audit-log-delivery
      - id: SCP-04-03
        title: Long-running clusters
        provenance: security-guide
        source_anchor: https://docs.databricks.com/clusters/clusters-manage.html#restart-a-cluster-to-update-it-with-the-latest-images
        source_ref: GOV-4
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:clusters.list
        criteria: >-
          Check each running cluster's last restart time till now and report on clusters that were
          running longer than the configured number of days without a restart
        remediation:
          summary: >-
            Restart clusters on a regular schedule to use the latest available base image and
            container image.
          doc_url: https://docs.databricks.com/clusters/clusters-manage.html#restart-a-cluster-to-update-it-with-the-latest-images
      - id: SCP-04-04
        title: Deprecated versions of Databricks runtimes
        provenance: security-guide
        source_anchor: https://docs.databricks.com/release-notes/runtime/releases.html
        source_ref: GOV-5
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          No all-purpose cluster runs a Databricks Runtime below the oldest supported major version.
          Distinct from CO-01-04, which asks whether runtimes are current: this asks whether any is
          unsupported, and an unsupported runtime stops receiving security patches, so a
          vulnerability in it stays open. A runtime string that cannot be parsed counts as
          unsupported.
        thresholds:
          min_supported_runtime_major: 14
          pass_share: 1
          partial_share: 0.9
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: Upgrade any cluster below the supported floor to the current long-term-support runtime.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set spark_version to a
            supported LTS release

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/release-notes/runtime/
          caveat: >-
            An unsupported runtime receives no security patches, so this is not the same finding as
            being behind the latest: it is the one to fix before the ones about being current. Check
            the workload against the release notes first — a major runtime step can change Spark
            behaviour under it.
      - id: SCP-04-05
        title: Managed tables in DBFS root
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data/databricks-file-system.html#configuration-and-usage-recommendations
        source_ref: GOV-10
        measurability: system-table
        severity: low
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: sql:security.dbfs_tables
        criteria: >-
          Unity Catalog managed tables whose storage_path begins with dbfs:/ or /dbfs/ are stored on
          workspace DBFS root, which carries no file-level access control. Every table stored there
          is readable by any cluster that can mount the DBFS root, bypassing Unity Catalog grants. A
          count of zero is a pass: it confirms that this metastore's managed tables use governed
          cloud storage rather than DBFS root. Hive Metastore tables are outside the scope of this
          signal and require migration to Unity Catalog before this control can evaluate them.
        remediation:
          summary: >-
            Move managed tables off DBFS root onto Unity Catalog external locations or managed
            storage.
          by_hand: >-
            For each table stored on DBFS root (storage_path starting with dbfs:/), either migrate
            the table to a Unity Catalog managed table with a proper external storage location
            (CREATE TABLE ... LOCATION 's3://...'), or use DEEP CLONE to copy it to a new managed
            table whose storage the metastore governs. After migration, drop the DBFS-backed table.
            See the Unity Catalog migration guide for step-by-step instructions.
          doc_url: https://docs.databricks.com/data/databricks-file-system.html#configuration-and-usage-recommendations
      - id: SCP-04-06
        title: DBFS mounts
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data/databricks-file-system.html#configuration-and-usage-recommendations
        source_ref: GOV-11
        measurability: attestation
        severity: low
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        criteria: >-
          Check for mnt paths in dbutils.fs.mounts() and report if there are datasources loaded as
          FUSE mounts to the workspace than the configured value
        attestation:
          question: >-
            Are there DBFS mounts still in use, giving access to cloud storage outside Unity Catalog
            governance?
          evidence_guidance: >-
            The mounts that exist, what they point at, and whether anything still reads through them
            rather than through a catalogue location.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              Mount and unmount are audited, so mounts created within the retained window are
              visible. A mount made before it and still in use is not, because listing what is
              mounted now needs a command run on compute.
            signal: system.access.audit mount operations
        remediation:
          summary: Avoid DBFS mounts for accessing production data
          doc_url: https://docs.databricks.com/data/databricks-file-system.html#configuration-and-usage-recommendations
      - id: SCP-04-07
        title: Unity Catalog enabled clusters
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-governance/unity-catalog/index.html#cluster-access-modes-for-unity-catalog
        source_ref: GOV-12
        evaluator_status: implemented
        clouds:
          - aws
          - azure
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          Every all-purpose cluster runs in a Unity Catalog access mode, so metastore grants apply
          to whoever attaches to it. A cluster in a legacy or no-isolation mode does not consult the
          metastore at all, which makes every grant written there advisory. Measured only over
          clusters whose access mode the system table records: the column is unwritten for rows
          predating it, and reading unwritten as "no isolation" would report a failure caused by a
          rollout date.
        thresholds:
          pass_share: 1
          partial_share: 0.8
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: >-
            Move each cluster to standard or dedicated access mode, which are the Unity Catalog
            modes.
          cli: >-
            databricks clusters get 1234-567890-abc123 > cluster.json   # set data_security_mode to
            USER_ISOLATION, or SINGLE_USER with single_user_name

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/compute/access-mode-limitations
          caveat: >-
            USER_ISOLATION is the shared mode and refuses a few things a no-isolation cluster
            allowed: RDD APIs, some Scala, arbitrary machine-level access. A workload that depends
            on one of those wants SINGLE_USER instead, which is still a Unity Catalog mode and still
            consults the metastore.
      - id: SCP-04-08
        title: Enforce AWS Instance Metadata Service v2
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/cloud-configurations/aws/imdsv2.html
        source_ref: GOV-14
        measurability: rest-api
        severity: low
        evaluator_status: implemented
        clouds:
          - aws
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableEnforceImdsV2 In Workspace setting
        remediation:
          summary: Enforce AWS Instance Metadata Service v2 on a workspace
          doc_url: https://docs.databricks.com/administration-guide/cloud-configurations/aws/imdsv2.html
          cli: 'databricks workspace-conf set-status --json ''{"enableEnforceImdsV2": "true"}'''
          caveat: >-
            AWS only. Enforcement takes effect as clusters restart, so the finding clears over the
            following days rather than at once. A workload reading instance metadata with an old SDK
            will start failing — v2 needs a token request first — which is the change worth testing
            before enforcing.
      - id: SCP-04-09
        title: Enable verbose audit logs (on Azure, diagnostic logs)
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/admin/account-settings/verbose-logs.html
        source_ref: GOV-15
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for enableVerboseAuditLogs setting
        remediation:
          summary: Enable verbose audit logs (on Azure, diagnostic logs)
          doc_url: https://docs.databricks.com/en/admin/account-settings/verbose-logs.html
          cli: 'databricks workspace-conf set-status --json ''{"enableVerboseAuditLogs": "true"}'''
          caveat: >-
            Verbose logging adds notebook and query-level events, which is what makes an
            investigation possible and also several times the log volume. On Azure the equivalent is
            the diagnostic setting on the workspace resource rather than this flag.
      - id: SCP-04-10
        title: Workspace Unity Catalog metastore assignment
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-governance/unity-catalog/enable-workspaces.html
        source_ref: GOV-16
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        measurability: derived
        collector: sql:uc.census
        severity: medium
        criteria: >-
          The workspace resolves a Unity Catalog metastore. Established by reading
          `system.information_schema`, which resolves through the workspace's own metastore
          assignment, so rows in it are the assignment. Assignment is not adoption: DG-01-02 counts
          what this metastore governs, and does not claim that is the estate.
        remediation:
          summary: Assign the workspace to a metastore in its region from the account console.
          cli: |-
            databricks metastores list
            databricks metastores assign <workspace-id> <metastore-id> main
          doc_url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/enable-workspaces
          caveat: >-
            An account-admin action, and one metastore per region: a workspace can only be assigned
            to a metastore in its own region, so a workspace somewhere without one needs the
            metastore created first.
      - id: SCP-04-11
        title: Limit the lifetime (expiration) of metastore Delta Sharing recipient token
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-sharing/create-recipient.html#modify-the-recipient-token-lifetime
        source_ref: GOV-17
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:unity-catalog.metastore_summary
        criteria: >-
          Flag metastores where delta_sharing_recipient_token_lifetime_in_seconds exceeds the
          configured days threshold and delta_sharing_scope is INTERNAL_AND_EXTERNAL
        remediation:
          summary: Set the lifetime of Delta Sharing recipient tokens
          doc_url: https://docs.databricks.com/data-sharing/create-recipient.html#modify-the-recipient-token-lifetime
      - id: SCP-04-12
        title: Delta Sharing IP access lists
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-sharing/access-list.html#use-ip-access-lists-to-restrict-delta-sharing-recipient-access-open-sharing
        source_ref: GOV-18
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:unity-catalog.recipients
        criteria: Flag TOKEN-type recipients with no ip_access_list configured
        remediation:
          summary: >-
            Configure Delta Sharing IP access lists to restrict recipient access to trusted IP
            addresses
          doc_url: https://docs.databricks.com/data-sharing/access-list.html#use-ip-access-lists-to-restrict-delta-sharing-recipient-access-open-sharing
      - id: SCP-04-13
        title: Delta Sharing token expiration
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-sharing/create-recipient.html#security-considerations-for-tokens
        source_ref: GOV-19
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:unity-catalog.recipients
        criteria: Flag TOKEN-type recipients with tokens that have no expiration_time set
        remediation:
          summary: Establish a process for rotating credentials Delta sharing token
          doc_url: https://docs.databricks.com/data-sharing/create-recipient.html#security-considerations-for-tokens
      - id: SCP-04-14
        title: Existence of Unity Catalog metastores
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-governance/unity-catalog/create-metastore.html
        source_ref: GOV-20
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        measurability: derived
        collector: sql:uc.census
        severity: low
        criteria: >-
          A Unity Catalog metastore exists. Cannot fail: an estate with no metastore cannot answer
          the queries this assessment is built on, so it reports unmeasured with the collection
          error rather than as a failure. Recorded as observed because it is the premise the
          governance pillar rests on.
        remediation:
          summary: Create a metastore for the workspace region in the account console.
          cli: |-
            databricks metastores create analytics-us-east-1 --region us-east-1
            databricks metastores assign <workspace-id> <metastore-id> main
          doc_url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/create-metastore
          caveat: >-
            Created without a storage root on purpose: a metastore-level root is the older pattern
            and applies to every catalog under it. Give each catalog its own managed location
            instead, which keeps one team’s data out of another team’s bucket.
      - id: SCP-04-15
        title: Delegation of the Unity Catalog metastore admin to a group
        provenance: security-guide
        source_anchor: https://docs.databricks.com/data-governance/unity-catalog/manage-privileges/index.html#assign-a-metastore-admin
        source_ref: GOV-21
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:unity-catalog.metastores
        criteria: >-
          Flag metastores where owner equals created_by, is 'System user', or appears to be a
          personal account (contains @)
        remediation:
          summary: Delegate metastore admin to a group who is not the account admin
          doc_url: https://docs.databricks.com/data-governance/unity-catalog/manage-privileges/index.html#assign-a-metastore-admin
      - id: SCP-04-16
        title: Init scripts stored in DBFS
        provenance: security-guide
        source_anchor: https://docs.databricks.com/clusters/init-scripts.html#cluster-scoped-init-scripts
        source_ref: GOV-25
        evaluator_status: implemented
        clouds:
          - aws
          - azure
        measurability: system-table
        collector: sql:compute.clusters
        severity: high
        criteria: >-
          No cluster runs an init script from a DBFS root. An init script runs as root on every node
          before the cluster is usable and DBFS has no meaningful access control, so anyone who can
          write to the path decides what runs — a code execution route that needs no cluster
          permission. Destinations under /Volumes or /Workspace are governed and are not counted; an
          unrecognised destination counts as governed, so the finding understates rather than
          invents.
        thresholds:
          pass_share: 1
          partial_share: 0.95
        applicability:
          preconditions:
            - signal: sql:estate.compute_profile
              operator: eq
              value: 0
              outcome: not-applicable
              reason: >-
                This estate ran no classic compute in the window, so there are no clusters for this
                to govern. The control is excluded from scoring rather than failed: serverless
                compute is configured by the platform rather than by you, so there is nothing here
                to get wrong.
              scope: estate
        remediation:
          summary: >-
            Move init scripts to a Unity Catalog volume or a workspace file and repoint the
            clusters.
          cli: >-
            databricks volumes create main default init_scripts MANAGED

            databricks fs cp dbfs:/databricks/init/install.sh
            dbfs:/Volumes/main/default/init_scripts/install.sh

            databricks clusters get 1234-567890-abc123 > cluster.json   # point init_scripts at
            {volumes: {destination: /Volumes/main/default/init_scripts/install.sh}}

            databricks clusters edit --json @cluster.json
          doc_url: https://docs.databricks.com/aws/en/init-scripts/
          caveat: >-
            Grant READ VOLUME narrowly: an init script runs as root on every node, so write access
            to the volume is root on the cluster. That is the whole reason this finding exists, and
            copying the script to a volume anyone can write to reproduces it.
      - id: SCP-04-17
        title: Govern model assets
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/machine-learning/manage-model-lifecycle/index.html
        source_ref: GOV-28
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:unity-catalog.models
        criteria: List the registered models and check if there are any models in UC
        remediation:
          summary: Manage model lifecycle in Unity Catalog
          doc_url: https://docs.databricks.com/en/machine-learning/manage-model-lifecycle/index.html
      - id: SCP-04-18
        title: Monitor audit logs with system tables (or see GOV-3)
        provenance: security-guide
        source_anchor: https://docs.databricks.com/en/admin/system-tables/index.html
        source_ref: GOV-34
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        measurability: system-table
        collector: sql:governance.audit_coverage
        severity: high
        alias_group: audit-logging
        criteria: >-
          Same measurement as DG-02-02, read as the security-monitoring requirement: audit events
          are arriving and are no more than two days stale. Scored once through the alias group.
        thresholds:
          max_days_since_event: 2
        remediation:
          summary: >-
            Enable audit system tables at account level and grant the assessing identity SELECT on
            them.
          cli: |-
            databricks metastores current                              # the metastore id
            databricks system-schemas enable <metastore-id> access
            databricks system-schemas enable <metastore-id> compute
          sql: GRANT SELECT ON SCHEMA system.access TO `waf-assessor`;
          doc_url: https://docs.databricks.com/aws/en/admin/system-tables/audit-logs
          caveat: >-
            Events start arriving from the point the schema is enabled, not retroactively, so the
            staleness this control measures takes a day to clear even once the fix is in. Enabling
            the schema is an account-admin action; the grant is a metastore-admin one.
      - id: SCP-04-19
        title: Restrict workspace admins
