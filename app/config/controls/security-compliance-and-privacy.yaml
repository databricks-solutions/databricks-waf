          doc_url: https://docs.databricks.com/aws/en/admin/account-settings/legacy-features
      - id: SCP-04-22
        title: Jobs run as service principal
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/users-groups/service-principals#common-use-cases
        source_ref: GOV-42
        measurability: system-table
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: sql:jobs.inventory
        criteria: >-
          Jobs where the run_as field contains an email address are running as a user account rather
          than a service principal. A job running as a user account uses that person's permissions,
          outlives their employment, and produces audit entries attributed to an individual rather
          than a workload. The share of jobs running as service principals over the total with a
          recorded run_as identity is the metric; jobs with no recorded run_as are counted
          separately and reported but excluded from the share because the field is absent on rows
          written before the column existed.
        thresholds:
          pass_share: 1
          partial_share: 0.8
        remediation:
          summary: >-
            Configure each job to run as a service principal rather than a user account. A service
            principal has only the grants its owner gives it, survives staff changes, and produces
            audit entries attributable to the workload rather than to a person.
          cli: >-
            databricks jobs update --job-id <job-id> --json '{"run_as": {"service_principal_name":
            "<sp-application-id>"}}'
          doc_url: https://docs.databricks.com/aws/en/admin/users-groups/service-principals#common-use-cases
      - id: SCP-04-23
        title: Jobs not granting CAN_MANAGE to non-admin principals
        provenance: security-guide
        source_anchor: https://docs.databricks.com/security/access-control/jobs-acl.html
        source_ref: GOV-45
        measurability: rest-api
        severity: high
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:permissions.jobs.{job_id}
        criteria: >-
          Check job_permissions table for records where group_name is not admins and user_name is
          not creator_user_name and permission_level is CAN_MANAGE
        remediation:
          summary: >-
            Review and revoke CAN_MANAGE from any principal other than the job owner and the admins
            group. Any user group or service principal holding CAN_MANAGE can modify the job
            definition and execute code as the job owner or its configured run_as identity creating
            a privilege escalation path.
          doc_url: https://docs.databricks.com/security/access-control/jobs-acl.html
  - id: SCP-05
    title: 5. Monitor system security
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#5-monitor-system-security
    controls:
      - id: SCP-05-01
        title: Global libraries
        provenance: security-guide
        source_anchor: https://docs.databricks.com/libraries/cluster-libraries.html
        source_ref: INFO-3
        measurability: rest-api
        severity: informational
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:libraries.all-cluster-statuses
        criteria: >-
          Check if is_library_for_all_clusters is set as true for any library that is configured for
          clusters
        remediation:
          summary: >-
            Global libraries are discouraged for security reasons. Use cluster libraries or
            notebook-scoped libraries to improve startup time for clusters that don't require that
            library, and to improve flexibility where that library is not required.
          doc_url: https://docs.databricks.com/libraries/cluster-libraries.html
      - id: SCP-05-02
        title: Global init script
        provenance: security-guide
        source_anchor: https://docs.databricks.com/clusters/init-scripts.html#init-script-types
        source_ref: INFO-5
        measurability: rest-api
        severity: informational
        evaluator_status: planned
