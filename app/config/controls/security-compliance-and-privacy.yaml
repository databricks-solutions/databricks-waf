      - id: SCP-04-21
        title: Disable legacy features for new workspaces
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/account-settings/legacy-features
        source_ref: GOV-37
        measurability: rest-api
        severity: high
