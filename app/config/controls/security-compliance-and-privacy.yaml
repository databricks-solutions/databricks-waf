# Generated by scripts/seed-catalogue.mjs from published sources.
# Hand-authored fields are preserved across re-seeds; titles and source
# anchors are refreshed from upstream. Do not add extension controls by
# editing generated entries -- add them as new controls with a rationale.
pillar:
  id: security-compliance-and-privacy
  code: SCP
  title: Security, compliance, and privacy
  page: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices
principles:
  - id: SCP-01
    title: 1. Manage identity and access using least privilege
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#1-manage-identity-and-access-using-least-privilege
    controls:
      - id: SCP-01-01
        title: Account setup and identity configuration
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#account-setup-and-identity-configuration
        evaluator_status: implemented
        measurability: system-table
        collector: sql:security.auth_login_paths
        severity: medium
        criteria: >-
          Username-and-password logins (`action_name = login`) in the audit window fail the control.
          Their absence is unmeasured rather than a pass: a local account that did not authenticate
          in the retained window looks exactly like no local account, and the account-plane
          provisioning path is unreadable. SAML (`samlLogin`) and OAuth (`oidcTokenAuthorization`)
          counts are reported beside the reading.
        remediation:
          summary: >-
            Remove local username-and-password accounts and require SSO (or OAuth) for every human
            login.
          by_hand: >-
            In the account console, open User management and find any user that can sign in with a
            password rather than through your identity provider. Disable or delete those accounts,
            and confirm SSO (or OIDC) is the only path left for humans. The audit reading only names
            credentials that were used in the window — accounts that exist but never logged in are
            invisible to it.
          doc_url: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#account-setup-and-identity-configuration
          caveat: >-
            This reading identifies local credentials that were used. Accounts that exist but never
            logged in during the window are invisible here, and the account console that would list
            them is out of scope.
      - id: SCP-01-02
        title: Identity and access management best practices
        provenance: waf-docs
        source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#identity-and-access-management-best-practices
        measurability: attestation
        severity: medium
        evaluator_status: unimplemented
        attestation:
          question: >-
            Are permissions granted to groups against a least-privilege model, and is access removed
            when people move on?
          evidence_guidance: >-
            How access is granted and revoked, when entitlements were last reviewed, and what that
            review removed.
          cadence_days: 90
          asked_because:
            verdict: partial-telemetry
            why: >-
              Whether a grant is held by a group or by a named individual is recorded on every
              securable, so the least-privilege half is measurable and ought to be measured. Whether
              access is removed when somebody moves on needs the joiner-mover-leaver process, which
              is not in the platform.
            signal: system.information_schema.table_privileges, schema_privileges and catalog_privileges
      - id: SCP-01-03
        title: PAT tokens with no lifetime (expiration) limit
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/access-control/tokens.html
        source_ref: IA-4
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:token.list
        criteria: >-
          Check each token expiry_time and report if the expiry_time is not within the configured
          number of days or set to never expire by using -1 as the value
        remediation:
          summary: Configure maximum token lifetimes for future tokens using token management
          doc_url: https://docs.databricks.com/administration-guide/access-control/tokens.html
          cli: |-
            databricks token-management list   # expiry_time -1 is a token that never expires
            databricks token-management delete <token-id>
            databricks workspace-conf set-status --json '{"maxTokenLifetimeDays": "90"}'
          caveat: >-
            Deleting a token breaks whatever was using it, which for an unexpiring token is usually
            something nobody remembers building. Find the caller first: the audit log shows which
            requests carried the token. Setting the ceiling stops new ones being created without an
            expiry, and does not shorten the tokens that already exist.
      - id: SCP-01-04
        title: Maximum lifetime of new tokens to something other than unlimited
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/access-control/tokens.html#lifetime
        source_ref: IA-5
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:preview.workspace-conf
        criteria: Check workspace-conf for maxTokenLifetimeDays In Workspace setting
        remediation:
          summary: Configure maximum lifetime for all future tokens to a value other than unlimited
          doc_url: https://docs.databricks.com/administration-guide/access-control/tokens.html#lifetime
          cli: 'databricks workspace-conf set-status --json ''{"maxTokenLifetimeDays": "90"}'''
          caveat: >-
            This applies to tokens created after it is set, so the finding about existing long-lived
            tokens stays until those are rotated. A service that cannot rotate a token wants a
            service principal with OAuth instead, which is the fix that removes the problem rather
            than shortening it.
      - id: SCP-01-05
        title: >-
          Tokens with a lifetime (expiration) that exceeds the workspace maximum lifetime for new
          tokens
        provenance: security-guide
        source_anchor: https://docs.databricks.com/administration-guide/access-control/tokens.html#manage-personal-access-tokens
        source_ref: IA-6
        measurability: rest-api
        severity: medium
        evaluator_status: implemented
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:token.list
        criteria: >-
          Compare workspace-conf for maxTokenLifetimeDays in workspace setting against all tokens
          expiration days
        remediation:
          summary: Update lifetime for all old tokens
          doc_url: https://docs.databricks.com/administration-guide/access-control/tokens.html#manage-personal-access-tokens
          cli: >-
            databricks token-management list   # tokens whose expiry_time is beyond the workspace
            ceiling

            databricks token-management delete <token-id>
          caveat: >-
            The ceiling is not retroactive, which is why these exist: they were created when it was
            higher or absent. Replace each one before deleting it — a token is deleted immediately
            and whatever authenticated with it stops working at that moment.
      - id: SCP-01-06
        title: PAT token creation restricted to admins
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/access-control/tokens
        source_ref: IA-8
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - azure
          - gcp
        collector: rest:workspace:permissions.authorization.tokens
        criteria: >-
          Violation if the users group appears in GET /api/2.0/permissions/authorization/tokens ACL
          — meaning all workspace users can create PATs
        remediation:
          summary: >-
            Databricks recommends you use OAuth access tokens instead of PATs for greater security
            and convenience
          doc_url: https://docs.databricks.com/aws/en/admin/access-control/tokens
      - id: SCP-01-07
        title: Service principal client secrets not stale
        provenance: security-guide
        source_anchor: https://docs.databricks.com/aws/en/admin/users-groups/service-principals
        source_ref: IA-9
        measurability: rest-api
        severity: medium
        evaluator_status: planned
        clouds:
          - aws
          - gcp
        collector: rest:account:accounts.servicePrincipals.credentials.secrets
        criteria: >-
          Check account-level SP secrets and verify all secrets were created or rotated within the
          configured number of days
        remediation:
          summary: >-
            Rotate every service principal OAuth client secret at least every 365 days. Account-wide
            check — pass requires zero stale ACTIVE secrets.
          doc_url: https://docs.databricks.com/aws/en/admin/users-groups/service-principals
  - id: SCP-02
    title: 2. Protect data in transit and at rest
    source_anchor: https://docs.databricks.com/aws/en/lakehouse-architecture/security-compliance-and-privacy/best-practices#2-protect-data-in-transit-and-at-rest
    controls:
