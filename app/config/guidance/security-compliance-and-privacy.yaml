# Answering guidance for the questions in this pillar.
#
# Keyed by control id, flat rather than nested by principle: the catalogue owns that structure.
# Scaffolded by scripts/scaffold-guidance.mjs, which never edits an entry that already exists.
# Held to config/guidance/guidance.schema.json by scripts/check-guidance.mjs.
#
# docs/design/guidance-authoring.md fixes the voice and works one entry through end to end.
pillar: security-compliance-and-privacy
entries:
  # Account setup and identity configuration
  # Q: Are accounts provisioned from your identity provider with SSO, or are there local users and passwords in the account?
  SCP-01-01:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin, with the identity team
    means: >-
      People reach Databricks through your identity provider, and their account exists because the
      identity provider says so. Provisioning and deprovisioning happen there, not by hand in the
      account console.
    matters: >-
      An identity that exists only in Databricks is one your leaver process does not touch. It keeps its
      access after the person leaves, it is not covered by your multi-factor or conditional access
      policy, and nobody discovers it until somebody audits the user list.
    good:
      - Single sign-on is enforced at the account, and there is no route in that skips it.
      - Users and groups arrive by SCIM provisioning from the identity provider rather than being created by hand.
      - A leaver in the identity provider loses Databricks access without anybody doing anything in Databricks.
      - Emergency access accounts, if they exist, are named, few, and monitored.
      - Service principals are used for automation, so no automation runs as a person.
    examples:
      strong: >-
        SSO is enforced account-wide with SCIM provisioning from the identity provider. Groups are
        federated, so joining a team grants the access that comes with it. Two break-glass account
        admins exist, are documented, and their sign-ins are alerted on.
      partial: >-
        SSO is enforced and most users are federated, but a handful of accounts were created by hand
        during the initial setup and remain, and one pipeline still runs as a named engineer.
      weak: >-
        Users are created in the account console. Some sign in with SSO and some with a password, and
        nobody can say which accounts belong to people who have left.
    verify:
      - how: sql
        where: |-
          select action_name, count(*) as events,
          count(distinct coalesce(user_identity.email, user_identity.subject_name, 'unknown')) as actors
          from system.access.audit
          where event_date >= current_date() - 30
            and (
              action_name in ('login', 'samlLogin', 'oidcTokenAuthorization')
              or lower(action_name) like '%ogin%'
              or lower(action_name) like '%uthentication%'
            )
          group by all
          order by events desc
        expect: >-
          No row for action_name = login. SAML and OAuth counts sit beside that reading. Other
          action names are listed, not classified.
        caveat: >-
          Zero login rows is unmeasured, not a pass: a local account that did not authenticate in the
          window is invisible, and the account-plane provisioning path is unreadable. Rows with
          workspace_id = 0 belong to the account; dropping them turns a used password into a quiet
          window.
      - how: ui
        where: Account console > User management, users that can sign in with a password rather than through the identity provider
        expect: None, or only named break-glass accounts whose sign-ins are alerted on
        caveat: >-
          This is the half the audit reading cannot see. The finding names credentials that were used;
          accounts that exist and never logged in during the window do not appear there.
      - how: by-hand
        where: Ask the identity team whether Databricks is in the joiner-mover-leaver process
        expect: Yes, with the connector named — rather than "we remove them when we notice"
    pitfalls:
      - >-
        SSO enabled but not enforced, so the password route still works and is the one automation and
        old bookmarks use.
      - >-
        SCIM provisioning users and not groups, so membership drifts: the identity provider says
        somebody left the team and Databricks still grants what the team can read.
      - >-
        Break-glass accounts that are not documented, so they are indistinguishable from the local
        accounts that should not exist.
      - >-
        Reading a quiet audit window as proof that local accounts are gone. Absence of a password
        login settles nothing about accounts that were not used while the window was retained.
    partial_when: >-
      SSO is enforced but a residue of hand-made accounts or personal automation identities remains, or
      users are federated and groups are still managed in Databricks.
    references:
      - https://docs.databricks.com/aws/en/admin/users-groups/scim/
      - https://docs.databricks.com/aws/en/security/auth/
    advice:
      start_from: >-
        Enforce single sign-on at the account, provision users and groups by SCIM from the identity
        provider, and treat any username-and-password login in the audit window as a local credential
        to remove — not as a pass once the window goes quiet.
      depends_on:
        - >-
          Emergency account-admin access that must work when the identity provider is down stays as
          named, monitored break-glass accounts, not as an open password path for ordinary users.
        - >-
          Automation that still needs a credential becomes a service principal using OAuth, so no
          pipeline authenticates as a person or with a local password.
      path:
        - >-
          Read the audit window for action_name = login. Those actors are the local credentials that
          were used; disable or delete them first.
        - >-
          Then open User management and find password-capable accounts that never appeared in the
          window — the finding cannot see those.
        - >-
          Turn on SCIM for groups as well as users, and confirm Databricks is in the
          joiner-mover-leaver process by removing a test user in the identity provider.
      costs:
        - >-
          Break-glass accounts are a standing exception and a page-worthy event when used; without
          the alert they become the local accounts this control exists to find.
        - >-
          SCIM that syncs users and not groups leaves membership to be maintained by hand, which is
          how leavers keep their grants.
      retain: >-
        The SSO enforcement setting, a dated audit extract with zero login actions, and the name of
        the SCIM connector. The extract is the part the finding can repeat.
      revisit: >-
        A new workspace, an identity-provider change, or any login action appearing in the audit log.
        Failing those, when the audit retention window rolls.

  # Identity and access management best practices
  # Q: Are permissions granted to groups against a least-privilege model, and is access removed when people move on?
  SCP-01-02:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the data owners
    means: >-
      Access is granted to groups that mean something — a team, a role — with the least privilege the
      work needs, and losing membership of the group loses the access.
    matters: >-
      Grants made to individuals accumulate and are never removed, because nobody can tell which are
      still needed. The estate reaches a state where the honest answer to "who can read this" is a
      report nobody can act on, and privilege only ever ratchets up.
    good:
      - Grants are to groups, and the groups come from the identity provider.
      - Read and write are separated, so a consumer group cannot modify what it reads.
      - Admin roles — account admin, metastore admin, workspace admin — are held by a small named set.
      - Access is reviewed on a stated cadence, and the last review has a date and an outcome.
      - Someone changing team loses the old team's access as a consequence of the move.
    examples:
      strong: >-
        All grants are to identity provider groups, separated into reader and writer roles per domain.
        Four people hold account admin. Access is reviewed quarterly against the group definitions, and
        the last review removed grants.
      partial: >-
        Most grants are to groups, but a dozen direct grants to individuals remain from before the
        migration, and no access review has happened since the platform was set up.
      weak: >-
        Grants are made to whoever asks, directly to their user. Workspace admin is held by a dozen
        people because it was easier than working out the specific permission.
    verify:
      - how: sql
        where: |-
          select case when grantee ilike '%@%' then 'a person'
          when grantee rlike '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          then 'a service principal'
          else 'a group' end as kind,
          count(*) as grants, count(distinct grantee) as grantees
          from system.information_schema.table_privileges group by all order by grants desc
        expect: >-
          Groups holding most of the grants, with grants to individual people rare or absent
        caveat: >-
          Service principals are named by application id and carry no `@`, so a two-way split counts each
          as a group and an estate granting one per person reads as exemplary — sixty-one grants, on the
          estate this was measured against. Run it as a metastore admin: this view shows only objects the
          reader holds a privilege on, so a partial view of the grants looks like a tidy one.
      - how: ui
        where: >-
          Account console > User management > Users, and which of them carry the account admin role.
          There is no Roles tab — account admin is a role held by an individual user
        expect: A small named set, rather than everybody who has ever needed to change a setting
      - how: by-hand
        where: Ask when access was last reviewed and what changed as a result
        expect: A date and a removal, rather than a review that confirmed everything
    pitfalls:
      - >-
        Groups that mirror the org chart rather than the access need, so a reorganisation silently
        changes who can read production data.
      - >-
        An access review that inspects the list and removes nothing, which produces the audit artefact
        and none of the effect.
      - >-
        Granting a broad privilege because working out the specific one took longer, which is the
        mechanism by which almost every over-privileged estate got that way.
    partial_when: >-
      Grants are mostly to groups with a residue of direct ones, or the model is least-privilege and
      nothing is ever reviewed or removed.
    references:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/
      - https://docs.databricks.com/aws/en/admin/users-groups/best-practices
    advice:
      start_from: >-
        Grant only to identity-provider groups, split reader from writer per domain, keep account
        admin with a named handful of people, and run a quarterly review that is expected to remove
        something.
      depends_on:
        - >-
          Service principals are not in the org-chart groups, so either grant to a group of
          principals or accept named principals as the exception the review watches.
        - >-
          A workspace whose grants still fit on one page can review individuals; the group model is
          for the day that page no longer fits in a meeting.
      path:
        - >-
          Stop making new grants to named people. Route the next request through a group even if the
          group has one member.
        - >-
          Move the residue of direct grants into groups, starting with production catalogs.
        - >-
          Run a review that has to produce a removal. A review that confirms everything is the
          pitfall, not the practice.
      costs:
        - >-
          Designing groups that match access rather than the org chart takes the data owners a week
          they do not have, and a wrong group is a silent over-grant.
        - >-
          A quarterly review costs a day of the people who know what the data is for.
      retain: >-
        The privilege query grouped by grantee kind, and a dated note of the last review that names
        what it removed. A review that removed nothing is the artefact of a process that did not run.
      revisit: >-
        A reorganisation, a new domain catalog, or the account-admin list growing. Failing those,
        every ninety days — the attestation cadence.

  # Network deployment considerations for AWS
  # Q: Was the network design chosen deliberately — customer-managed VPC, private connectivity, egress path — or accepted as the default?
  SCP-03-01:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Cloud network architect, with the platform owner
    means: >-
      Somebody decided how the workspace sits in your network — whether the VPC is yours, whether access
      is private, where outbound traffic goes — and can say why, rather than the deployment having taken
      whatever the quickstart produced.
    matters: >-
      Network design is the hardest thing to change after the fact: moving a workspace into a
      customer-managed VPC is a migration, not a setting. A default accepted at setup becomes the
      constraint every later security requirement has to work around.
    good:
      - The workspace uses a customer-managed VPC where your policy requires one, and somebody can say whether it does.
      - Subnets, security groups and the egress path were specified rather than generated.
      - Private connectivity for the control plane and for storage was a decision, taken either way with a reason.
      - The design is documented somewhere the next engineer will find it.
      - The same design is applied consistently across workspaces, or the differences are deliberate.
    examples:
      strong: >-
        Workspaces are deployed into a customer-managed VPC from a reviewed Terraform module, with
        private connectivity to the control plane and gateway endpoints for storage. The design document
        names the alternatives that were rejected and why.
      partial: >-
        Production is in a customer-managed VPC that was designed properly. The two workspaces created
        later for data science use the default deployment, and nobody has compared them.
      weak: >-
        The workspaces were created through the console with defaults. Nobody can say what VPC they are
        in or how outbound traffic leaves.
    verify:
      - how: ui
        where: Account console > Workspaces, the network configuration on each
        expect: A named network configuration rather than a Databricks-managed default, where policy requires it
      - how: cli
        where: databricks account networks list
        expect: Configurations you recognise, one per deployment pattern rather than one per accident
      - how: by-hand
        where: Ask who chose the network design and whether the document still describes the estate
        expect: A person and a document, rather than "it was set up before I joined"
    pitfalls:
      - >-
        A reviewed design for production and defaults everywhere else, which leaves the least-controlled
        workspace holding a copy of production data.
      - >-
        Private connectivity to the control plane with an open egress path, which secures the direction
        an attacker was not going to use.
      - >-
        A design documented at deployment and not maintained, so it describes the intent of two years
        ago and the estate has drifted from it unrecorded.
    partial_when: >-
      One workspace was designed deliberately and others took defaults, or the design was chosen with
      care and has not been revisited as the estate grew.
    references:
      - https://docs.databricks.com/aws/en/security/network/classic/customer-managed-vpc
      - https://docs.databricks.com/aws/en/security/network/
    advice:
      start_from: >-
        A reviewed module that deploys into a customer-managed VPC (or VNet injection on Azure),
        with the front-end private-connectivity choice and the egress path written down before the
        first workspace exists.
      depends_on:
        - >-
          A short-lived sandbox that will never hold production data can take the Databricks-managed
          network if the design document says so and the workspace has a destruction date.
        - >-
          A policy that forbids a Databricks-managed VPC makes the customer-managed path the only
          option, including for the workspace created to try something quickly.
        - >-
          Partners or an identity provider that cannot reach a private endpoint need a named
          exception on that workspace, not a second workspace created on console defaults.
      path:
        - >-
          Write the three decisions first: who owns the VPC, whether the front end is private, and
          where outbound traffic goes. Create no workspace until each has a yes or a no.
        - >-
          Deploy the first workspace from that module, then compare every later one against it
          rather than against the console defaults.
      costs:
        - >-
          Adding a customer-managed VPC later is a migration, not a setting, so a default accepted
          on day one is weeks of rebuild when the first security review asks.
        - >-
          Private connectivity adds DNS, endpoints and a path for every client that currently uses
          the public URL, including the BI tool nobody listed.
      retain: >-
        The design document that names the three decisions and the alternatives that were rejected,
        stored next to the Terraform or ARM that produced the workspace.
      revisit: >-
        A new region, a workspace created outside the module, or serverless becoming the majority of
        compute — each changes a path the first design assumed.

  # Network security best practices
  # Q: Is workspace access restricted to known networks, and is outbound traffic from compute constrained?
  SCP-03-02:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Cloud network architect, with the account admin
    means: >-
      Reaching the workspace requires coming from a network you recognise, and compute inside it cannot
      send data to arbitrary destinations on the internet.
    matters: >-
      Without an inbound restriction, a leaked token is usable from anywhere. Without an outbound one,
      any code that runs on your compute — a notebook, a library, a model's dependency — can move data
      out, and the audit log records a successful query rather than an exfiltration.
    good:
      - An IP access list or private connectivity restricts where the workspace can be reached from.
      - The list is maintained, so it reflects the current VPN and office ranges rather than last year's.
      - Outbound traffic from compute goes through a controlled path rather than a general internet gateway.
      - The destinations compute may reach are an allowlist, not everything minus a blocklist.
      - Somebody can name what breaks if the egress policy tightens, which means somebody has looked.
    examples:
      strong: >-
        Access requires private connectivity or an address in a maintained IP access list. Compute
        egresses through a firewall with an allowlist covering the package repositories and APIs the
        workloads need, and requests outside it are logged and refused.
      partial: >-
        An IP access list restricts workspace access and is up to date, but compute has unrestricted
        outbound internet access because a pipeline needed to reach a vendor API and nobody scoped it.
      weak: >-
        The workspace is reachable from any address with a valid token, and compute can reach anything.
    verify:
      - how: ui
        where: Account console > Security > Policies > Account console IP access list, and the ranges in it
        expect: Current ranges you can attribute, rather than an empty list or one nobody maintains
      - how: cli
        where: databricks account ip-access-lists list
        expect: An enabled allowlist rather than none
      - how: by-hand
        where: >-
          Ask the network team what a cluster can reach outbound, and compare it with what the workloads
          need
        expect: An allowlist and a gap analysis, rather than "everything"
    pitfalls:
      - >-
        An IP access list that was accurate when it was written and now blocks the current VPN range, so
        somebody widened it to 0.0.0.0/0 "temporarily".
      - >-
        Restricting inbound and leaving outbound open, which addresses credential theft and not data
        exfiltration — and exfiltration is the one that does not need a credential.
      - >-
        Blocklisting known-bad destinations rather than allowlisting needed ones, which is a policy that
        cannot be complete by construction.
    partial_when: >-
      Inbound access is restricted and outbound is not, or both are configured and the lists are stale
      enough that somebody has had to widen one to keep work moving.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
      - https://docs.databricks.com/aws/en/security/network/serverless-network-security/
    advice:
      start_from: >-
        Inbound access limited to current VPN and office ranges, or to front-end private
        connectivity, and serverless egress in restricted mode with an allowlist of the package
        repositories and APIs the workloads actually call.
      depends_on:
        - >-
          Front-end private connectivity with public access disabled makes the human IP list
          unnecessary; the remaining inbound job is the NAT addresses classic compute uses to reach
          the control plane.
        - >-
          A SaaS tool whose egress addresses are not stable may need a named exception rather than
          widening the list to the internet.
        - >-
          Classic compute egress is a firewall in your VPC, not a Databricks network policy. A
          serverless-only estate can skip that firewall and still needs the policy.
      path:
        - >-
          Restrict inbound first: an allow list of current ranges, enabled, with the address you are
          connecting from already on it.
        - >-
          Put serverless egress in dry-run, read what was actually reached, then switch to restricted
          with those destinations. Tighten classic compute only after a test from a cluster.
      costs:
        - >-
          A stale allow list locks people out the day the VPN range changes, which is how lists
          become temporarily 0.0.0.0/0 and stay that way.
        - >-
          Restricted egress breaks library installs and model-serving image builds until every
          destination a build needs is named.
      retain: >-
        The current inbound allow-list export and the dry-run denial log that justified each
        outbound destination, both dated.
      revisit: >-
        A VPN range change, a new vendor API, or serverless landing on a workspace that had only
        ever restricted classic compute.

  # Egress control from compute — live connectivity test
  # Q: Has anyone verified from inside a cluster that egress is actually blocked, rather than trusting the configuration?
  SCP-03-13:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the network team
    means: >-
      Somebody has run something on a cluster that tries to reach the internet, and observed it fail.
      Not read the firewall rules — run the test from where the data is.
    matters: >-
      Egress configuration is several layers deep: security groups, route tables, a firewall, a proxy,
      and each of them can be right while the combination leaks. Configuration review finds the wrong
      rule; only a test from inside the cluster finds the path nobody drew.
    good:
      - A test has been run from a cluster, attempting a connection to an address outside the allowlist.
      - It failed, and somebody recorded what the failure looked like.
      - The test covered both classic compute and serverless, which egress differently.
      - It is repeated after network changes, rather than run once at deployment.
      - Somebody knows the date of the last test.
    examples:
      strong: >-
        A notebook attempting outbound connections to a set of addresses is run quarterly and after any
        network change, on both classic and serverless compute. The results are recorded with dates, and
        the last run failed as expected on every blocked destination.
      partial: >-
        Egress was tested from a classic cluster during the original deployment eighteen months ago and
        passed. Nothing has been tested since, and serverless was adopted after that test.
      weak: >-
        Nobody has tried. The configuration is believed to block egress because that is what the design
        says.
    verify:
      - how: by-hand
        where: >-
          A notebook on a production-equivalent cluster, attempting an outbound connection to an address
          outside the allowlist
        expect: A timeout or a refusal, and a note of which cluster and which date
      - how: ui
        where: >-
          Repeat the same notebook on serverless compute, since it egresses through a different path
        expect: The same refusal, rather than an assumption that the classic result carries over
      - how: by-hand
        where: Ask for the date and result of the last egress test
        expect: A date within the period since the last network change
    pitfalls:
      - >-
        Testing from a cluster in a different subnet from the production one, which tests a route table
        nobody's workload uses.
      - >-
        Testing DNS resolution rather than connection. A name that resolves and cannot be reached is a
        pass, and a name that fails to resolve while the IP is reachable is not.
      - >-
        Testing classic compute and assuming serverless behaves the same way, which it does not — the
        network path and the controls over it are different.
    partial_when: >-
      A test was run once and not repeated since the network changed, or classic compute was tested and
      serverless — which egresses differently — was not.
    references:
      - https://docs.databricks.com/aws/en/security/network/serverless-network-security/serverless-firewall-config
      - https://docs.databricks.com/aws/en/security/network/data-exfiltration-protection
    advice:
      start_from: >-
        A notebook that attempts a connection to an address the policy is supposed to refuse, run on
        both classic and serverless compute after every network change, with the failure recorded.
      depends_on:
        - >-
          A serverless-only workspace can skip the classic cluster and still has to run the
          serverless test, because the path and the controls over it are different.
        - >-
          An allow list that includes the test destination will succeed and prove nothing. Pick an
          address the policy is meant to refuse, not one a pipeline needs.
      path:
        - >-
          Run the test from a production-equivalent cluster before calling the design finished, and
          record the cluster, the destination and whether it timed out or was refused.
        - >-
          Repeat the same notebook on serverless the same day. Then put it on a quarterly job that
          writes the result somewhere a review can find.
      costs:
        - >-
          The notebook is minutes. The cost is running it from a subnet no workload uses and filing
          a pass that is not about production.
        - >-
          A scheduled test that still reaches the internet is an alerting problem, not a green
          check: it means the policy drifted and nobody looked.
      retain: >-
        The dated result from the last run after the last network change — cluster or warehouse,
        destination, and the timeout or refusal — not the firewall screenshot from deployment.
      revisit: >-
        Any change to security groups, the firewall or the network policy, and the first serverless
        job on a workspace that had only ever tested classic compute.

  # DBFS mounts
  # Q: Are there DBFS mounts still in use, giving access to cloud storage outside Unity Catalog governance?
  SCP-04-06:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator
    means: >-
      No workload reaches cloud storage through a DBFS mount. Storage access goes through Unity Catalog
      external locations, so the grant that governs a table also governs the files beneath it.
    matters: >-
      A mount is a credential attached to a path, available to anybody who can run code in the
      workspace. It bypasses the catalogue entirely: revoking a table grant does not remove it, the audit
      log attributes the access to the mount's identity rather than the user's, and the answer to who
      can read that bucket becomes "everybody with a cluster".
    good:
      - '`dbfs ls dbfs:/mnt` returns nothing, or nothing that reaches data anybody cares about.'
      - Raw storage is registered as external locations with storage credentials, and grants are made on those.
      - No cluster policy permits an instance profile or a credential passthrough that would substitute for a mount.
      - Notebooks and jobs reference catalogue objects or volume paths rather than /mnt or s3:// paths.
      - Where a mount remains, it is known, owned, and has a removal date.
    examples:
      strong: >-
        Mounts were removed during the Unity Catalog migration. Raw zones are external locations,
        engineers read files through volumes, and a check in CI fails a notebook that references /mnt or
        a bare cloud path.
      partial: >-
        Most mounts are gone, but two remain because an ingestion job written before the migration reads
        one and nobody has rewritten it. They are known and have no removal date.
      weak: >-
        Mounts are the normal way pipelines reach storage, and the credentials behind them are shared
        across every workload in the workspace.
    verify:
      - how: cli
        where: databricks fs ls dbfs:/mnt
        expect: An empty listing, or mounts you can account for individually
      - how: by-hand
        where: >-
          Search the production repository for `/mnt/`, `dbutils.fs.mount` and bare `s3://`, `abfss://` or
          `gs://` paths
        expect: >-
          No matches outside archived code, which is the difference between a mount existing and a mount
          being used.
        caveat: >-
          This has to be a code search rather than an audit query: `system.access.audit` does not record a
          Spark read through a mount, so a query for `/mnt/` paths there returns nothing on every estate and
          would read as a clean result on the estate that mounts everything
      - how: sql
        where: |-
          select action_name, count(*) as events from system.access.audit
          where event_date > current_date() - 30 and service_name = 'unityCatalog'
          and action_name in ('generateTemporaryTableCredential', 'getVolume')
          group by all order by events desc
        expect: >-
          Credential and volume requests going through Unity Catalog, which is the positive evidence that
          storage access is governed. Nothing here alongside busy pipelines means the data is being reached
          some other way
      - how: ui
        where: Catalog Explorer > External Data > External locations
        expect: Registered locations covering the raw zones the mounts used to reach
    pitfalls:
      - >-
        Removing the mount definition and leaving the workloads reading bare cloud paths with a cluster
        credential, which is the same bypass without the inventory.
      - >-
        A mount nobody uses, left in place because it is harmless. It is a live credential and it is the
        one nobody will notice being used.
      - >-
        Migrating tables into Unity Catalog while the pipelines that write them still go through a mount,
        so the governed table is fed by an ungoverned path.
    partial_when: >-
      Most storage access is governed and one or two mounts remain for workloads nobody has rewritten,
      or the mounts are gone and some workloads read bare cloud paths with cluster credentials instead.
    references:
      - https://docs.databricks.com/aws/en/dbfs/mounts
      - https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage#external-locations
    advice:
      start_from: >-
        Take the mounts down. Register each bucket they pointed at as an external location with its
        own storage credential, and point notebooks and jobs at catalog objects or volume paths
        instead of /mnt.
      depends_on:
        - >-
          An ingestion job that still opens a mount path keeps that one mount named, owned, and
          dated for removal, rather than leaving the whole /mnt tree as the access model.
        - >-
          A cluster instance profile that can read the same bucket is the same bypass; retire it
          with the mount, or the inventory goes quiet and the credential remains.
      path:
        - >-
          List dbfs:/mnt and search the production repository for /mnt, dbutils.fs.mount, and bare
          cloud URIs. That is the used set, not only the defined set.
        - >-
          Stand up the matching external locations, cut the callers over, then unmount.
        - >-
          Remove instance-profile and passthrough permissions from the policies those callers used,
          so the next job cannot recreate the bypass.
      costs:
        - >-
          Rewriting a pre-migration ingestion job is a sprint, and unmounting before that rewrite
          is an outage the next time the job runs.
        - >-
          Every grant that used to be "anyone on a cluster" has to be restated on the location or
          the volume, which is the week the data owners discover they never decided who may read.
      retain: >-
        The empty `databricks fs ls dbfs:/mnt` listing, dated, and the catalog page for the
        external locations that replaced each mount.
      revisit: >-
        A new workspace (mounts can be created there even when this one is clean), a lift-and-shift
        of a job that still hard-codes /mnt, or a CI check for those paths going quiet.

  # PAT tokens with no lifetime (expiration) limit
  # rest-api inventory: the finding is how many listed tokens have no expiry, not a share of an estate.
  # Partial is the practice around that boolean — expiries so long they function as none — not "some tokens".
  # Q: Are there personal access tokens in this workspace with no expiry?
  SCP-01-03:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Every personal access token in the workspace has an expiry date. A token the API returns
      without one stays valid until someone revokes it.
    matters: >-
      A credential with no end date outlives the person who minted it. Setting a workspace ceiling
      binds only tokens created afterwards, so these have to be found and revoked one by one.
    good:
      - The token listing has no row whose expiry_time is missing.
      - Callers that still need a PAT have a dated replacement already issued.
      - Automation that can use OAuth has moved off PATs, so the inventory is shrinking.
      - Somebody can name what each remaining token is for, from its comment or its owner.
    examples:
      strong: >-
        The listing shows dated tokens only. Two CI jobs that used to hold perpetual ones now
        authenticate as service principals with OAuth, and the old tokens were revoked the day the
        jobs moved.
      partial: >-
        Every token has an expiry, but several were issued for years, so they will still be valid
        long after the people who created them have left.
      weak: >-
        Tokens minted in the first year of the workspace have no expiry. Nobody can say which job
        still presents them.
    verify:
      - how: cli
        where: databricks token-management list
        expect: >-
          No token whose expiry_time is missing. A missing expiry is a token that never expires,
          not missing data.
        caveat: >-
          An empty listing is not a pass — the finding is not-applicable when there are no tokens.
          A truncated listing is a floor: tokens past the page cap were not checked.
      - how: ui
        where: Account console > Security > Token report, filtered for access tokens with no expiration date
        expect: An empty filtered report, or only tokens you are about to revoke
        caveat: >-
          The account report spans workspaces. The finding lists tokens in this workspace, so a
          clean report here and a perpetual token in another workspace are not the same reading.
    pitfalls:
      - >-
        Setting a maximum lifetime and assuming the perpetual tokens disappear. The ceiling does
        not revoke what already exists.
      - >-
        Revoking a token before finding its caller. The audit log shows which requests carried it;
        deleting first is how a forgotten job fails on Monday.
      - >-
        Reading Databricks' unused-token revocation as coverage for tokens that are still used.
        A perpetual token that is presented regularly is never unused.
    partial_when: >-
      Every listed token has an expiry date, but several were issued for years, so they function as
      perpetual until that distant date.
    not_applicable_when: >-
      This workspace has no personal access tokens, so there are none whose lifetime could be
      unbounded.
    references:
      - https://docs.databricks.com/aws/en/admin/access-control/tokens
      - https://docs.databricks.com/aws/en/dev-tools/auth/pat
    advice:
      start_from: >-
        Revoke every token that has no expiry, after replacing whatever still calls with it. Do
        not wait for a workspace ceiling to clean them up — it will not.
      depends_on:
        - >-
          A vendor or Partner Connect integration that can only present a PAT keeps one dated
          token, owned and rotated, rather than a perpetual one.
        - >-
          A service principal that can use OAuth should move there, which removes the token from
          this inventory instead of shortening it.
      path:
        - >-
          List the tokens with no expiry and, for each owner named, find the caller in the audit
          log before touching anything.
        - >-
          Issue a dated replacement — or an OAuth client — then revoke the perpetual one the day
          the caller has moved.
        - >-
          Repeat until the listing has no missing expiry. Tokens that already have a date belong
          to the lifetime-ceiling controls, not this one.
      costs:
        - >-
          Finding the caller of a token nobody remembers issuing can take a day, and revoking
          without that search breaks whatever was using it immediately.
        - >-
          Moving a job from a PAT to OAuth is a credential change in CI and in any secret store
          that held the old value.
      retain: >-
        A dated token-management listing that shows every remaining token with an expiry, and the
        ticket that records which perpetual ones were revoked and what replaced them.
      revisit: >-
        A new integration that asks for a PAT, a workspace import of users who can mint tokens, or
        any token appearing without an expiry. Failing those, when you next set or tighten the
        workspace ceiling.

  # Maximum lifetime of new tokens to something other than unlimited
  # Q: Is a maximum lifetime set for newly created tokens, rather than left unlimited?
  SCP-01-04:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The workspace has a maximum lifetime for newly created tokens, stored as
      maxTokenLifetimeDays. Tokens minted after it is set cannot be issued for longer than that
      number of days.
    matters: >-
      Without a ceiling, anyone who can mint a token can mint one that this control will later
      report as perpetual. Tomorrow's inventory starts from whatever is allowed today.
    good:
      - maxTokenLifetimeDays is set to a number, not missing and not negative.
      - That number is 90 days or fewer — the threshold the finding compares against.
      - New tokens created in the UI cannot pick a lifetime above the ceiling.
      - The ceiling is applied in every workspace, not only the one that was reviewed first.
    examples:
      strong: >-
        maxTokenLifetimeDays is 90 in each workspace. A user creating a token cannot pick a
        longer life, and the last three tokens issued show expiries inside that window.
      partial: >-
        A maximum is set, but at 365 days. New tokens are bounded, and they are still valid for
        a year after the person who minted them has left.
      weak: >-
        The setting has never been touched. Users create tokens with whatever lifetime the form
        offers, including none.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys maxTokenLifetimeDays
        expect: >-
          A number at or below 90. Missing or negative is the failure. A number above 90 is
          partial.
        caveat: >-
          This finding reads the key, not the product default. A missing key is scored as no
          ceiling. Documentation currently names 730 days as the default life of a new token when
          no custom ceiling is set; setting the key to 0 restores that default.
      - how: ui
        where: Settings > Advanced > Personal Access Tokens, and whether new tokens can be created with a lifetime above the ceiling
        expect: A configured maximum, and the create-token form refusing a longer life
    pitfalls:
      - >-
        Setting the ceiling and treating existing long-lived tokens as fixed. They keep their
        original lifetime until revoked — that residue is the next control.
      - >-
        Setting the key to 0 to "clear a bad value", which removes the custom ceiling and
        restores the product default of 730 days.
      - >-
        A negative value, which the API treats as unlimited and this finding scores as a failure
        — not as a very short lifetime.
    partial_when: >-
      A maximum is set, so new tokens are bounded, but the number of days is longer than the 90
      the finding expects.
    references:
      - https://docs.databricks.com/aws/en/admin/access-control/tokens
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set maxTokenLifetimeDays to 90 in each workspace. That is the number the finding
        compares against, and it is the ceiling the token-administration page recommends for new
        tokens.
      depends_on:
        - >-
          A vendor that cannot rotate inside 90 days wants a documented exception and a named
          owner, not a workspace-wide year, because the year applies to every token minted
          afterwards.
        - >-
          An estate moving off PATs can set a shorter ceiling — 30 days — so the remaining tokens
          die quickly once callers have an OAuth path.
      path:
        - >-
          Read the current key. Missing or negative is the first fix; a number above 90 is the
          second.
        - >-
          Set 90 (or shorter). Tell the teams that mint tokens before you do — a form that
          suddenly refuses 365 days looks like an outage.
        - >-
          Then list existing tokens. The ceiling does not shorten them; that comparison is the
          next control.
      costs:
        - >-
          Every integration that used to mint a year-long token now needs a rotation job, which
          is somebody's pager the first time it is forgotten.
        - >-
          Partner Connect and similar tools still need PATs enabled; a ceiling is not the same as
          turning tokens off, and turning them off breaks those tools.
      retain: >-
        The get-status output for maxTokenLifetimeDays, dated, from each workspace. One number
        per workspace is the whole artefact.
      revisit: >-
        A new workspace (it will not inherit the ceiling), a vendor that cannot rotate inside it,
        or a request to raise it. Failing those, when you next review who may mint tokens.

  # Tokens with a lifetime (expiration) that exceeds the workspace maximum lifetime for new tokens
  # Q: Are there tokens still valid for longer than the maximum you now allow for new ones?
  SCP-01-05:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Tokens already issued under a looser or absent ceiling have been replaced, so none that
      can be dated was minted for longer than the maximum that now applies to new ones.
    matters: >-
      The ceiling binds tokens created after it was set. Until the older ones are replaced, the
      policy is true of new minting and not yet true of the estate.
    good:
      - Every token that has both a creation time and an expiry was issued for no longer than the current ceiling.
      - Replacements were issued and callers moved before the older tokens were revoked.
      - Tokens with no expiry are handled as perpetual, not ignored as undated.
      - The comparison is against issued lifetime, not against how many days remain.
    examples:
      strong: >-
        The ceiling has been 90 days for a year. Every dated token in the listing was issued
        inside that window, and the last long-lived ones were revoked after their jobs moved.
      partial: >-
        The ceiling is in force and new tokens comply, but a handful issued the year before it
        was set still have months of life left and no replacement has been issued.
      weak: >-
        A 90-day ceiling was set last week. Tokens minted in the years before it still have
        expiries a year out, and nobody has listed them.
    verify:
      - how: cli
        where: |-
          databricks workspace-conf get-status --keys maxTokenLifetimeDays
          databricks token-management list
        expect: >-
          For tokens that have both creation_time and expiry_time, expiry minus created is at
          most the ceiling in days.
        caveat: >-
          Tokens missing either timestamp are not in this comparison — including tokens with no
          expiry, which the perpetual-token control reports. No usable ceiling makes this
          unmeasured, not a pass. Issued lifetime is the difference, not days remaining.
      - how: ui
        where: Account console > Security > Token report, comparing created date and expiration date against the workspace ceiling
        expect: No dated token whose created-to-expiry span is longer than the ceiling
        caveat: >-
          The report spans workspaces. A token that exceeds this workspace's ceiling may have
          been issued under another workspace's setting.
    pitfalls:
      - >-
        Comparing remaining life to the ceiling. A token issued for 400 days with 20 days left
        still exceeds the policy; it was minted too long, which is what this control reads.
      - >-
        Counting a clean result while the ceiling is missing. With no policy there is nothing to
        exceed, and that absence is the previous control's finding.
      - >-
        Deleting a long-lived token before its replacement is in the caller's secret store. The
        token stops working at the moment it is revoked.
    partial_when: >-
      The ceiling is in force for new tokens and replacements for the longer-lived ones are
      issued but not yet cut over, so the old tokens are still in the listing.
    not_applicable_when: >-
      No token in this workspace has both a creation time and an expiry, so none can be compared
      against the ceiling.
    references:
      - https://docs.databricks.com/aws/en/admin/access-control/tokens
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/token-management-commands
    advice:
      start_from: >-
        Once a ceiling exists, list dated tokens whose issued lifetime is longer than that
        ceiling, replace each caller, then revoke the old token. Do not wait for the original
        expiry.
      depends_on:
        - >-
          A caller that cannot rotate until a change window wants a dated exception and a
          revocation date, not a raised ceiling, because raising it re-opens minting for
          everyone.
        - >-
          Tokens with no expiry are not in this list — revoke those as perpetual tokens first,
          or they sit beside a clean comparison and look like they were checked.
      path:
        - >-
          Confirm a usable maxTokenLifetimeDays exists. Without it this comparison is
          unmeasured, and the work is setting the ceiling.
        - >-
          List tokens that have both timestamps and whose expiry minus created exceeds that
          number of days. Name the owners; find the callers.
        - >-
          Issue a token inside the ceiling — or move the caller to OAuth — then revoke the
          longer-lived one.
      costs:
        - >-
          Each revocation is immediate. A missed caller is an outage, which is why the audit
          search comes before the delete.
        - >-
          Replacing a token in several secret stores takes the owners of those stores, not only
          the workspace admin who can see the listing.
      retain: >-
        The two CLI outputs together — the ceiling and the listing — dated, with the issued
        lifetime of each remaining dated token written beside it.
      revisit: >-
        The ceiling changing (a lower one creates new residue), a workspace merge, or a token
        minted by an admin override. Failing those, the next time a long-lived token's owner
        leaves.

  # PAT token creation restricted to admins
  # Q: Is creating personal access tokens restricted to admins, rather than allowed to all workspace users?
  SCP-01-06:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Creating a personal access token is a privilege held by workspace admins and by named
      groups that still need one, not by the users group that every workspace member is in.
    matters: >-
      A PAT inherits everything its creator can do and outlives their session. If the users
      group can mint one, a least-privilege grant is one click from a portable credential.
    good:
      - The users group does not have CAN USE on authorization/tokens.
      - Admins retain CAN MANAGE, which the platform will not let you revoke.
      - Any non-admin who can still mint a token is in a named group with a reason.
      - Partner tools that require a PAT use a service principal in that named group, not a person's account.
    examples:
      strong: >-
        The users group has no token permission. A "pat-issuers" group holds CAN USE for two
        service principals that Partner Connect needs, and everyone else authenticates with
        OAuth.
      partial: >-
        The users group cannot create tokens, but an "engineers" group that most of the
        workspace belongs to still can, so the restriction is on the name of the group rather
        than on who can mint.
      weak: >-
        The users group has CAN USE. Anyone who can open the workspace can generate a token.
    verify:
      - how: cli
        where: databricks token-management get-permissions
        expect: >-
          The users group does not appear with CAN USE. Admins keeping CAN MANAGE is expected
          and cannot be revoked.
        caveat: >-
          The users group on this ACL means every workspace user can create a token. A different
          group that most people are in is the same exposure and this check does not say that.
      - how: ui
        where: Settings > Developer > Personal Access Tokens > Permissions
        expect: No CAN USE row for the users group
      - how: api
        where: GET /api/2.0/permissions/authorization/tokens
        expect: The users group is absent from the access-control list, or present without CAN USE
        caveat: >-
          This endpoint is the intended collector and no resolver reads it yet, so the app will
          not score this for you. The ACL is the evidence a person can paste.
    pitfalls:
      - >-
        Removing the users group and adding "all staff" or the engineering department instead,
        which is the same permission under a more reassuring name.
      - >-
        Restricting creation and leaving existing tokens usable. Revoking CAN USE makes those
        tokens unusable; if you only change who may mint, the ones already issued keep working.
      - >-
        Disabling personal access tokens for the whole workspace to pass this. Partner Connect
        and some service-principal flows require them enabled; the permission ACL is the
        narrower control.
    partial_when: >-
      The users group cannot create tokens, but a broad custom group that most people belong to
      still can.
    not_applicable_when: >-
      Personal access token authentication is disabled for the workspace, so nobody can create
      or use a PAT here.
    references:
      - https://docs.databricks.com/aws/en/security/auth/api-access-permissions
      - https://docs.databricks.com/aws/en/admin/access-control/tokens
    advice:
      start_from: >-
        Remove CAN USE from the users group on the tokens ACL. Leave admins as they are, and add
        named groups only for the service principals that still have to mint a PAT.
      depends_on:
        - >-
          Partner Connect and a few partner integrations require PATs enabled on the workspace;
          restrict who may mint, do not flip the workspace toggle off to clear this.
        - >-
          A team that still scripts against the REST API with a user PAT wants a service
          principal in the named group, not their user added to it.
      path:
        - >-
          Read the ACL. If the users group has CAN USE, that is the first removal — it is the
          condition the intended collector treats as the violation.
        - >-
          Add a named group for the principals that still need to mint, then tell everyone else
          the form will refuse them.
        - >-
          Review tokens that already exist. Restricting creation does not revoke them; unused
          ones can go, and used ones need an owner.
      costs:
        - >-
          The first morning after the users group loses CAN USE, people who used to mint a token
          for a notebook or a BI tool will raise tickets.
        - >-
          A named exception group accumulates members unless someone owns it, and six months
          later it is the users group under another name.
      retain: >-
        The get-permissions output, dated, showing the users group without CAN USE and naming
        every group that still has it.
      revisit: >-
        A partner integration that cannot use OAuth, a new workspace (the users group typically
        starts with CAN USE), or the exception group growing. Failing those, quarterly with the
        token inventory.

  # Service principal client secrets not stale
  # Q: Have all account service principal client secrets been created or rotated recently?
  SCP-01-07:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      Account service-principal OAuth client secrets are created or rotated inside the policy
      window, and previous secrets are deleted once callers have moved.
    matters: >-
      A secret that has not been rotated is a credential whose copies have had time to spread —
      CI variables, laptops, a job definition somebody exported. Revoking it means finding every
      copy, and the copies do not announce themselves.
    good:
      - Every ACTIVE account-level client secret is newer than the policy window — 365 days unless you set a shorter one.
      - A principal has at most one secret in use, plus one being cut over.
      - Callers read the secret from a store that can rotate, not from a notebook or a committed profile.
      - Federation is used where the caller can present an identity-provider token instead of a secret.
    examples:
      strong: >-
        Each automation principal has one ACTIVE secret, all created in the last year. Rotation
        is a scheduled job that writes the new secret to the store, waits for the jobs to pick
        it up, then deletes the previous one.
      partial: >-
        Secrets in use were created this year, but last year's secrets are still ACTIVE because
        nobody deleted them after the cutover, so a leaked copy of the old value still works.
      weak: >-
        Account principals have secrets created when the platform was stood up, some of them
        years ago, and nobody can say which jobs still present them.
    verify:
      - how: cli
        where: |-
          databricks account service-principals list
          databricks account service-principal-secrets list <service-principal-id>
        expect: >-
          For each principal, every ACTIVE secret's create (or rotate) time is inside the last
          365 days — or the shorter window you have set.
        caveat: >-
          The listing is metadata only; it does not show the secret value. Pass is zero stale
          ACTIVE secrets across the account, not that a sampled principal looked recent. This
          collector is not scored yet, so the dates are evidence a person records.
      - how: ui
        where: Account console > User management > Service principals > a principal > Credentials & secrets
        expect: Creation dates inside the policy window, and no leftover ACTIVE secret from a previous rotation
      - how: by-hand
        where: The secret store and CI variables that still hold a client secret for each principal
        expect: One current value per principal, matching the secret that is ACTIVE and recent
    pitfalls:
      - >-
        Rotating by creating a second secret and leaving the first ACTIVE, which is a cutover
        that never finished. Both values work until the old one is deleted.
      - >-
        Checking workspace-level secrets-proxy listings and missing account-level secrets. This
        control is the account list; a clean workspace view is a different inventory.
      - >-
        Treating federation as a reason not to look. Principals that still hold a client secret
        are in scope even when other principals have moved to federation.
    partial_when: >-
      Secrets in use were created inside the window, but previous ACTIVE secrets from earlier
      rotations were never deleted.
    not_applicable_when: >-
      This workspace is Azure — the control is scoped to AWS and GCP — or no account service
      principal holds a client secret because every caller uses federation.
    references:
      - https://docs.databricks.com/aws/en/admin/users-groups/service-principals
      - https://docs.databricks.com/aws/en/dev-tools/auth/oauth-m2m
    advice:
      start_from: >-
        Rotate every account service-principal OAuth client secret at least every 365 days,
        delete the previous secret after callers have moved, and prefer federation anywhere the
        caller can present an identity-provider token instead.
      depends_on:
        - >-
          A caller that cannot be updated inside 365 days wants a documented exception and a
          second secret for cutover, not a skipped rotation — the old value still works until
          you delete it.
        - >-
          Principals used only to assume a federated identity should have their client secrets
          removed rather than rotated, which takes them out of this inventory.
      path:
        - >-
          List account principals and each principal's secrets. ACTIVE secrets older than 365
          days are the first rotation queue; leftover ACTIVE secrets beside a newer one are the
          first deletions.
        - >-
          Create the new secret, write it to the store the jobs actually read, confirm a run
          has picked it up, then delete the previous one.
        - >-
          Where the caller can federate, remove the secret after the federated path is proven,
          rather than keeping a unused value "in case".
      costs:
        - >-
          A rotation that deletes the old secret before every copy is updated fails every job
          that still holds it, which is why the store inventory is a step and not an afterthought.
        - >-
          Five secrets is the cap per principal. A cutover that never deletes will hit it, and
          the next rotation fails for want of a slot.
      retain: >-
        The per-principal secrets listing with create times, dated, and the ticket that records
        which old secrets were deleted after a successful run on the new value.
      revisit: >-
        A new account principal, a leaked secret, or a job that still holds a value you thought
        was deleted. Failing those, annually — just inside the 365-day window, not after it.

  # Secrets management
  # rest-api inventory: the collector lists scopes (name, backend_type), not secret counts.
  # Criteria names a secrets-count baseline the listing does not return.
  # Q: Are credentials held in secret scopes rather than written into notebooks and job definitions?
  SCP-02-01:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin, with the platform team
    means: >-
      Credentials that jobs and notebooks need live in a secret scope and are read at runtime.
      The listing this control can see is the scopes themselves — each name and backend_type —
      not how many secrets sit inside them.
    matters: >-
      A password in a notebook or a job definition is copied every time the file is exported,
      cloned, or left in Git history. Rotating it means finding every copy, and the copies do
      not announce themselves.
    good:
      - At least one secret scope exists, so there is a place other than a notebook to put a credential.
      - backend_type is one you chose — DATABRICKS, or a cloud vault — not a leftover from a tutorial.
      - Jobs and notebooks call dbutils.secrets.get (or the SDK equivalent) rather than embedding a value.
      - Scope ACLs grant the groups that run the jobs, not every workspace user.
    examples:
      strong: >-
        Two scopes exist, one Databricks-backed for workspace automation and one vault-backed for
        the warehouse password. Job tasks read both through dbutils.secrets.get, and a repo search
        for the old connection string returns nothing.
      partial: >-
        Scopes exist and new jobs read them, but two ingestion notebooks still have a token in a
        cell that was pasted during a demo and never moved.
      weak: >-
        The workspace has no secret scopes. Connection strings sit in notebooks and in the
        environment variables of a cluster policy.
    verify:
      - how: cli
        where: databricks secrets list-scopes
        expect: >-
          One or more scopes, each with a name and a backend_type you recognise
        caveat: >-
          This is the collector: names and backend types only. It does not return a secret
          count, and no baseline for one is configured, so a count-versus-baseline reading
          cannot be taken from this listing.
      - how: cli
        where: databricks secrets list-secrets <scope-name>
        expect: Keys whose names you can account for, without printing values
        caveat: >-
          Listing keys in a scope is a second call the collector does not make. A scope that
          exists and is empty is not evidence that credentials have moved.
      - how: by-hand
        where: >-
          Search the production repository and job definitions for passwords, tokens, and
          access-key strings
        expect: No live credentials outside a secret store or a vault your scopes back
    pitfalls:
      - >-
        Creating a scope and leaving the credentials in the notebooks, which produces a listing
        this control can pass and none of the effect.
      - >-
        Granting the users group READ on the scope, so anyone who can attach a cluster can
        read every secret in it.
      - >-
        Treating an empty scope list as proof that nothing needs a credential. The worse
        estate also has no scopes, because the values live in cells.
    partial_when: >-
      Scopes exist and new work reads them, but a residue of notebooks or job definitions still
      carry a credential in plain text.
    references:
      - https://docs.databricks.com/aws/en/security/secrets/
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/secrets-commands
    advice:
      start_from: >-
        Create one Databricks-backed scope for workspace automation, put every new credential
        there, and stop adding values to notebooks or job JSON. Do not wait for a secrets-count
        baseline — the listing cannot score one.
      depends_on:
        - >-
          A password that already lives in a cloud vault should back the scope with that vault
          rather than being copied into a Databricks-backed one.
        - >-
          A workspace with no external systems and no stored credentials has nothing to put in
          a scope; confirm that by the repo search, not by the empty listing alone.
      path:
        - >-
          List the scopes. If there are none, create one and move the first credential a job
          actually presents.
        - >-
          Search notebooks and job definitions for leftover values, then change those callers
          to dbutils.secrets.get before deleting the pasted string.
        - >-
          Tighten the scope ACL to the groups that run the jobs, and record backend_type so
          the next review knows which vault is in play.
      costs:
        - >-
          The first job that still had the value in its definition fails the morning you
          delete it, which is why the search is a step and not a cleanup.
        - >-
          A vault-backed scope needs a cloud identity the workspace can assume, which is a
          ticket to the identity team on most estates.
      retain: >-
        The list-scopes output with backend_type, dated, and the ticket that names which
        notebook or job was rewritten to read from the scope.
      revisit: >-
        A new external system, a scope whose ACL grows to the users group, or a credential
        found in a pull request. Failing those, quarterly with the job inventory.

  # Cluster instance disk encryption
  # rest-api boolean: enable_local_disk_encryption on clusters.list. Off unless set.
  # Criteria fails any cluster where the flag is false; the question narrows that to sensitive data.
  # Q: Is local disk encryption enabled on the clusters that handle sensitive data?
  SCP-02-02:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Classic cluster specifications set enable_local_disk_encryption. The flag is off unless
      someone sets it, and it applies to the local disks those clusters attach — shuffle, spill
      and scratch — not to the table in object storage.
    matters: >-
      Shuffle and spill write the same rows the query read. On an unencrypted local disk those
      files sit in the clear on the instance for as long as the node lives, including after a
      process crash leaves them behind.
    good:
      - enable_local_disk_encryption is true on every classic cluster that handles data you would encrypt at rest.
      - Cluster policies that mint those clusters set the flag, so a UI-created cluster cannot omit it.
      - Job clusters inherit the same policy; all-purpose is not the only population.
      - Serverless compute is treated separately — it has no local-disk flag to set.
    examples:
      strong: >-
        The production policy sets enable_local_disk_encryption. Every classic cluster the
        listing returns has the flag true, including job clusters, and a create without the
        policy is refused.
      partial: >-
        All-purpose clusters used by analysts have the flag on. The nightly job clusters were
        defined before the policy and still show enable_local_disk_encryption false.
      weak: >-
        No cluster in the listing has the flag set. Nobody can say whether shuffle files from
        last week's payroll job are still on a disk.
    verify:
      - how: cli
        where: databricks clusters list --output json
        expect: >-
          enable_local_disk_encryption is true on each classic cluster you would encrypt at rest
        caveat: >-
          The collector is this listing. A missing flag is off, not unknown. GCP is outside
          this control's clouds. Serverless clusters do not carry the field.
      - how: ui
        where: Compute > a classic cluster > Advanced, local disk encryption, and the policies that create those clusters
        expect: The flag on, and the policy requiring it rather than merely documenting it
      - how: api
        where: GET /api/2.0/clusters/list
        expect: No classic cluster you care about with enable_local_disk_encryption false or absent
        caveat: >-
          No resolver reads this yet. The criterion as written fails any cluster whose flag is
          false; the question asks only about clusters that handle sensitive data.
    pitfalls:
      - >-
        Setting the flag on all-purpose clusters and leaving job clusters on the old
        specification, which is where the long-running shuffle actually lands.
      - >-
        Reading workspace-storage customer-managed keys as coverage for local disks. That key
        can encrypt EBS on AWS when configured; this flag is the cluster field.
      - >-
        Turning the flag on and expecting running clusters to pick it up. It applies at start.
    partial_when: >-
      The clusters that analysts use have enable_local_disk_encryption true, and job or
      legacy clusters that still run production work have it false or unset.
    not_applicable_when: >-
      This workspace is GCP, which the control does not cover, or it runs no classic clusters
      — serverless compute has no enable_local_disk_encryption field.
    references:
      - https://docs.databricks.com/aws/en/compute/configure#local-disk-encryption
      - https://docs.databricks.com/aws/en/admin/clusters/policies
    advice:
      start_from: >-
        Require enable_local_disk_encryption in the policy that mints production classic
        clusters, then edit or replace every existing cluster whose listing still shows the
        flag false or absent.
      depends_on:
        - >-
          A workspace that is already serverless for the sensitive workloads has no local-disk
          flag to set; do not fail it for lacking one.
        - >-
          A short-lived job cluster that never spills can stay off only as a named exception,
          not as the default for the policy.
      path:
        - >-
          List classic clusters and note each row where enable_local_disk_encryption is false
          or missing. That is the queue.
        - >-
          Add the flag to the policy those clusters should use, then restart or recreate so
          the new specification is the one that is running.
        - >-
          Sweep job-cluster definitions in the same pass — they are the ones the UI listing
          is easy to skip.
      costs:
        - >-
          Local disk encryption adds CPU on shuffle-heavy jobs. Measure one production job
          before rolling the policy to every cluster.
        - >-
          Recreating a long-lived all-purpose cluster is an interruption for everyone attached
          to it.
      retain: >-
        A dated clusters-list extract showing enable_local_disk_encryption on each classic
        cluster, and the policy JSON that requires the flag.
      revisit: >-
        A new classic cluster created outside the policy, a job definition copied from before
        the flag existed, or a move back from serverless. Failing those, quarterly.

  # Customer-managed keys for managed services and workspace storage
  # rest-api: two account-workspace fields, both required by the criterion. AWS only.
  # Q: Are customer-managed keys configured for both managed services and workspace storage?
  SCP-02-03:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      The workspace record carries both storage_customer_managed_key_id and
      managed_services_customer_managed_key_id. One field is not the other: managed services
      covers control-plane data, workspace storage covers the workspace bucket and, when
      configured, classic-compute EBS.
    matters: >-
      Without your key on those fields, Databricks' own key encrypts that data. A revocation
      or a rotation you do not control is not a control you can exercise, and an investigation
      that needs to prove who could decrypt the bucket has only the platform's answer.
    good:
      - storage_customer_managed_key_id is set on the workspace record.
      - managed_services_customer_managed_key_id is set on the same record.
      - The two key ids are ones your KMS inventory still has, with a rotation owner.
      - New workspaces in the same account inherit both fields from the creation template.
    examples:
      strong: >-
        Every AWS workspace in the account list shows both key ids. The keys live in a
        customer-managed KMS account, rotation is scheduled, and the last new workspace
        inherited both from the template.
      partial: >-
        managed_services_customer_managed_key_id is set. storage_customer_managed_key_id is
        empty on two older workspaces that were created before the storage key was added.
      weak: >-
        Neither field is set. Encryption is whatever the platform defaulted to at creation.
    verify:
      - how: cli
        where: databricks account workspaces get <workspace-id>
        expect: >-
          Both storage_customer_managed_key_id and managed_services_customer_managed_key_id are present
        caveat: >-
          The collector is the account workspace list. This app does not resolve the control
          yet. Empty is unset, not a hidden default. Azure and GCP are outside the clouds list.
      - how: ui
        where: Account console > Workspaces > the workspace > encryption / customer-managed keys
        expect: A key recorded for managed services and a key recorded for workspace storage
      - how: by-hand
        where: Your KMS inventory, the two key ids from the workspace record
        expect: Both keys exist, are enabled, and have a named rotation owner
    pitfalls:
      - >-
        Setting only one of the two fields and treating the workspace as done. The criterion
        reads both.
      - >-
        Applying the storage key and expecting DBFS mounts to use it. Mounts are outside this
        field; Unity Catalog storage credentials carry their own encryption.
      - >-
        Forgetting that a serverless workspace uses the managed-services key for workspace
        storage as well — the criterion still names both ids, and an absent storage id is
        what the record shows.
    partial_when: >-
      One of the two key ids is set and the other is empty, or both are set on new workspaces
      and older ones still show neither.
    not_applicable_when: >-
      This workspace is not on AWS. The control's clouds list is AWS only, and the two field
      names are the AWS workspace record's.
    references:
      - https://docs.databricks.com/aws/en/security/keys/customer-managed-keys
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/account-workspaces-commands
    advice:
      start_from: >-
        Create two customer-managed keys in your KMS account — one for managed services, one
        for workspace storage — and attach both ids when the next AWS workspace is created.
        Adding them later is a workspace operation, not a toggle.
      depends_on:
        - >-
          A serverless AWS workspace uses the managed-services key for workspace storage too;
          still record what the workspace object actually carries rather than inferring the
          storage id.
        - >-
          An estate below Enterprise cannot set these fields; the page names the tier, and
          the answer is the tier, not a missing key.
      path:
        - >-
          Read the workspace record. Note which of the two ids is present. That is the gap,
          not a mood about encryption.
        - >-
          Create the missing key, grant Databricks the use of it, and attach it through the
          account console or the creation template.
        - >-
          Confirm the get output shows both ids, then write the key ARNs and owners into the
          runbook the next workspace will copy.
      costs:
        - >-
          Key creation and the cross-account grant are a day with cloud security, and a
          mis-granted key fails workspace creation rather than degrading quietly.
        - >-
          Revoking the key later makes the workspace unable to read what it encrypted, which
          is the point of customer-managed keys and also an outage if done by accident.
      retain: >-
        The account workspaces get output showing both key ids, dated, and the KMS aliases
        those ids resolve to.
      revisit: >-
        A new AWS workspace, a key retirement, or a move to serverless (the storage field's
        meaning changes). Failing those, annually with the account encryption review.

  # Downloading results is disabled
  # rest-api boolean: enableResultsDownloading. Secure value false. Unset is available.
  # Partner of SCP-02-11 (SQL Editor / dashboard download) and SCP-02-06 (clipboard).
  # Q: Is downloading query and notebook results disabled for this workspace?
  SCP-02-04:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      A notebook result can be saved as a file from the Download control.
      enableResultsDownloading records whether that control is offered. false is the stored
      value this finding looks for; a missing key is treated as available.
    matters: >-
      A notebook result that can be downloaded is a file on a laptop. The grant that
      allowed the query does not follow the file, and the audit log records the query,
      not what happened to the spreadsheet.
    good:
      - enableResultsDownloading is the string false, not missing.
      - Analysts who still need a result use a dashboard or a Delta share, not the download button.
      - The SQL results-download setting is decided separately — this key does not set it.
    examples:
      strong: >-
        enableResultsDownloading is false. The teams that used to export a CSV now have a
        shared dashboard, and get-status no longer returns true.
      partial: >-
        enableResultsDownloading is false, but sql-results-download is still enabled, so the
        same result leaves through the SQL Editor.
      weak: >-
        The key has never been set. Download is available, which is the product default.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableResultsDownloading
        expect: '"enableResultsDownloading": "false"'
        caveat: >-
          A missing key is scored as available, not as unknown. This is not the SQL
          results-download setting (SCP-02-11) and not the clipboard (SCP-02-06).
      - how: ui
        where: Settings > Security > Notebook results download
        expect: The toggle off
    pitfalls:
      - >-
        Switching this off and leaving SQL results download on, then reading the notebook
        toggle as coverage for the SQL Editor.
      - >-
        Leaving the key unset and assuming a hardened workspace defaulted it to false. The
        documented default is available.
      - >-
        Turning the button off and offering no dashboard or share, so the next honest
        request is to turn it back on for everyone.
    partial_when: >-
      enableResultsDownloading is false and the SQL Editor download control is still on, or
      the key is false and a named team still has an approved exception that has not been
      written down.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableResultsDownloading to false. Give the teams that exported a morning CSV a
        dashboard or a Delta share before you flip it, or the first ticket will be to flip
        it back.
      depends_on:
        - >-
          A regulated extract that must leave as a file wants a named job writing to a
          governed volume, not this toggle left on for the whole workspace.
        - >-
          SQL Editor and AI/BI downloads are a different key; decide that one on SCP-02-11
          rather than inferring it from this reading.
      path:
        - >-
          Read enableResultsDownloading. Missing or true is the first change; tell the
          analysts the same day.
        - >-
          Stand up the replacement path for the known exports, then set the key to false.
        - >-
          Read the SQL results-download setting next. It will not have moved.
      costs:
        - >-
          The people who built a day on a downloaded spreadsheet will lose that button, and
          a replacement dashboard is a week's work if nobody owns it.
        - >-
          An exception for one group is not expressible on this key — it is workspace-wide —
          so the alternative is a different delivery path, not a narrower toggle.
      retain: >-
        The get-status line for enableResultsDownloading, dated, showing false.
      revisit: >-
        A new workspace (the key starts unset), a request to re-enable download, or the SQL
        Editor toggle being changed. Failing those, quarterly.

  # Notebook export
  # rest-api boolean: enableExportNotebook. Secure value false. Unset is available.
  # Partner of SCP-02-04 (results download) and SCP-02-06 (table clipboard).
  # Q: Is notebook export disabled, so notebooks and their outputs cannot be taken off the platform?
  SCP-02-05:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      File > Export writes the notebook itself — cells and whatever output they still hold —
      onto a laptop. enableExportNotebook is the stored flag for that menu. The Git remote
      that replaces a local copy is a different requirement.
    matters: >-
      An exported notebook is the source plus whatever output the cells still hold. Once it
      is a file, workspace ACLs no longer apply to it, and a review of who can open the
      original folder does not include who has the ipynb.
    good:
      - enableExportNotebook is the string false, not missing.
      - Production notebooks that must leave the workspace go through Git, which is a different control.
      - Results download and clipboard are set deliberately, not assumed to follow this key.
    examples:
      strong: >-
        enableExportNotebook is false. Notebooks that need a copy outside the workspace are
        in a Git folder, and export from the UI is refused.
      partial: >-
        enableExportNotebook is false, but enableResultsDownloading is still true, so a
        reader who cannot export the notebook can still take the result set.
      weak: >-
        The key has never been set. Export is available, which is the product default.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableExportNotebook
        expect: '"enableExportNotebook": "false"'
        caveat: >-
          A missing key is scored as available. This is not enableResultsDownloading and not
          enableNotebookTableClipboard — each is its own flag.
      - how: ui
        where: Settings > Security > Notebook exporting
        expect: The toggle off
    pitfalls:
      - >-
        Disabling export and leaving results download on, then describing the workspace as
        unable to take a notebook off the platform.
      - >-
        Using this key to stand in for source control. Git folders are SCP-05-07; this flag
        does not create a repository.
      - >-
        Disabling export in one workspace and leaving the clone in another, so the file
        leaves through the workspace that was not reviewed.
    partial_when: >-
      enableExportNotebook is false and results download or the table clipboard is still on,
      so a notebook cannot be exported as a file and its output still can.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableExportNotebook to false once production notebooks that must exist outside
        the workspace are in a Git folder. The flag does not invent that folder.
      depends_on:
        - >-
          A teaching workspace that exists so people can take a notebook home keeps export
          on and is named as that exception, rather than leaving every workspace at the
          default.
        - >-
          Partner tools that import and export notebooks need the flag on in the workspace
          they use, not a global exception.
      path:
        - >-
          Read enableExportNotebook. Missing or true is the finding.
        - >-
          Confirm the notebooks that actually have to leave already have a Git remote, then
          set the key to false.
        - >-
          Read enableResultsDownloading and enableNotebookTableClipboard in the same sitting
          — they will not have changed.
      costs:
        - >-
          The first person who used Export as their backup will lose it, which is why Git
          folders come first.
        - >-
          The flag is workspace-wide. A single team that still needs export is a reason to
          give them a workspace, not to leave the key true for everyone.
      retain: >-
        The get-status line for enableExportNotebook, dated, showing false.
      revisit: >-
        A new workspace, a partner integration that exports notebooks, or a request to turn
        export back on. Failing those, quarterly with the other notebook-exfil flags.

  # Notebook table clipboard features
  # rest-api boolean: enableNotebookTableClipboard. Secure value false. Unset is available.
  # Partner of SCP-02-04 (file download) and SCP-02-05 (notebook export).
  # Q: Is copying table results to the clipboard from notebooks disabled?
  SCP-02-06:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Rows shown in a results grid can be placed on the system clipboard.
      enableNotebookTableClipboard is that grid's copy control, and only that grid's. A cell
      of printed text and a saved notebook file are outside it.
    matters: >-
      A copied table is whatever fitted in the results view, now on a clipboard that no
      workspace ACL can recall. The audit log records the query that produced the table, not
      the paste.
    good:
      - enableNotebookTableClipboard is the string false, not missing.
      - People who still need a slice of a result use a governed extract, not the results-table copy control.
      - Download and export are set on their own keys, not inferred from this one.
    examples:
      strong: >-
        enableNotebookTableClipboard is false. The results table does not offer copy, and the
        extracts that used to start there now land in a volume.
      partial: >-
        enableNotebookTableClipboard is false, but enableResultsDownloading is still true, so
        the same table leaves as a file instead of a paste.
      weak: >-
        The key has never been set. Clipboard copy of tabular results is available, which is
        the product default.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableNotebookTableClipboard
        expect: '"enableNotebookTableClipboard": "false"'
        caveat: >-
          A missing key is scored as available. This is not enableResultsDownloading and not
          enableExportNotebook.
      - how: ui
        where: Settings > Security > Results table clipboard features
        expect: The toggle off
    pitfalls:
      - >-
        Switching the clipboard off and leaving download on, then describing copy-out as
        closed.
      - >-
        Assuming a cell's own copy of printed text is covered. This flag is the results
        table, not every copy in the UI.
      - >-
        Setting the key in one workspace and reviewing a different one, where the default
        is still available.
    partial_when: >-
      enableNotebookTableClipboard is false and enableResultsDownloading is still true, so
      the table cannot be copied and can still be downloaded.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableNotebookTableClipboard to false together with the notebook download key,
        so turning one off does not just move the same table to the other control.
      depends_on:
        - >-
          A support workflow that pastes a few rows into a ticket wants a named extract job,
          not this key left true for the workspace.
        - >-
          SQL Editor copy-out is not this flag; do not treat a notebook clipboard reading as
          a reading of the SQL Editor.
      path:
        - >-
          Read enableNotebookTableClipboard. Missing or true is the first change.
        - >-
          Set it to false on the same change as enableResultsDownloading if that one is
          still available, so the two do not trade load.
        - >-
          Tell the analysts the results table will stop offering copy, and point them at
          the extract that replaces it.
      costs:
        - >-
          Pasting a few rows into Slack is a habit, and the first week after the flag moves
          is a queue of "the copy button is gone" tickets.
        - >-
          The key is workspace-wide. There is no per-group clipboard.
      retain: >-
        The get-status line for enableNotebookTableClipboard, dated, showing false.
      revisit: >-
        A new workspace, a request to restore copy, or the download key being flipped the
        other way. Failing those, quarterly with SCP-02-04 and SCP-02-05.

  # Enable storing interactive notebook results only in the customer account
  # rest-api boolean: storeInteractiveNotebookResultsInCustomerAccount. Secure value true.
  # Unset is unmeasured — default depends on workspace age and CMK.
  # Q: Are interactive notebook results stored only in your own cloud account, rather than in the control plane?
  SCP-02-07:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The workspace-conf key storeInteractiveNotebookResultsInCustomerAccount is true. That
      key is where new interactive notebook results are stored. It does not move results
      already written, and it does not apply to job runs.
    matters: >-
      Interactive results that stay in the control plane sit outside the bucket your
      workspace-storage key encrypts. A later CMK or a residency review that looks only at
      the bucket will not see those files.
    good:
      - storeInteractiveNotebookResultsInCustomerAccount is the string true, not missing.
      - Somebody has said what happens to results written before the key was set — they stay where they were.
      - Job results are not counted as covered by this key; they already land in workspace storage.
    examples:
      strong: >-
        The key is true. New interactive runs write to the workspace bucket, and the runbook
        says older control-plane results remain until those notebooks are cleared or rerun.
      partial: >-
        The key is true on the current workspace, and three older workspaces have never set
        it, so the finding there is unmeasured rather than a stored-in-account reading.
      weak: >-
        The key is explicitly false. New interactive results are being stored in the
        control plane by a decision someone already made.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys storeInteractiveNotebookResultsInCustomerAccount
        expect: '"storeInteractiveNotebookResultsInCustomerAccount": "true"'
        caveat: >-
          A missing key is unmeasured, not a fail: the default depends on how the workspace
          was created and whether customer-managed keys are in use. An explicit false is a
          deliberate setting.
      - how: ui
        where: Settings > Security > Store interactive notebook results in customer account
        expect: The setting on
        caveat: >-
          Results already stored in the Databricks-managed location stay there. This changes
          where new interactive results go.
    pitfalls:
      - >-
        Reading a missing key as "already in the customer account" because the workspace is
        new. Absence is the case the resolver will not guess.
      - >-
        Clearing the key after turning it on and expecting old control-plane results to
        migrate. They do not.
      - >-
        Treating this as coverage for job results or SQL warehouse results. Those paths are
        not this key.
    partial_when: >-
      The key is true and notebooks that still display output from before the change keep
      that output in the previous location, or the key is true here and unset on sibling
      workspaces.
    references:
      - https://docs.databricks.com/aws/en/notebooks/notebook-outputs#manage-where-notebook-results-are-stored
      - https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks
    advice:
      start_from: >-
        Set storeInteractiveNotebookResultsInCustomerAccount to true. Leave existing
        notebook output in place until those notebooks are rerun or their results are
        cleared — the key will not move them.
      depends_on:
        - >-
          A workspace that already uses customer-managed keys may have been created with
          this default; read the key anyway, because absence is not a reading of that
          default.
        - >-
          Job-only estates still want the key true so the first interactive run does not
          land in the control plane.
      path:
        - >-
          Read the key. Missing is a person-answered question until you set it; false is
          the first flip; true is the target.
        - >-
          Set it to true, then tell notebook users that new runs write to the workspace
          bucket and old output does not move.
        - >-
          If residency is the reason, pair this with the two CMK fields on SCP-02-03 —
          this key chooses a location, not a key.
      costs:
        - >-
          Large interactive results in your bucket cost storage you already pay for, and
          a first-run surprise on a busy workspace is a support ticket about "missing"
          output that is in a different place.
        - >-
          Clearing old output so it is no longer in the control plane is a notebook-by-
          notebook edit, not a setting.
      retain: >-
        The get-status line for storeInteractiveNotebookResultsInCustomerAccount, dated,
        showing true.
      revisit: >-
        A workspace clone, a CMK change, or a notebook whose old output is now the
        artefact an audit asked for. Failing those, when you next review result-exfil flags.

  # FileStore endpoint for HTTPS file serving
  # rest-api boolean: enableFileStoreEndpoint. Secure value false. Unset is unmeasured.
  # Partner of SCP-02-12 (DBFS browser UI), not the same surface.
  # Q: Is the FileStore endpoint — which serves files over HTTPS to anyone with the link — disabled?
  SCP-02-08:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      FileStore publishes objects at an unauthenticated HTTPS URL under /files.
      enableFileStoreEndpoint is whether that publisher is running. The feature is in the
      legacy archive; volumes replace it.
    matters: >-
      A FileStore URL is an HTTPS path to a file. Anyone who has the link can fetch it
      without a workspace login, which is the reason the feature is now in the legacy
      archive.
    good:
      - enableFileStoreEndpoint is the string false, not missing.
      - Files that used to live under FileStore now live in a Unity Catalog volume or as workspace files.
      - Notebooks that embedded /files URLs have been rewritten, because those requests fail when the endpoint is off.
    examples:
      strong: >-
        enableFileStoreEndpoint is false. The old /files embeds were replaced with volume
        paths, and get-status no longer returns true.
      partial: >-
        The key is false, and two HTML notebooks still point at /files images that now
        500, so someone will ask to turn it back on unless those embeds are rewritten.
      weak: >-
        The key is explicitly true. The FileStore endpoint is being served by a decision
        someone already made.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableFileStoreEndpoint
        expect: '"enableFileStoreEndpoint": "false"'
        caveat: >-
          A missing key is unmeasured: whether FileStore is served by default varies with
          workspace age, and the key is also absent on workspaces that never had the
          endpoint. An explicit true is a deliberate setting.
      - how: ui
        where: Settings > Security, the FileStore / DBFS file serving control
        expect: The endpoint not served
      - how: by-hand
        where: Search production notebooks for /files and dbfs:/FileStore
        expect: No live embeds that would 500 once the endpoint is off
    pitfalls:
      - >-
        Reading a missing key as "already off". Absence is the case the resolver will not
        guess, and on an old workspace the endpoint may still be served.
      - >-
        Switching this off and leaving the DBFS browser on, then describing FileStore as
        closed. The browser is SCP-02-12.
      - >-
        Leaving /files embeds in place, so the first broken image becomes the reason the
        key is set true again.
    partial_when: >-
      enableFileStoreEndpoint is false and notebooks still embed /files URLs, or the key
      is false here and missing (unmeasured) on an older sibling workspace.
    references:
      - https://docs.databricks.com/aws/en/archive/legacy/filestore
      - https://docs.databricks.com/aws/en/volumes/
    advice:
      start_from: >-
        Set enableFileStoreEndpoint to false after the /files and FileStore paths in
        production notebooks have a volume or workspace-file replacement. The feature is
        archived; do not plan new work against it.
      depends_on:
        - >-
          A workspace that never offered FileStore will show a missing key; set it to
          false anyway so a later platform change cannot serve it.
        - >-
          Static images that have no other host need a volume path, not this endpoint
          left on.
      path:
        - >-
          Read the key. Missing is unmeasured until you set it; true is the first flip;
          false is the target.
        - >-
          Search for /files and dbfs:/FileStore, move those objects to a volume, then set
          the key to false.
        - >-
          Read enableDbfsFileBrowser and disable-legacy-dbfs next. Neither is this
          endpoint.
      costs:
        - >-
          Every leftover /files embed becomes a 500, which is how this change gets
          reverted if the search was skipped.
        - >-
          FileStore contents are not deleted by the flag; they remain on DBFS until you
          move or remove them.
      retain: >-
        The get-status line for enableFileStoreEndpoint, dated, showing false.
      revisit: >-
        A notebook import that still uses /files, a workspace created from an old
        template, or a request to serve a static file over HTTPS. Failing those, when you
        next review DBFS-legacy flags.

  # Store and retrieve embeddings securely
  # rest-api presence check: any Vector Search endpoint is a pass; none is not-applicable.
  # Not a claim that every embedding in the estate is governed.
  # Never put to a person. Guidance here explains a finding rather than enabling an answer.
  SCP-02-09:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the data owners
    means: >-
      Embeddings that this workspace serves sit on a Databricks Vector Search endpoint,
      whose indexes are Unity Catalog objects. The finding is whether at least one such
      endpoint exists — not whether every embedding in the estate is in one.
    matters: >-
      An embedding is a derivative of the text it was built from. A self-managed index on
      a cluster, or a copy in an external vector database, holds that derivative under
      none of the grants that covered the source.
    good:
      - At least one Vector Search endpoint is configured if the workspace does vector search on Databricks.
      - Indexes on that endpoint are UC objects, inheriting the grants of the table they sync from.
      - A self-managed or external index, if one exists, is named and has a migration date.
      - An estate with no vector search at all is not-applicable, not a pass on governance.
    examples:
      strong: >-
        One ONLINE endpoint serves the product-search index. The index is DELTA_SYNC from
        a governed table, and a repo search finds no faiss or pinecone client in production
        jobs.
      partial: >-
        A Databricks endpoint exists and is what new work uses, but one ranking job still
        builds a local index on a cluster from a CSV that left the catalogue last year.
      weak: >-
        Embeddings live in an external vector database whose API key is in a notebook.
        The endpoint list is empty, so the scan will not fail this — it will say the
        requirement needs an answer.
    verify:
      - how: cli
        where: databricks vector-search-endpoints list
        expect: >-
          One or more endpoints if this workspace does vector search on Databricks; none
          if it does not
        caveat: >-
          Presence is a pass. An empty list is not-applicable, and it does not rule out
          embeddings held on a cluster or in an external store — that case needs a person.
      - how: ui
        where: Compute > Vector Search, each endpoint and the indexes attached to it
        expect: Indexes that are Unity Catalog objects, not an undocumented sidecar
      - how: by-hand
        where: Search production code for external vector-database clients and local ANN indexes
        expect: No production path that embeds governed text outside Databricks Vector Search
    pitfalls:
      - >-
        Reading a pass as "every embedding is governed". The resolver says it is not that
        claim; an index built elsewhere does not appear here.
      - >-
        Reading an empty list as a clean estate. That is the case that hides the external
        store this requirement is really about.
      - >-
        Creating an endpoint to satisfy the listing and leaving the production index where
        it was.
    partial_when: >-
      A Databricks Vector Search endpoint exists and a production path still writes
      embeddings to a cluster-local or external index.
    not_applicable_when: >-
      This workspace is GCP, which the control does not cover, or it has no Vector Search
      endpoints and nobody is storing embeddings anywhere else.
    references:
      - https://docs.databricks.com/aws/en/ai-search/ai-search
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/vector-search-endpoints-commands
    advice:
      start_from: >-
        Put new embedding indexes on Databricks Vector Search as Unity Catalog objects
        synced from the governed table, and do not stand up an external vector database
        for text that already has a grant in the metastore.
      depends_on:
        - >-
          An existing external index with a vendor contract stays until that contract ends;
          name it and date the move, rather than adding a Databricks endpoint beside it
          and calling the finding done.
        - >-
          A workspace that does no retrieval at all should not create an endpoint to
          collect a pass — empty is not-applicable.
      path:
        - >-
          List endpoints. If production retrieval already uses one, the scan's work is
          done and the leftover work is the repo search.
        - >-
          If retrieval runs elsewhere, create the endpoint and a DELTA_SYNC index on the
          source table, then point the caller at it.
        - >-
          Remove the cluster-local or external index after the new path has served a
          real query, not before.
      costs:
        - >-
          Vector Search is a billed endpoint. An unused one created to satisfy a listing
          is a standing charge and a pass that means nothing.
        - >-
          Rebuilding an index from a large table is a backfill, and the old store has to
          keep serving until that backfill is queried.
      retain: >-
        The endpoint list with names and states, dated, and the index's full three-level
        name so the next review can see the grants.
      revisit: >-
        A new retrieval feature, an external vector-database contract renewal, or an
        endpoint that has gone OFFLINE. Failing those, when the source table's grants
        change.

  # Disable legacy DBFS root and mounts
  # rest-api boolean: Settings v2 disable_legacy_dbfs. Partner of SCP-04-06 (mounts still in use)
  # and SCP-02-12 (browser only). This field blocks root and mounts across interfaces.
  # Q: Are legacy DBFS root access and DBFS mounts disabled for this workspace?
  SCP-02-10:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The Settings v2 object disable_legacy_dbfs is on, so DBFS root and DBFS mounts are
      blocked across UI, API, CLI and FUSE. This is not a listing of remaining mounts —
      that is a different requirement — and it is not the file-browser toggle.
    matters: >-
      Root and mounts are shared storage with no catalogue grant. Until this setting is
      on, a notebook, a job or a FUSE mount can still read that storage after every table
      privilege has been revoked.
    good:
      - databricks settings disable-legacy-dbfs get shows the disablement on.
      - Workloads that used dbfs:/ and dbfs:/mnt have been moved to volumes, external locations, or workspace files.
      - Running classic clusters and SQL warehouses were restarted after the change, which is when the setting takes effect.
      - Runtime versions below 13.3 LTS are gone, because the setting disables them.
    examples:
      strong: >-
        disable-legacy-dbfs get shows the disablement on. Clusters were restarted after
        the twenty-minute wait, and a test read of dbfs:/mnt now errors with Public DBFS
        root is disabled.
      partial: >-
        The setting is on in the get output, but two long-running all-purpose clusters
        were never restarted, so they can still reach root and mounts.
      weak: >-
        The setting is off. Root and mounts remain reachable from every interface.
    verify:
      - how: cli
        where: databricks settings disable-legacy-dbfs get
        expect: The disablement on — disable_legacy_dbfs reporting that root and mounts cannot be used
        caveat: >-
          No resolver reads this yet. The get is the collector. Pre-existing data is not
          deleted. Clusters and warehouses keep their old access until they are restarted,
          after up to twenty minutes of propagation.
      - how: ui
        where: Settings > Security > Disable DBFS root and mounts
        expect: The control in the state that says root and mounts cannot be used
      - how: by-hand
        where: After a restart, a notebook attempting to list dbfs:/mnt and dbfs:/ (not dbfs:/Volumes)
        expect: A refusal, not a listing
    pitfalls:
      - >-
        Reading this as the same finding as remaining mounts. SCP-04-06 asks whether
        mounts are still in use; this asks whether the setting that blocks them is on.
      - >-
        Setting it and skipping the restart. The docs are explicit: running compute keeps
        access until it is restarted by hand.
      - >-
        Leaving jobs on a runtime below 13.3 LTS. The setting disables those runtimes, and
        that is a broken job rather than a warning.
    partial_when: >-
      The setting is on and at least one long-running cluster or warehouse has not been
      restarted since, so the get output and the running compute disagree.
    references:
      - https://docs.databricks.com/aws/en/dbfs/disable-dbfs-root-mounts
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/settings-commands
    advice:
      start_from: >-
        Migrate root and mount workloads to volumes, external locations or workspace
        files, upgrade compute to 13.3 LTS or later, then turn disable-legacy-dbfs on and
        restart every classic cluster and SQL warehouse after the wait.
      depends_on:
        - >-
          A workspace that still has an unmigrated mount keeps the setting off until that
          job is rewritten — flipping it first is an outage, not a tightening.
        - >-
          New workspaces can inherit this from the account-level disable-legacy-features
          setting; that inheritance does not change the get on an existing workspace.
      path:
        - >-
          Inventory dbfs:/ and dbfs:/mnt usage, including cluster logs and libraries that
          still point there.
        - >-
          Move those paths, upgrade runtimes, then set disable-legacy-dbfs on.
        - >-
          Wait for propagation, restart compute, and confirm a test read of dbfs:/mnt
          fails. The browser disappearing is not that confirmation.
      costs:
        - >-
          Every leftover dbfs:/mnt job fails together the morning the restarts finish,
          which is why the inventory is a gate and not a cleanup.
        - >-
          Runtimes below 13.3 LTS cannot be started once the setting is on, so an old
          job cluster is a rewrite, not a pin.
      retain: >-
        The disable-legacy-dbfs get output, dated, and the change ticket that lists which
        clusters and warehouses were restarted after the wait.
      revisit: >-
        A new mount request, a workspace import of an old job, or an all-purpose cluster
        that has been up since before the setting moved. Failing those, after the next
        runtime upgrade wave.

  # SQL warehouse results download disabled
  # rest-api boolean: Settings v2 sql_results_download. Default enabled (true).
  # Partner of SCP-02-04 (notebook Download button), not the same key.
  # Q: Is downloading results from SQL warehouse queries disabled?
  SCP-02-11:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      SQL Editor and AI/BI dashboards have their own download control, stored as
      sql_results_download. The object defaults to enabled. It does not move when the
      notebook Download key is changed.
    matters: >-
      A SQL Editor download is a file of whatever the warehouse just returned. The grant
      that allowed the query does not follow the file, and a workspace that closed the
      notebook button and left this one on has closed the less-used door.
    good:
      - databricks settings sql-results-download get shows the setting not enabled.
      - People who still need an extract get a dashboard subscription or a job writing to a volume, not the SQL Editor download.
      - enableResultsDownloading is decided on its own key, not inferred from this reading.
    examples:
      strong: >-
        sql-results-download get shows enabled false. The morning CSV is now a job into a
        volume, and the notebook download key was set false in the same change.
      partial: >-
        sql-results-download is off and enableResultsDownloading is still true, so the
        same rows leave from a notebook.
      weak: >-
        The setting is at its default, enabled. Download from the SQL Editor and from
        AI/BI dashboards is available.
    verify:
      - how: cli
        where: databricks settings sql-results-download get
        expect: The setting not enabled — sql_results_download / enabled false
        caveat: >-
          No resolver reads this yet. Default is enabled. This is not
          enableResultsDownloading (SCP-02-04). A workspace often has one off and the
          other on.
      - how: ui
        where: Settings > Security > SQL results download
        expect: The toggle off
    pitfalls:
      - >-
        Turning the notebook download key off and reading this as done. They are
        different settings and they default independently.
      - >-
        Disabling this and leaving dashboard email subscriptions sending the same result
        as an attachment.
      - >-
        Offering no replacement extract, so the first finance request turns the toggle
        back on for everyone.
    partial_when: >-
      sql_results_download is off and enableResultsDownloading is still true, or this
      setting is off and a dashboard subscription still mails a file of the same query.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/notebooks#enable-users-to-download-sql-query-results
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/settings-commands
    advice:
      start_from: >-
        Set sql-results-download to enabled false, and set enableResultsDownloading to
        false in the same sitting so the two download buttons do not take turns.
      depends_on:
        - >-
          A mandated file extract should be a job into a governed volume, not this
          toggle left on.
        - >-
          Dashboard email subscriptions are a different setting; turning this off does
          not stop a scheduled PDF.
      path:
        - >-
          Read sql-results-download get. Enabled or missing-as-default is the first
          change.
        - >-
          Replace the known SQL Editor exports, then set enabled false.
        - >-
          Read enableResultsDownloading. It will not have moved with this object.
      costs:
        - >-
          SQL Editor users who lived in Download will raise the same ticket the notebook
          users raised, and a volume job is the replacement, not a narrower toggle.
        - >-
          The setting is workspace-wide. One team that still needs a file is a delivery
          path, not an exception bit on this object.
      retain: >-
        The sql-results-download get output, dated, showing the setting not enabled.
      revisit: >-
        A new workspace (the default is enabled), a request to restore SQL download, or
        the notebook download key being changed. Failing those, quarterly with SCP-02-04.

  # DBFS file browser disabled
  # rest-api boolean: enableDbfsFileBrowser. Secure value false. Unset is available.
  # Partner of SCP-02-08 (FileStore HTTPS) and SCP-02-10 (root and mounts blocked).
  # Q: Is the DBFS file browser disabled, so DBFS is not a route around catalogue permissions?
  SCP-02-12:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The sidebar can list DBFS paths for clicking. enableDbfsFileBrowser is that listing.
      A notebook that opens the same path is unaffected, which is why this flag is the
      visible half of a larger move.
    matters: >-
      The browser is a clickable listing of shared storage. It has no catalogue grant and
      no useful audit of which file was opened, which is why a workspace that still has
      data on DBFS looks tidy in the catalogue and open in the sidebar.
    good:
      - enableDbfsFileBrowser is the string false, not missing.
      - Data that mattered has left DBFS for a volume, where a grant applies.
      - FileStore serving and disable-legacy-dbfs are set on their own controls, not inferred from this key.
    examples:
      strong: >-
        enableDbfsFileBrowser is false. The sidebar no longer offers the browser, and the
        files people used to click through now live in a volume.
      partial: >-
        enableDbfsFileBrowser is false, and notebooks still read dbfs:/mnt because the
        browser was only the visible half.
      weak: >-
        The key has never been set. The browser is available, which is the product
        default.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableDbfsFileBrowser
        expect: '"enableDbfsFileBrowser": "false"'
        caveat: >-
          A missing key is scored as available. The browser is the UI. Notebooks can
          still read the same paths until disable-legacy-dbfs is on (SCP-02-10).
      - how: ui
        where: Settings > Advanced > DBFS File Browser
        expect: The toggle off
    pitfalls:
      - >-
        Switching the browser off and describing DBFS as closed. A notebook `ls` of the
        same path still works.
      - >-
        Confusing this with FileStore HTTPS (SCP-02-08) or with disable-legacy-dbfs
        (SCP-02-10). Three settings, three surfaces.
      - >-
        Leaving data on DBFS because the browser is gone, which is how the next person
        "discovers" it from a cluster.
    partial_when: >-
      enableDbfsFileBrowser is false and DBFS root or mounts still hold data a notebook
      can read, or the browser is off and FileStore serving is still on.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/dbfs-browser
      - https://docs.databricks.com/aws/en/dbfs/disable-dbfs-root-mounts
    advice:
      start_from: >-
        Set enableDbfsFileBrowser to false, then treat whatever those paths still hold as
        the next move onto a volume. The browser is the visible half, not the access
        control.
      depends_on:
        - >-
          A workspace that has already turned disable-legacy-dbfs on no longer has a
          browser worth offering; still set this key so an unset default cannot bring the
          UI back if the other setting is later reverted.
        - >-
          Training workspaces that demonstrate DBFS keep the browser on and are named as
          that, rather than leaving production at the default.
      path:
        - >-
          Read enableDbfsFileBrowser. Missing or true is the first change.
        - >-
          Set it to false, then list what is still under dbfs:/ and dbfs:/mnt — that
          inventory is SCP-04-06 and the input to SCP-02-10.
        - >-
          Read enableFileStoreEndpoint in the same sitting. It is a different door.
      costs:
        - >-
          People who used the browser as a file manager will lose the sidebar, which is
          usually the prompt to move the files rather than a reason to turn it back on.
        - >-
          The key does not migrate data. Storage that stays on DBFS stays reachable from
          a notebook.
      retain: >-
        The get-status line for enableDbfsFileBrowser, dated, showing false.
      revisit: >-
        A request to restore the browser, a new workspace (the key starts unset), or
        disable-legacy-dbfs being turned off again. Failing those, quarterly with the
        other DBFS-legacy flags.

  # Front-end private connectivity
  # Q: Does workspace access go over front-end private connectivity rather than the public internet?
  SCP-03-03:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Cloud network architect, with the account admin
    means: >-
      A private access settings object is attached to the workspace, so
      private_access_settings_id is set. That is the platform's record that front-end
      private connectivity was intended. The identifier does not say whether public
      internet access is still allowed — that flag lives on the settings object, not
      on the workspace.
    matters: >-
      With no object attached, registered private endpoints cannot reach the workspace.
      With one attached and public access still enabled, a leaked token still works from
      the internet. Presence of the identifier is the first half; requiring private-only
      is a second decision the identifier does not carry.
    good:
      - private_access_settings_id is set on every workspace that should be reachable privately.
      - Somebody has checked public access on the attached object, which is a different field from the identifier.
      - Clients resolve the workspace URL to the private endpoint, not only have the object in the account.
      - Workspaces in the same region that share the intent reuse the same settings object.
    examples:
      strong: >-
        Every workspace carries a private_access_settings_id. The attached object has
        public access off, DNS sends users to the private endpoint, and a laptop off the
        corporate network cannot open the UI.
      partial: >-
        Production has a private_access_settings_id. Public access on that object is still
        enabled so the BI tool keeps working, and two later workspaces were created without
        one.
      weak: >-
        No workspace has a private_access_settings_id. Access is the public URL plus a
        token, from anywhere.
    verify:
      - how: ui
        where: >-
          Account console > Workspaces > the workspace, the private access settings
          attachment
        expect: A named private access settings object, rather than the field empty
      - how: cli
        where: databricks account workspaces get WORKSPACE_ID
        expect: private_access_settings_id populated on workspaces that should be private
        caveat: >-
          The identifier being set is the whole of this reading. Public access enabled or
          disabled is on the settings object, and this payload does not carry it.
      - how: by-hand
        where: >-
          Account console > Security > Private access settings, the object this workspace
          points at, Public access enabled
        expect: The value your policy requires, stated separately from the identifier
    pitfalls:
      - >-
        Treating private_access_settings_id as proof the workspace is off the internet.
        A new settings object can leave public access enabled, and the identifier is
        still set.
      - >-
        Attaching the object without updating DNS, so everyone still arrives on the
        public hostname and the private path is unused.
      - >-
        Enabling private connectivity on production and creating the next workspace
        without an identifier, which is the default the console still offers.
    partial_when: >-
      The identifier is set so a private path exists, and public access on that object
      is still enabled, or only some workspaces have the identifier at all.
    references:
      - https://docs.databricks.com/aws/en/security/network/classic/private-access-settings
      - https://docs.databricks.com/aws/en/security/network/front-end/front-end-private-connect
    advice:
      start_from: >-
        Attach a private access settings object at workspace creation, then set public
        access off on that object once every client can use the private endpoint.
      depends_on:
        - >-
          A SaaS tool that cannot use Private Link needs public access left on, with
          an IP list or context-based ingress covering that remaining public path.
        - >-
          Context-based ingress as the policy engine still needs a settings object
          attached that allows the registered endpoints, or private traffic is denied
          regardless of the ingress rules.
      path:
        - >-
          Create the settings object and attach it so private_access_settings_id is
          set. Leave public access on until DNS and the first clients work privately.
        - >-
          Switch public access off on the object, then confirm a session off the
          corporate network is refused.
      costs:
        - >-
          Every client of the public URL — notebooks in browsers, REST automation,
          partner tools — has to be given the private path before public access can
          go off, or the cutover is an outage.
        - >-
          The identifier cannot be treated as the finish line: leaving public access
          on is the state that looks done in the workspace list and is not.
      retain: >-
        The workspace's private_access_settings_id and a dated note of public access
        on that object, plus the DNS record that sends the hostname to the private
        endpoint.
      revisit: >-
        A new workspace, a client that still needs the public URL, or a region where
        the existing settings object cannot be reused.

  # Workspace uses a customer-managed VPC (AWS, GCP) or enables VNet injection (Azure)
  # Q: Does this workspace run in a VPC or VNet you own, rather than one Databricks created?
  SCP-03-04:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Cloud network architect
    means: >-
      The workspace is attached to a network configuration you own, so network_id is
      set. On AWS and GCP that is a customer-managed VPC; on Azure it is VNet
      injection. Absent, Databricks created the VPC and there is no place in your
      account to put a firewall on classic compute egress.
    matters: >-
      Classic compute egress is a property of the VPC the workers run in. A
      Databricks-managed VPC cannot take your firewall, and on AWS and GCP the
      network cannot be changed after the workspace exists — adding one later is a
      new workspace.
    good:
      - network_id is set on workspaces whose classic compute handles data you would not want leaving by the default route.
      - The attached network's subnets, security groups and NAT were specified rather than generated.
      - New workspaces receive a network_id at creation, because AWS and GCP will not accept one afterwards.
    examples:
      strong: >-
        Every workspace that runs classic compute has a network_id pointing at a
        reviewed VPC or VNet. Egress goes through a firewall whose allow list is
        named in the design.
      partial: >-
        Production has a network_id. Two workspaces created later for data science
        have none, and one of them now holds a copy of a production table.
      weak: >-
        No workspace has a network_id. Classic compute runs in Databricks-managed
        VPCs, and nobody can say where outbound traffic goes.
    verify:
      - how: ui
        where: Account console > Workspaces > the workspace's network configuration
        expect: A named network configuration, which is what a set network_id looks like
      - how: cli
        where: databricks account workspaces list
        expect: network_id populated on the workspaces that should own their network
        caveat: >-
          network_id set means a configuration is attached. It does not mean that
          VPC's default route is restricted, and it does not appear on serverless
          compute, which does not run in this VPC.
      - how: by-hand
        where: The cloud console, the VPC or VNet that network_id points at, its egress
        expect: A path you recognise — NAT and a firewall, or a documented default route
    pitfalls:
      - >-
        Reading network_id as egress control. The identifier attaches the VPC; the
        route table and firewall are still yours to configure, and an attached VPC
        with 0.0.0.0/0 open is a customer-managed path to anywhere.
      - >-
        Planning to add a customer-managed VPC to an AWS or GCP workspace later.
        The field is set at creation or not at all.
      - >-
        A designed production VPC and Databricks-managed networks everywhere else,
        which is how a copy of production data leaves through a workspace nobody
        firewalled.
    partial_when: >-
      Production has a network_id and later workspaces do not, or the identifier is
      set and the attached VPC still routes outbound traffic unrestricted.
    references:
      - https://docs.databricks.com/aws/en/security/network/classic/customer-managed-vpc
      - https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnet-inject
    advice:
      start_from: >-
        Create workspaces with a network_id from a reviewed VPC or VNet module, and
        put classic-compute egress through a firewall in that network. Do not create
        a workspace first and plan to attach a network later.
      depends_on:
        - >-
          A serverless-only workspace still gets a network_id if classic compute
          might be turned on later, because AWS and GCP will not accept one after
          creation.
        - >-
          Azure can enable secure cluster connectivity on an existing workspace; it
          cannot inject a VNet after creation either, so the same creation-time rule
          holds.
      path:
        - >-
          Register the network configuration in the account and create the next
          workspace with that network_id. Leave existing Databricks-managed
          workspaces on a rebuild list rather than a setting change.
        - >-
          Point classic compute egress at the firewall, then test from a cluster in
          that VPC that a destination outside the allow list fails.
      costs:
        - >-
          Rebuild is the only AWS and GCP remedy, so every workspace created without
          a network_id is a future migration, not a ticket to flip a flag.
        - >-
          You now own subnets, NAT and the firewall. A mis-sized NAT or a missing
          metastore address is an outage in a network you operate.
      retain: >-
        The workspace's network_id, the network configuration it points at, and the
        dated firewall rules that apply to that VPC or VNet.
      revisit: >-
        A workspace created without a network_id, a new region, or the first classic
        cluster on a workspace that was supposed to stay serverless.

  # IP access lists for workspace access
  # Q: Are IP access lists configured for this workspace and switched on?
  SCP-03-05:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin, with the network team
    means: >-
      This workspace has IP access list entries, and those entries are enabled. The
      listing carries label, list type, enabled, and a count of addresses. That is
      the list objects. Whether the workspace applies them is a different setting.
    matters: >-
      Without an enabled allow list, any address with a valid token reaches the UI
      and REST APIs. A list that exists and is disabled is the state that looks
      configured and admits everyone.
    good:
      - At least one enabled ALLOW list, with ranges you can attribute to a current VPN or office.
      - The list objects themselves are enabled, not only present.
      - BLOCK entries are exceptions to an allow list, not the only lists on the workspace.
      - The address count is small enough that somebody still reviews each range.
    examples:
      strong: >-
        An enabled ALLOW list holds this week's VPN and office ranges. BLOCK entries
        exclude a lab range inside that allow list. The objects show enabled, not
        merely created.
      partial: >-
        Lists exist. One ALLOW list is disabled because it blocked a new VPN range
        last month, and the enabled entries are BLOCK lists of a handful of addresses.
      weak: >-
        The listing is empty. Any address with a token can sign in.
    verify:
      - how: ui
        where: Workspace Settings > Security > IP access lists, type and enabled on each
        expect: An enabled ALLOW list of ranges you recognise, rather than an empty page
      - how: cli
        where: databricks ip-access-lists list
        expect: At least one entry with list_type ALLOW and enabled true
        caveat: >-
          This listing is the list objects. It does not include enableIpAccessLists.
          Enabled lists with that setting off restrict nothing.
      - how: sql
        where: |-
          select coalesce(source_ip_address, 'unrecorded') as source_ip, count(*) as n
          from system.access.audit
          where event_date > current_date() - 14 and action_name ilike '%login%'
          group by all order by n desc
        expect: >-
          Source addresses you can place on the allow list, rather than a scatter of
          home and cloud-NAT addresses nobody intended
        caveat: >-
          This is who signed in, not who was refused. A block does not necessarily
          appear here, and an empty result is a quiet window, not a locked workspace.
    pitfalls:
      - >-
        Enabled lists while workspace enforcement is off, which is the common half-
        done state and the one the list page does not show.
      - >-
        Only BLOCK entries enabled. Unknown addresses are still allowed; a stolen
        token is used from an address you have never seen.
      - >-
        An ALLOW list of 0.0.0.0/0 added to restore access, left in place, which
        satisfies "configured and enabled" and restricts nothing.
    partial_when: >-
      List objects exist and are disabled, or the only enabled entries are BLOCK,
      or the allow ranges are stale enough that somebody has had to widen them to
      keep work moving.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-workspace
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
    advice:
      start_from: >-
        One enabled ALLOW list of the current office and VPN ranges on the workspace,
        with your own address already on it, before anyone turns enforcement on.
      depends_on:
        - >-
          Front-end private connectivity with public access disabled makes this list
          apply only to remaining public paths; classic compute NAT addresses that
          reach the control plane still have to be on it.
        - >-
          Context-based ingress as the primary inbound policy can leave this list as
          a second, narrower filter. The list cannot widen what ingress already
          denies.
      path:
        - >-
          Create the ALLOW list and confirm it is enabled, with the address you are
          connecting from present. Check the listing before touching enforcement.
        - >-
          Add BLOCK entries only as exceptions inside that allow list, then keep the
          ranges current when the VPN changes.
      costs:
        - >-
          A missed NAT address for classic compute stops clusters launching once
          enforcement is on, which is how the list gets widened in a hurry.
        - >-
          Someone has to own the ranges. An unowned list is accurate on the day it
          is written and wrong the first time the office moves.
      retain: >-
        The ip-access-lists listing showing label, list_type, enabled and address
        count, exported on the day of the last range change.
      revisit: >-
        A VPN or office range change, a new NAT gateway, or a workspace created
        without copying the lists.

  # Secure cluster connectivity (on Azure this is also called NoPublicIp)
  # Q: Is secure cluster connectivity in effect, so cluster nodes have no public IP addresses?
  SCP-03-06:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Cloud network architect, on Azure
    means: >-
      Classic cluster nodes have no public IP addresses. On Azure that is the
      workspace's No Public IP setting, enableNoPublicIp. New workspaces default to
      on; an older workspace created with it off is the one whose workers still
      have public addresses.
    matters: >-
      A worker with a public IP is reachable from the internet on whatever the image
      left listening. Secure cluster connectivity removes that address and has the
      cluster call the control plane through a relay instead.
    good:
      - enableNoPublicIp is true on every Azure workspace that still runs classic compute.
      - Running cluster NICs in the Azure portal show no public IP.
      - Workspaces created before the default changed have been updated, not only the new ones.
    examples:
      strong: >-
        Every Azure workspace has No Public IP on. Cluster NICs have no public
        address, and the few workspaces created years ago were updated rather than
        left on the old template.
      partial: >-
        Workspaces created this year have it on. One workspace from 2021 still has
        public IPs on its classic clusters because nobody has applied the update.
      weak: >-
        Classic clusters have public IPs. The network security group is what is
        supposed to keep them off the internet.
    verify:
      - how: ui
        where: >-
          Azure portal > the Databricks workspace > Networking > Deploy Azure
          Databricks workspace with Secure Cluster Connectivity (No Public IP)
        expect: Yes, rather than a workspace created with the setting off
      - how: by-hand
        where: Azure portal, a running classic cluster's network interfaces, public IP
        expect: No public IP on the worker NICs
        caveat: >-
          The account workspaces payload collected for this control lists
          network_id and private_access_settings_id. It does not include
          enableNoPublicIp, so those two attachments cannot answer this question.
    pitfalls:
      - >-
        Reading a set network_id or private_access_settings_id as No Public IP.
        Those are different attachments on the same workspace object.
      - >-
        Checking a new workspace, which defaults to on, and skipping the one
        created from an older ARM template with enableNoPublicIp false.
      - >-
        Assuming serverless compute needs this setting. Serverless nodes have no
        public IP already, and they do not use the classic relay.
    partial_when: >-
      New workspaces have No Public IP on and at least one older workspace still
      has public addresses on classic workers.
    not_applicable_when: >-
      The workspace is not on Azure. AWS and GCP enable secure cluster connectivity
      by default and do not expose the Azure enableNoPublicIp flag.
    references:
      - https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/secure-cluster-connectivity
      - https://docs.databricks.com/aws/en/security/network/classic/
    advice:
      start_from: >-
        Create Azure workspaces with No Public IP on, which is the portal default,
        and update any older workspace still running classic compute with public
        IPs.
      depends_on:
        - >-
          An AWS or GCP workspace is outside this control: secure cluster
          connectivity is already the default there, and the Azure flag does not
          exist to set.
        - >-
          A workspace that no longer runs classic compute has nothing for this
          setting to change; serverless nodes already have no public IP.
      path:
        - >-
          Inventory Azure workspaces and note which were created with
          enableNoPublicIp false. Those are the ones the default does not cover.
        - >-
          Update each using the same template that created it, with
          enableNoPublicIp true, then confirm a running cluster's NICs have no
          public IP.
      costs:
        - >-
          Updating an existing workspace is an ARM change, not a Databricks toggle,
          and it has to be done in a window because cluster networking changes
          underneath running jobs.
        - >-
          After the update, any automation that reached workers on a public IP
          stops, which is usually unexpected because it should never have been
          possible.
      retain: >-
        The ARM or portal reading of enableNoPublicIp on each Azure workspace, and
        a dated screenshot of a worker NIC with no public IP after the last update.
      revisit: >-
        An Azure workspace created from an old template, or a classic cluster that
        shows a public IP in the portal after a networking change.

  # Secure model serving endpoints
  # Q: Are the model serving endpoints named in this finding reachable only over Private Link or from an allowed IP range, rather than from the public internet?
  SCP-03-07:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: ML platform lead, with the network team
    means: >-
      The model serving endpoints this workspace actually has are reachable only
      over private connectivity or from an allowed address range. The scan can list
      those endpoints by name. It cannot see what fronts them.
    matters: >-
      A serving endpoint is a REST URL that returns model output. If it is on the
      public internet, anyone who can obtain a token — and, if the endpoint allows
      unauthenticated traffic, anyone — can call it. The finding names the
      endpoints; it does not score their protection.
    good:
      - Each endpoint named in the finding is reachable only from Private Link or from an allowed IP range.
      - Workspace inbound controls cover the model-serving API, not only the UI.
      - Endpoints created after the first review inherit the same restriction rather than defaulting to public.
    examples:
      strong: >-
        The named endpoints accept traffic only from the corporate private path. A
        request from a laptop on the public internet is refused, including to the
        model-serving API rather than only to the workspace UI.
      partial: >-
        The workspace has an IP access list, and one of the named endpoints was
        given a public URL for a vendor. The exception is documented; the others
        are private.
      weak: >-
        Endpoints exist and nobody has checked what can call them. The finding's
        list is the first time the names were written down.
    verify:
      - how: ui
        where: >-
          Serving > each endpoint named in the finding, and Account console > the
          workspace's private access settings
        expect: Private connectivity or an IP restriction covering those endpoints
      - how: cli
        where: databricks serving-endpoints list
        expect: The same names the finding listed, so the question is about this set
        caveat: >-
          The listing is names and state. It is not a reading of IP access lists or
          Private Link. Those need the networking scope and the account plane, which
          this app is not granted.
      - how: by-hand
        where: >-
          A request to one named endpoint from an address that should be refused
        expect: A refusal, from the same network path a caller would actually use
    pitfalls:
      - >-
        Taking a not-applicable finding as a permanent pass. It means there were no
        endpoints when the scan ran, and the requirement returns as soon as one is
        created.
      - >-
        Restricting the workspace UI and leaving the model-serving API on a public
        path, which is a different front door to the same models.
      - >-
        Reading the named list as a verdict on protection. The scan stopped after
        the names; the protection is the question it could not answer.
    partial_when: >-
      Some of the named endpoints are private and at least one still accepts public
      traffic, or the workspace IP list is on and serving was given an exception.
    not_applicable_when: >-
      There are no model serving endpoints in this workspace. The scan already
      returns not-applicable then, and the requirement returns when an endpoint is
      created.
    references:
      - https://docs.databricks.com/aws/en/machine-learning/model-serving/model-serving-limits
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-workspace
    advice:
      start_from: >-
        Put serving behind the same inbound control as the workspace — private
        connectivity or an IP allow list that includes the model-serving API —
        before the first production endpoint is created.
      depends_on:
        - >-
          A vendor that can only call a public URL needs a named endpoint as a
          documented exception, not a workspace-wide public default.
        - >-
          Context-based ingress can target model serving as its own API scope, which
          is the tighter control when the UI and the serving API should not share
          one rule.
      path:
        - >-
          Take the names from the finding and, for each, confirm from a network that
          should be refused that the request fails.
        - >-
          Extend the workspace inbound control to the model-serving API, then create
          further endpoints only after that control is in place.
      costs:
        - >-
          Callers off the corporate network — a partner, a SaaS feature store, a
          laptop on hotel Wi-Fi during an incident — stop working when the public
          path closes, and each one has to be given a private route or an exception.
        - >-
          A serving endpoint created in a hurry for a demo inherits whatever the
          workspace currently allows, which is how a public model appears beside
          the private ones.
      retain: >-
        The finding's endpoint names, dated, and for each a note of private
        connectivity or the IP range that is allowed to call it.
      revisit: >-
        A new serving endpoint, a vendor integration, or a change to workspace
        inbound controls that might not have included the serving API.

  # IP access lists for account console access
  # Q: Are IP access lists configured for the account console itself?
  SCP-03-08:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      The account console has IP access lists of its own, and those lists are
      enabled. They are a different listing from the workspace lists: same shape
      — label, type, enabled, address count — on the account endpoint.
    matters: >-
      A credential that can create workspaces, attach keys and change network
      policy works from anywhere unless the console itself is restricted. Locking
      every workspace and leaving the console open is locking the doors and leaving
      the keys on the street.
    good:
      - The account listing is not empty, and at least one list is enabled.
      - The ranges are the admin VPN or office, not every workspace's NAT.
      - The console lists are reviewed when the workspace lists are, rather than once at account creation.
    examples:
      strong: >-
        The account console has enabled lists covering the admin VPN. Changing a
        workspace network policy from a laptop off that VPN is refused.
      partial: >-
        Lists were created when the account was opened. They are still there, and
        one was disabled last year when a new admin VPN range was blocked.
      weak: >-
        The account listing is empty. Workspace lists are thorough. The console
        accepts any address with an account-admin token.
    verify:
      - how: ui
        where: Account console > Settings > IP access lists, not the workspace setting
        expect: Enabled lists whose ranges you can attribute to the admin path
      - how: cli
        where: databricks account ip-access-lists list
        expect: At least one list with enabled true
        caveat: >-
          Configured and enabled is this reading. Whether any enabled list is an
          ALLOW list is a different field on the same objects.
    pitfalls:
      - >-
        Checking the workspace IP lists and ticking this. The console is a
        different endpoint and a different listing, and it is the one that
        administers the workspaces.
      - >-
        Disabling the console lists to recover from a VPN change, then leaving them
        disabled, which returns the account to "any address".
      - >-
        Copying every workspace NAT range onto the console list, so a cluster in
        any VPC can administer the account.
    partial_when: >-
      Account lists exist and are disabled, or they were accurate when the account
      was created and now block the current admin path so someone turned them off.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-account
      - https://docs.databricks.com/aws/en/security/network/front-end/context-based-ingress
    advice:
      start_from: >-
        Enabled IP access lists on the account console covering the admin VPN and
        office only, maintained on the same cadence as the workspace lists and never
        copied from them.
      depends_on:
        - >-
          Account-level context-based ingress can be the primary console control;
          the IP lists then narrow, and cannot widen, what that policy allows.
        - >-
          Break-glass administration from a named extra range belongs on this list
          as a documented exception, not as a reason to leave the listing empty.
      path:
        - >-
          Open the account console listing, not the workspace one, and add an
          enabled list for the current admin ranges, from a session already on
          those ranges.
        - >-
          Review it whenever the admin VPN changes. Do not disable it to recover
          access without a ticket that puts the new range on and turns it back on.
      costs:
        - >-
          An admin off the VPN cannot open the console, including during an
          incident, unless a break-glass range was named in advance.
        - >-
          The listing is easy to confuse with the workspace lists in a hurried
          review, which is how the console stays open while every workspace looks
          locked.
      retain: >-
        The account ip-access-lists listing — label, type, enabled, address count —
        exported on the last admin-VPN change, clearly labelled as the console and
        not a workspace.
      revisit: >-
        An admin VPN change, a new account admin working from a new network, or a
        workspace list review that did not also open the console listing.

  # Workspaces have proper network policy configuration
  # Q: Does every workspace have a network policy assigned, in restricted mode, and enforced rather than in dry run?
  SCP-03-09:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin, with the network team
    means: >-
      Serverless egress is under a network policy whose restriction_mode is
      RESTRICTED_ACCESS and whose enforcement_mode is ENFORCED. The policy list
      carries those two fields on the policy. Which workspaces the policy is
      assigned to is a different attachment.
    matters: >-
      Serverless compute does not run in your VPC, so the VPC firewall never sees
      it. FULL_ACCESS, or dry-run, lets or logs everything; the path classic
      compute never had is then the one that moves data out.
    good:
      - restriction_mode is RESTRICTED_ACCESS, not FULL_ACCESS.
      - enforcement_mode is ENFORCED, not dry-run.
      - Each workspace that runs serverless is assigned a policy with both, which the policy list alone cannot confirm.
      - Destinations on the allow list are ones workloads actually need, taken from dry-run rather than guessed.
    examples:
      strong: >-
        A named policy is RESTRICTED_ACCESS and ENFORCED, assigned to every
        workspace that runs serverless. Dry-run was used first, and the allow list
        is the destinations that log actually showed.
      partial: >-
        The policy is restricted and still in dry-run, so denials are logged and
        nothing is blocked, or production is assigned the restricted policy and a
        later workspace still has the default.
      weak: >-
        The only policy is default-policy, FULL_ACCESS and ENFORCED. Enforcement
        looks on; restriction is off.
    verify:
      - how: ui
        where: >-
          Account console > Security > Networking > Context-based ingress and
          egress control, each policy's egress mode and which workspaces it is
          assigned to
        expect: RESTRICTED_ACCESS and ENFORCED, assigned to the workspaces that run serverless
      - how: cli
        where: databricks account network-policies list
        expect: restriction_mode RESTRICTED_ACCESS and enforcement_mode ENFORCED
        caveat: >-
          The list shows those two fields on the policy, not assignment. A
          default-policy of FULL_ACCESS with ENFORCED is enforced unrestricted
          egress, and it is the usual account default.
      - how: sql
        where: |-
          select destination, destination_type, access_type, network_source_type,
          count(*) as n
          from system.access.outbound_network
          where event_time > current_timestamp() - interval 30 days
          group by all order by n desc
        expect: >-
          DROP rows for destinations outside the allow list, once the policy is
          enforced. DRY_RUN_DENIAL while it is still in dry-run
        caveat: >-
          This table records denials from serverless egress policy, not successful
          connections. Empty means the policy is not denying, or logging is not on,
          or nothing tried a blocked destination — three different states.
    pitfalls:
      - >-
        Reading ENFORCED on default-policy as a pass. Combined with FULL_ACCESS it
        is unrestricted egress, enforced.
      - >-
        Leaving dry-run on after the log was reviewed, which is the state that
        produces a reassuring denial table and blocks nothing.
      - >-
        Checking the policy list and not the assignment. A perfect policy attached
        to no workspace is a document.
    partial_when: >-
      The policy is restricted and still in dry-run, or production is assigned a
      restricted enforced policy and another workspace still has FULL_ACCESS.
    references:
      - https://docs.databricks.com/aws/en/security/network/serverless-network-security/network-policies
      - https://docs.databricks.com/aws/en/security/network/serverless-network-security/manage-network-policies
      - https://docs.databricks.com/aws/en/admin/system-tables/network
    advice:
      start_from: >-
        A named network policy, not the account default, in dry-run against the
        workspaces that run serverless, then RESTRICTED_ACCESS and ENFORCED once
        the denial log has named the destinations to allow.
      depends_on:
        - >-
          Model serving image builds and external-model calls need destinations the
          first dry-run will not show from notebooks alone, so include those
          products in the dry-run window.
        - >-
          An estate with no serverless compute yet can keep FULL_ACCESS and still
          has to switch before the first warehouse or serving endpoint, because the
          VPC firewall will not see that traffic.
      path:
        - >-
          Create a named policy, assign it, and run dry-run long enough to cover
          notebooks, warehouses and serving. Read outbound_network before changing
          mode.
        - >-
          Add the destinations the log showed were real, set RESTRICTED_ACCESS and
          ENFORCED, and confirm new DROP rows for a destination you did not allow.
      costs:
        - >-
          The first enforced hour breaks whatever destination dry-run missed —
          usually a PyPI mirror, a Maven host, or a model-serving build dependency.
        - >-
          Someone has to own the allow list. An unowned list grows one exception
          per incident and is an allow-everything policy with extra steps.
      retain: >-
        The policy's restriction_mode and enforcement_mode, the workspace
        assignment list, and a dated outbound_network extract from the dry-run that
        justified the allow list.
      revisit: >-
        A new serverless product on the workspace, a destination that started
        failing after a library change, or a workspace still on default-policy.

  # Workspace IP access list enforcement enabled
  # Q: Are IP access lists enforced for this workspace, rather than configured but not switched on?
  SCP-03-10:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The workspace setting enableIpAccessLists is true, so the IP access lists are
      applied. The lists can exist while this is off or unset; they restrict
      nothing until the setting is true.
    matters: >-
      Enforcement off with lists present is the state that looks configured and
      admits every address. A leaked token works from anywhere, and the lists give
      the opposite impression.
    good:
      - enableIpAccessLists is true, not false and not unset.
      - The allow list already contains the address you are connecting from before the setting is turned on.
      - Databricks-internal traffic is left alone; Databricks ranges are not added to the list.
    examples:
      strong: >-
        enableIpAccessLists is true. The allow list held the admin address first,
        so turning it on did not lock anyone out, and a sign-in from an unknown
        address is refused.
      partial: >-
        Production has the setting true. A second workspace still holds a copy of
        production data with the setting unset, so its lists, if any, do nothing.
      weak: >-
        The setting is false or has never been set. Lists may exist. They are not
        applied.
    verify:
      - how: ui
        where: Workspace Settings > Security > IP access lists, the enforcement control
        expect: Enforcement on, not a page of lists with the setting off
      - how: cli
        where: databricks workspace-conf get-status --keys enableIpAccessLists
        expect: '"true". Unset and "false" both mean the lists are not applied'
        caveat: >-
          The setting being true does not mean the lists are an allow list of
          current ranges. This reading is the flag only.
    pitfalls:
      - >-
        Turning the setting on before the allow list contains your address.
        Enforcement applies immediately and locks out anyone outside the list,
        including whoever ran the command.
      - >-
        Reading populated lists as enforcement. The list page can be full while
        this setting is unset, and unset is how a workspace that has never touched
        it reads.
      - >-
        Adding Databricks service addresses to the list. Databricks-internal
        traffic is unaffected; extra ranges only widen what the internet can do.
    partial_when: >-
      Enforcement is on in one workspace and unset or false in another that still
      holds the same data, or it is on and the only list is so wide it admits the
      internet.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-workspace
    advice:
      start_from: >-
        Set enableIpAccessLists to true only after an enabled ALLOW list already
        contains the address you are connecting from. Treat unset and false as the
        same state: the lists do nothing.
      depends_on:
        - >-
          Front-end private connectivity with public access disabled makes this
          setting apply to remaining public paths; confirm classic-compute NAT
          addresses are already on the allow list or clusters will not launch.
        - >-
          A workspace with no list objects yet must not have this set to true —
          an empty allow list with enforcement on admits every address, which is
          the documented behaviour until an ALLOW entry exists.
      path:
        - >-
          Confirm the list objects first, including your address. Then set
          enableIpAccessLists true from a session already on the list.
        - >-
          From an address that should be refused, confirm the UI and the REST API
          both fail, not only one of them.
      costs:
        - >-
          A missed address is an immediate lockout, which is why the setting is so
          often left unset after the lists were created.
        - >-
          Someone has to keep the lists current after this is on; enforcement of a
          stale list is worse than no list, because it trains people to disable the
          setting.
      retain: >-
        The workspace-conf value of enableIpAccessLists, dated, next to the list
        export from the same day, so a later review can see the flag and the lists
        together.
      revisit: >-
        A VPN change, a new workspace whose setting is still unset, or a lockout
        that was recovered by setting the flag back to false.

  # Context-Based Ingress (CBI) policy configured
  # Q: Is public access to the workspace restricted by a network policy, rather than open with a policy present?
  SCP-03-11:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin, with the network team
    means: >-
      Public inbound access is restricted by the network policy's ingress rules —
      context-based ingress — not merely by a policy existing. The mode that
      matters is the ingress restriction. It is not the egress restriction_mode
      the same policy object also carries.
    matters: >-
      IP access lists only see source addresses. Ingress rules can say who, from
      where, and which API, including model serving as its own scope. A policy
      that exists with public ingress unrestricted is the default, not a
      restriction.
    good:
      - Public ingress on the policy is restricted, with allow rules for the identities and networks that should get in.
      - Dry-run was used first, then enforcement, on the ingress side.
      - The account default policy was left alone and a named policy was assigned to the workspaces that need the restriction.
    examples:
      strong: >-
        A named policy restricts public ingress, with allow rules for the corporate
        VPN and the groups that should reach the UI and the APIs. Dry-run ran
        first; enforcement is on.
      partial: >-
        Ingress is restricted and still in dry-run, so the log is full and nothing
        is blocked, or the UI is restricted and the model-serving API still allows
        all public addresses.
      weak: >-
        A network policy exists. Public ingress is still allow-from-all. The
        policy page looks populated.
    verify:
      - how: ui
        where: >-
          Account console > Security > Networking > the policy's Ingress tab, the
          public access mode and the allow rules
        expect: Restricted public access, with allow rules you can name, not allow-from-all
      - how: cli
        where: databricks account network-policies list
        expect: The policy JSON's ingress public-access restriction, not only egress
        caveat: >-
          egress.network_access.restriction_mode is serverless outbound access. It
          is not the ingress mode this control asks about. FULL_ACCESS there does
          not mean public inbound is open, and RESTRICTED_ACCESS there does not
          mean public inbound is closed.
    pitfalls:
      - >-
        Reading egress restriction_mode as context-based ingress. They share a
        policy object and answer different questions.
      - >-
        Restricting the UI and leaving the model-serving API on all public IPs,
        which ingress can target separately and a workspace IP list cannot.
      - >-
        Editing the account default policy instead of assigning a named one, so
        every future workspace inherits an experiment.
    partial_when: >-
      Ingress is restricted and still in dry-run, or the UI is restricted and
      another API scope — often model serving — still allows all public addresses.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/context-based-ingress
      - https://docs.databricks.com/aws/en/security/network/front-end/manage-ingress-policies
    advice:
      start_from: >-
        A named network policy with public ingress restricted, assigned to the
        workspaces that need it, in dry-run until the log shows who would have been
        blocked, then enforced. Leave the account default policy untouched.
      depends_on:
        - >-
          Front-end private connectivity with public access disabled means ingress
          rules are not evaluated for public traffic; private-endpoint rules still
          have to allow the registered endpoints.
        - >-
          A workspace IP list remains a second filter and cannot widen what ingress
          already denies, so do not keep both as competing sources of truth.
      path:
        - >-
          Create a named policy, set public ingress to restricted, add the allow
          rules for who / from where / which API, and assign it in dry-run.
        - >-
          Read who would have been denied, fix the rules, then enforce. Check the
          model-serving API scope explicitly if endpoints exist.
      costs:
        - >-
          The first enforced hour blocks a client nobody listed — usually a BI tool
          or an automation identity — and the recovery is an allow rule, not
          turning the policy off.
        - >-
          Rules that combine identity, network and API are harder to review than an
          IP list, so they need an owner or they rot into allow-from-all with extra
          clicks.
      retain: >-
        The policy's ingress public-access mode, the allow rules, the workspace
        assignment, and a dated dry-run extract from before enforcement.
      revisit: >-
        A new API scope in use (serving, apps, dashboards), a client that started
        failing, or a workspace still on the default allow-from-all ingress.

  # Account console IP access list enforcement enabled
  # Q: Does the account console IP access list have at least one enabled allow entry?
  SCP-03-12:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      The account console IP access listing has at least one entry whose type is
      ALLOW and whose enabled flag is true. BLOCK-only lists, or ALLOW lists that
      are disabled, leave the console reachable from any address.
    matters: >-
      A BLOCK list excludes addresses you already know. Account takeover uses an
      address you have never seen. Only an enabled allow list changes the default
      from anyone to these ranges.
    good:
      - At least one enabled list whose list_type is ALLOW.
      - BLOCK entries if they exist are exceptions to that allow list, not a substitute for it.
      - The allow ranges are the admin path and are current, not 0.0.0.0/0.
    examples:
      strong: >-
        An enabled ALLOW list holds the admin VPN range. BLOCK entries exclude a
        lab inside that range. An account-admin token from a home address is
        refused at the console.
      partial: >-
        An ALLOW list exists and is disabled, or the only enabled lists are BLOCK,
        so unknown addresses still reach the console.
      weak: >-
        No ALLOW entry is enabled. The console is reachable from any address with
        an account-admin token, including one being used from somewhere new.
    verify:
      - how: ui
        where: Account console > Settings > IP access lists, list type and enabled on each
        expect: At least one enabled ALLOW entry, not only BLOCK and not only disabled ALLOW
      - how: cli
        where: databricks account ip-access-lists list
        expect: An entry with list_type ALLOW and enabled true
        caveat: >-
          An enabled ALLOW list of 0.0.0.0/0 satisfies both fields and restricts
          nothing. The fields are type and enabled, not whether the range is tight.
    pitfalls:
      - >-
        Enabled BLOCK lists with no ALLOW list, which is the configuration that
        looks like a restriction and still admits unknown addresses.
      - >-
        An ALLOW list created and left disabled, which is the other half of
        "configured" that this control is there to catch.
      - >-
        Treating workspace ALLOW lists as the console's. The console listing is
        the one that decides whether an account-admin token works from a new
        address.
    partial_when: >-
      An ALLOW list exists and is disabled, or the only enabled lists are BLOCK,
      or the enabled ALLOW range is the whole internet.
    references:
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list-account
      - https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
    advice:
      start_from: >-
        One enabled ALLOW list on the account console for the admin VPN and office
        ranges. Do not count BLOCK lists, disabled ALLOW lists, or the workspace
        lists as this control.
      depends_on:
        - >-
          Account-level context-based ingress can carry the same restriction with
          more context; the ALLOW list then has to match it, not fight it.
        - >-
          A 0.0.0.0/0 ALLOW entry that was added to recover from a lockout must be
          replaced with the real range the same day, or the field stays satisfied
          and the console stays open.
      path:
        - >-
          From a session already on the admin range, create an ALLOW list and
          confirm it shows enabled. Check list_type in the listing, not only that
          a list exists.
        - >-
          Remove or disable any 0.0.0.0/0 ALLOW entry, and keep BLOCK entries as
          exceptions inside the allow list rather than as the only enabled type.
      costs:
        - >-
          Admins off the VPN lose the console until a break-glass range is named,
          which is the point and is also the reason this gets deferred.
        - >-
          Recovering from a missed range by adding 0.0.0.0/0 is faster than fixing
          the range, and it is the failure this control will still read as an
          enabled ALLOW list.
      retain: >-
        The account listing filtered to list_type ALLOW and enabled true, with the
        addresses, dated on the last admin-VPN change.
      revisit: >-
        An admin VPN change, a lockout recovered with 0.0.0.0/0, or a review that
        looked only at BLOCK entries.

  # PAT tokens are about to expire
  # Q: Do you know which tokens expire in the next 90 days, and is someone responsible for rotating them?
  # rest-api: token_infos[].expiry_time. Resolver default horizon is 30 days (expiring_within_days),
  # outcome is partial not fail. The blocked question says 90 days — write against the resolver.
  SCP-04-01:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Tokens that already have an expiry_time are watched as that date approaches, so a replacement
      is issued before the date rather than after whatever still presents the token has stopped.
    matters: >-
      A dated token that nobody is watching dies on its expiry_time. The caller fails that morning,
      and the person who minted it may already have left.
    good:
      - The token listing names each expiry_time, and someone owns rotation for the ones inside the horizon.
      - Replacements are issued before expiry_time, then the old token is revoked.
      - Tokens with no expiry_time are handled as perpetual, not as "not yet due".
      - Automation that can use OAuth has moved off PATs, so the dated inventory is shrinking.
    examples:
      strong: >-
        A weekly listing of tokens whose expiry_time falls inside thirty days is sent to the owners
        named on those rows. Each replacement is issued the week before, and the old token is
        revoked the day the caller moves.
      partial: >-
        Expiry dates are visible and a few owners rotate, but two service tokens have expiry_time
        inside the next fortnight and no replacement has been created.
      weak: >-
        Nobody looks at expiry_time. Tokens fail in production and are recreated in a hurry with
        whatever lifetime the form still allows.
    verify:
      - how: cli
        where: databricks token-management list
        expect: >-
          Every remaining token has an expiry_time, and the ones inside the next 30 days have a
          named owner and a replacement already issued
        caveat: >-
          The finding compares expiry_time to a 30-day horizon and scores those as partial, not
          fail — a token approaching expiry is expected behaviour. Tokens with no expiry_time are
          not in this comparison; that absence is the perpetual-token control. An empty listing is
          not-applicable.
      - how: ui
        where: Account console > Security > Token report, sorted by expiration date
        expect: No surprise inside the next month, or only tokens you are already replacing
        caveat: >-
          The account report spans workspaces. The finding lists tokens in this workspace.
    pitfalls:
      - >-
        Reading a token with no expiry_time as "not due soon". It never becomes due, and it is a
        different control.
      - >-
        Revoking on expiry_time day without a replacement already in the caller's secret store.
      - >-
        Treating the blocked question's "90 days" as the finding. The resolver's default horizon is
        30 days; 90 is the question text, not the comparison.
    partial_when: >-
      Dated tokens exist and one or more have expiry_time inside the next 30 days, which is the
      finding's partial — a scheduling item, not a misconfiguration.
    not_applicable_when: >-
      This workspace has no personal access tokens, or none of them has an expiry_time, so none is
      approaching one.
    references:
      - https://docs.databricks.com/aws/en/admin/access-control/tokens
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/token-management-commands
    advice:
      start_from: >-
        List tokens with an expiry_time in the next 30 days, issue a replacement for each caller,
        then revoke the old one the day the caller has moved. Do not wait for the date.
      depends_on:
        - >-
          A vendor that cannot rotate inside 30 days keeps one dated token with a named owner and
          a calendar reminder, not an undated one.
        - >-
          Tokens with no expiry_time are not this list — revoke those as perpetual first, or they
          sit beside a clean horizon and look checked.
      path:
        - >-
          Run token-management list and keep the rows that have expiry_time. Sort by that date.
        - >-
          For each owner named in created_by_username or comment, find the caller before minting
          anything.
        - >-
          Issue the replacement, cut the caller over, revoke the old token. Repeat until nothing
          in the 30-day window is unowned.
      costs:
        - >-
          Each rotation is a change in every secret store that held the old value, which is rarely
          only the workspace admin's.
        - >-
          A missed caller is an outage on expiry_time morning, which is why the search comes first.
      retain: >-
        A dated token-management listing with expiry_time on every remaining row, and the ticket
        that names which ones were rotated and what replaced them.
      revisit: >-
        A new integration that asks for a PAT, a token appearing with no owner in the comment, or
        the workspace ceiling changing. Failing those, monthly — tokens age on their own.

  # Log delivery configurations
  # Q: Is audit log delivery configured at the account and currently enabled?
  # rest-api: log_delivery_configurations[].log_type and .status. Look for AUDIT_LOGS + ENABLED.
  # Empty list is not "logs are not arriving" — that is SCP-04-18.
  SCP-04-02:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      The account has a log-delivery configuration whose log_type is AUDIT_LOGS and whose status
      is ENABLED, so a copy of the audit trail is written to storage you hold.
    matters: >-
      system.access.audit is retained for a platform window. An investigation that starts after
      that window has nothing to read unless a copy was delivered outside.
    good:
      - A configuration exists with log_type AUDIT_LOGS and status ENABLED, not DISABLED or stale.
      - The destination is a bucket you can still read, and new files have arrived recently.
      - Workspace filters, if set, include every workspace an investigation would ask about.
      - Someone other than the person who created the configuration can find it.
    examples:
      strong: >-
        One ENABLED AUDIT_LOGS configuration covers the account. The destination bucket shows
        new JSON for each workspace_id, including workspaceId=0 for account events, and a
        scheduled check pages if a day arrives with no file.
      partial: >-
        An AUDIT_LOGS configuration exists and is ENABLED, but workspace_ids_filter names only
        the first two workspaces, so the ones created later have no delivered copy.
      weak: >-
        The log-delivery list is empty, or the only AUDIT_LOGS row has status DISABLED.
    verify:
      - how: cli
        where: databricks log-delivery list
        expect: >-
          At least one row with log_type AUDIT_LOGS and status ENABLED
        caveat: >-
          This field pair is the configuration, not the arrival of events. A disabled or missing
          row does not say whether system.access.audit is current — that is a different control.
          GCP is not in this collector's clouds.
      - how: ui
        where: Account console > Settings > Log delivery, the configuration whose type is AUDIT_LOGS
        expect: Status enabled, and a destination you recognise
      - how: by-hand
        where: Open the destination bucket and look at the newest object's date
        expect: A file from today or yesterday, not only the week the configuration was created
    pitfalls:
      - >-
        Creating the configuration and never checking the bucket. Status ENABLED is the stored
        value; it is not a file on disk.
      - >-
        Filtering to a handful of workspace ids and reading the account as covered. Workspaces
        created later are absent from that filter until someone adds them.
      - >-
        Pointing at system.access.audit as the delivered copy. The system table is a different
        retention, and it is not this field.
    partial_when: >-
      An ENABLED AUDIT_LOGS configuration exists and the destination is missing some workspaces,
      or the configuration is enabled and the bucket has gone quiet.
    references:
      - https://docs.databricks.com/aws/en/admin/account-settings/audit-log-delivery
      - https://docs.databricks.com/aws/en/admin/system-tables/audit-logs
    advice:
      start_from: >-
        Create one account-level AUDIT_LOGS delivery with status ENABLED and no workspace filter,
        then confirm a new object landed in the destination before you call it done.
      depends_on:
        - >-
          A separate SIEM that already tails system.access.audit still wants this copy — the
          system table's retention is not the same as a bucket you hold.
        - >-
          Azure diagnostic settings are a different surface; this collector is the account
          log-delivery API and is listed for AWS and Azure only.
      path:
        - >-
          List log-delivery. If no row has log_type AUDIT_LOGS and status ENABLED, create one.
        - >-
          Wait for the first file, then confirm workspaceId=0 and at least one real workspace_id
          both appear.
        - >-
          Remove or widen any workspace_ids_filter that predates workspaces you now run.
      costs:
        - >-
          Delivery is another IAM role, another bucket policy, and another bill for the objects.
        - >-
          A filter that seemed tidy on day one silently excludes every workspace created after it.
      retain: >-
        The log-delivery list showing AUDIT_LOGS / ENABLED, and a dated listing of the newest
        object in the destination prefix.
      revisit: >-
        A new workspace (check the filter), a destination bucket policy change, or a day with no
        new object. Failing those, quarterly.

  # Long-running clusters
  # Q: Are any clusters running for weeks without a restart?
  # rest-api planned: clusters.list start_time. No resolver. Do not treat change_time as a restart.
  SCP-04-03:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      Running clusters are restarted on a schedule so they pick up a new host image. The field
      that dates that restart is the cluster's start_time, not the last time its definition was
      edited.
    matters: >-
      Image and host-OS patches are applied when a cluster starts. A cluster that has been up
      for weeks is still running the image it started with, including whatever was disclosed
      against that image after that date.
    good:
      - Running all-purpose clusters show a start_time inside the last two weeks, unless a named exception says otherwise.
      - Job clusters terminate with the run, so they are not in this population.
      - Automatic cluster update, if enabled, is a different setting and is not inferred from start_time.
      - Someone can name the cluster that has been up the longest and why.
    examples:
      strong: >-
        Interactive clusters auto-terminate overnight. The two that stay up for a service have a
        weekly restart on the calendar, and their start_time matches last Sunday.
      partial: >-
        Most interactive clusters recycle with auto-termination, but one "shared analytics"
        cluster has a start_time from last quarter and nobody will bounce it because a notebook
        is attached.
      weak: >-
        Several all-purpose clusters have been running since they were created. start_time is
        not a number anybody looks at.
    verify:
      - how: cli
        where: databricks clusters list
        expect: >-
          For clusters in state RUNNING, start_time is recent enough that you can account for
          each one individually
        caveat: >-
          start_time is the last start, not last edit. This control has no resolver yet; the
          catalogue names clusters.list, which an app install may not be authorised to call.
      - how: ui
        where: Compute > each running all-purpose cluster, the started time
        expect: A date you can explain, not a start from the month the cluster was first created
    pitfalls:
      - >-
        Reading change_time in system.compute.clusters as a restart. That column is the last
        definition edit, and an untouched cluster looks ancient or brand-new for the wrong reason.
      - >-
        Pointing at automatic cluster update and skipping the start_time list. That setting is
        a different control, and it is off until it is on.
      - >-
        Restarting without warning the people attached to the cluster. The image update is also
        a lost notebook state.
    partial_when: >-
      Most running clusters have a recent start_time and one long-lived shared cluster does not,
      or a restart is on the calendar and has not happened yet.
    not_applicable_when: >-
      The workspace has no classic running clusters — serverless has no start_time for you to
      keep current.
    references:
      - https://docs.databricks.com/aws/en/compute/clusters-manage
      - https://docs.databricks.com/aws/en/admin/clusters/automatic-cluster-update
    advice:
      start_from: >-
        Put auto-termination on every interactive cluster that can stand it, and give any
        cluster that must stay up a weekly restart with a named owner.
      depends_on:
        - >-
          A serving or streaming cluster that cannot bounce mid-window keeps a documented
          exception and a maintenance slot, not an unbounded uptime.
        - >-
          Job compute dies with the run; do not restart those by hand to satisfy a start_time
          you will never see.
      path:
        - >-
          List RUNNING clusters and read start_time. Name the oldest.
        - >-
          Turn on auto-termination where the work is interactive, then schedule a restart for
          the rest.
        - >-
          After the first bounce, confirm start_time moved. If it did not, the restart did not
          happen.
      costs:
        - >-
          A restart drops attached notebooks and in-memory caches, which is why the calendar
          exists.
        - >-
          The people who treat a long-lived cluster as a server will resist the bounce until
          something on that image is patched out from under them.
      retain: >-
        A dated clusters list with state and start_time, and the calendar entry for any cluster
        that is allowed to stay up.
      revisit: >-
        A new always-on cluster, an automatic-cluster-update setting change, or a host-image
        advisory. Failing those, monthly.

  # Deprecated versions of Databricks runtimes
  # system-table: all-purpose (UI or API), major < min_supported_runtime_major (14).
  # Unparseable runtime counts as unsupported. Distinct from CO-01-04 (current vs patched).
  SCP-04-04:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator
    means: >-
      Classic all-purpose clusters run a Databricks Runtime whose major is at or above the
      catalogue floor of 14. Below that floor the runtime is treated as past support, so
      security patches have stopped.
    matters: >-
      An unsupported runtime keeps the CVEs that were open when support ended. Upgrading later
      does not close the window those clusters already ran through.
    good:
      - No all-purpose cluster (cluster_source UI or API) has a dbr_version major below 14.
      - A runtime string that does not start with a number is treated as unsupported, not skipped.
      - Policies refuse majors below the floor, so a new cluster cannot recreate the finding.
      - Job clusters are out of this population — the measure is all-purpose only.
    examples:
      strong: >-
        Every all-purpose cluster is on 14.3 LTS or newer. The policy default is the current LTS,
        and the last 13.x interactive cluster was edited last quarter.
      partial: >-
        Most all-purpose clusters are on 15.x; two long-lived UI clusters still show 13.3 because
        a library pin has not moved.
      weak: >-
        Interactive fleets still on 11.x and 12.x. Custom image strings that do not parse as a
        major are left in place.
    verify:
      - how: sql
        where: |-
          with current_clusters as (
            select * from system.compute.clusters
            qualify row_number() over (
              partition by workspace_id, cluster_id order by change_time desc) = 1
          )
          select dbr_version, cluster_source, count(*) as clusters
          from current_clusters
          where delete_time is null and cluster_source in ('UI', 'API')
          group by all
          order by clusters desc
        expect: >-
          No all-purpose row whose dbr_version major is below 14, and no unparseable runtime
          string left unexplained
        caveat: >-
          The qualify is required: this table keeps a row per edit. The app scores cluster_source
          UI or API only, and treats a runtime it cannot parse as below the floor. No classic
          all-purpose clusters is not-applicable — serverless has no version for you to patch.
          This is not the cost control that asks whether runtimes are current.
      - how: ui
        where: Compute > an all-purpose cluster named in the finding > Configuration > Databricks runtime
        expect: Major 14 or later, matching the policy default
    pitfalls:
      - >-
        Clearing the cost-pillar runtime finding and calling this done. That one is about being
        current; this one is about still receiving patches, and the floors can differ.
      - >-
        Dropping a custom-image string from the denominator because it does not look like 14.3.x.
        The resolver counts it as unsupported.
      - >-
        Upgrading a job cluster and leaving the interactive one on 12.x. Job compute is not in
        this share.
    partial_when: >-
      At least 90% of all-purpose clusters are on major 14 or later and a remainder is not —
      one unpatched cluster is still one unpatched cluster.
    not_applicable_when: >-
      The estate ran no classic all-purpose clusters in the window, so there is no runtime
      whose support window could have closed.
    references:
      - https://docs.databricks.com/aws/en/release-notes/runtime/
      - https://docs.databricks.com/aws/en/admin/system-tables/compute
    advice:
      start_from: >-
        Replace each unsupported classic interactive runtime with a release that still receives
        security patches, and block new creates of those retired versions in the compute policy.
      depends_on:
        - >-
          A library that only builds on 13.x stays listed as a dated exception until the pin
          moves — do not freeze the fleet on that major.
        - >-
          Serverless needs no action here; do not recreate classic clusters so there is
          something to upgrade.
      path:
        - >-
          Run the inventory grouped by dbr_version. Anything whose leading integer is below 14,
          or which does not parse, is the list.
        - >-
          Check each workload against the release notes, then edit spark_version and restart in
          a window.
        - >-
          Pin the policy default to a supported LTS so the next cluster is created already over
          the floor.
      costs:
        - >-
          A major step can change Spark behaviour. The release-notes read is the cost of not
          finding that out in production.
        - >-
          The restart is downtime for whoever is attached, which is why the window is on the
          calendar before the edit.
      retain: >-
        The dated cluster inventory grouped by dbr_version, showing no all-purpose major below
        14.
      revisit: >-
        Databricks retiring a major you still run, a new custom image, or a policy default
        slipping backward. Failing those, when the support matrix on the runtime page moves.

  # Managed tables in DBFS root
  # Q: Is data still being written to the DBFS root under /user/hive/warehouse?
  # rest-api: dbfs.list on /user/hive/warehouse. Denied (root disabled) is unreadable, not empty.
  SCP-04-05:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin, with the data owners
    means: >-
      Managed tables do not live under /user/hive/warehouse on the DBFS root. That path is the
      legacy Hive warehouse, and a listing of it is how this control is collected.
    matters: >-
      Objects under the DBFS root have no catalogue grant. Anyone who can use the workspace can
      read the files, and a DELETE issued against a Unity Catalog table does not reach them —
      which is the gap the GDPR erasure walkthrough is written against.
    good:
      - dbfs ls /user/hive/warehouse is empty, denied because the root is disabled, or holds only paths you can name and are moving.
      - New managed tables are created in Unity Catalog catalogs, not in hive_metastore.
      - Pipelines that still write a managed table to the root have an owner and a removal date.
      - The DBFS file browser, if still on, is not treated as proof the warehouse is unused.
    examples:
      strong: >-
        The DBFS root is disabled, so a list of /user/hive/warehouse is refused. Managed tables
        live in Unity Catalog, and a search of the repo finds no LOCATION that points at the
        root warehouse.
      partial: >-
        Most tables were migrated. Two Hive managed tables remain under /user/hive/warehouse
        because a job still inserts into them, and they have no date to move.
      weak: >-
        The warehouse listing is full of database directories, and new notebooks still CREATE
        TABLE without a catalog name.
    verify:
      - how: cli
        where: databricks fs ls dbfs:/user/hive/warehouse
        expect: >-
          An empty listing, or only directories you can account for and are migrating
        caveat: >-
          "Public DBFS root is disabled. Access is denied" is a refused probe, not an empty
          warehouse. The collector records that as denied. It does not mean there are no leftover
          files; it means this endpoint cannot see them.
      - how: sql
        where: |-
          select table_catalog, count(*) as tables
          from system.information_schema.tables
          where table_schema not in ('information_schema')
          group by all
          order by tables desc
        expect: >-
          Catalogs you recognise, with hive_metastore absent or holding only the residue you
          already named
        caveat: >-
          information_schema cannot see the legacy metastore. A tidy result here and a full
          /user/hive/warehouse listing are not in contradiction — they are different surfaces.
      - how: ui
        where: Catalog Explorer, and whether hive_metastore still holds managed tables the jobs use
        expect: Production writes landing in Unity Catalog catalogs
    pitfalls:
      - >-
        Reading a denied DBFS list as proof the warehouse is empty. Denied is unreadable.
      - >-
        Migrating the table definition into Unity Catalog and leaving the job writing the old
        path, so the governed name is a view over nothing new.
      - >-
        Assuming a GDPR erasure job that DELETEs from a catalog table has also cleared the Hive
        copy. The page that walks that deletion is about Delta tables you can name.
    partial_when: >-
      The root warehouse still holds a handful of managed-table directories for jobs nobody has
      rewritten, or the listing is refused and hive_metastore tables still appear in the UI.
    references:
      - https://docs.databricks.com/aws/en/dbfs/
      - https://docs.databricks.com/aws/en/ldp/gdpr
    advice:
      start_from: >-
        Stop creating managed tables on the DBFS root. Move the ones that remain into a Unity
        Catalog catalog with its own managed location, then disable the root so the next CREATE
        cannot land there.
      depends_on:
        - >-
          A job that still speaks Hive names keeps those tables listed and dated, not a
          workspace-wide exception that lets every notebook write to the root.
        - >-
          Where GDPR erasure is in scope, the Hive residue is its own deletion list — the
          catalog DELETE does not see it.
      path:
        - >-
          Try listing dbfs:/user/hive/warehouse. Denied or empty is the first reading; a list
          of directories is the migration backlog.
        - >-
          Recreate each remaining managed table in a catalog, cut the job over, then drop the
          Hive copy.
        - >-
          Disable the DBFS root when the listing is residue you have already scheduled, so new
          writes cannot refill it.
      costs:
        - >-
          Every job that used a two-part Hive name has to be edited, which is how a "quick
          migration" becomes a quarter.
        - >-
          Disabling the root before the last writer moves is an outage, and the error will not
          name the table that still needed it.
      retain: >-
        The dated fs ls of /user/hive/warehouse (or the denied error), and the list of Hive
        tables that remain with an owner.
      revisit: >-
        A new workspace with the root still enabled, a job imported from an older repo, or a
        GDPR erasure request that named a subject still stored under the root.

  # Unity Catalog enabled clusters
  # system-table: all-purpose with a recorded data_security_mode. Unwritten is unmeasured.
  SCP-04-07:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator
    means: >-
      Every all-purpose cluster that records a data_security_mode runs in a Unity Catalog access
      mode, so metastore grants apply to whoever attaches to it.
    matters: >-
      A cluster in a legacy or no-isolation mode does not consult the metastore. Every GRANT
      written there is advisory for anyone who can attach, and the audit of that read names the
      cluster identity rather than the user.
    good:
      - Recorded data_security_mode values are SINGLE_USER, USER_ISOLATION, or the DATA_SECURITY_MODE_* spellings of the same intent.
      - Clusters whose data_security_mode is unwritten are edited so the column populates, not assumed compliant.
      - Policies refuse NONE and the LEGACY_* modes for new all-purpose clusters.
      - Serverless is out of this population — it has no access mode for you to set.
    examples:
      strong: >-
        Every all-purpose cluster with a recorded mode is USER_ISOLATION or SINGLE_USER. The
        last NONE cluster was edited last month, and the policy no longer offers it.
      partial: >-
        New clusters are created in a Unity Catalog mode. Two long-lived UI clusters still
        show NONE because a Scala RDD job has not been rewritten.
      weak: >-
        Shared clusters are NONE so "anything runs". Grants in the metastore are treated as
        documentation.
    verify:
      - how: sql
        where: |-
          with current_clusters as (
            select * from system.compute.clusters
            qualify row_number() over (
              partition by workspace_id, cluster_id order by change_time desc) = 1
          )
          select data_security_mode, cluster_source, count(*) as clusters
          from current_clusters
          where delete_time is null and cluster_source in ('UI', 'API')
          group by all
          order by clusters desc
        expect: >-
          Recorded modes are Unity Catalog modes. A null data_security_mode is unmeasured, not
          a pass and not a no-isolation failure
        caveat: >-
          The column is unwritten on clusters that have not been created or edited since it
          was added. The app measures only the rows that have a value; reading null as NONE
          would fail an estate for a rollout date. Unrecognised new modes are treated as
          not-UC, which is a visible finding.
      - how: ui
        where: Compute > an all-purpose cluster > Configuration > Access mode
        expect: Standard or Dedicated (the current names), not No isolation shared
    pitfalls:
      - >-
        Counting a clean share while most clusters have a null data_security_mode. The finding
        will say how many were measured; the rest were left out.
      - >-
        Moving a workload that needs RDD APIs onto USER_ISOLATION and watching it fail, then
        reverting to NONE. SINGLE_USER is still a Unity Catalog mode.
      - >-
        Setting the mode on a policy and not editing the running clusters, so the column stays
        unwritten and the finding stays unmeasured.
    partial_when: >-
      At least 80% of all-purpose clusters with a recorded mode are Unity Catalog enabled and
      a remainder is not, or the recorded set is clean and a large share still has no mode
      written.
    not_applicable_when: >-
      The estate ran no classic all-purpose clusters, so there is no access mode to set.
    references:
      - https://docs.databricks.com/aws/en/compute/standard-limitations
      - https://docs.databricks.com/aws/en/admin/system-tables/compute
    advice:
      start_from: >-
        Put every new all-purpose cluster on standard (USER_ISOLATION) or dedicated
        (SINGLE_USER) access mode, and edit each existing cluster once so the mode is recorded
        and the finding can see it.
      depends_on:
        - >-
          A workload that needs RDD APIs or cluster-scoped init that standard mode refuses
          moves to dedicated, not back to no-isolation.
        - >-
          Serverless is already Unity Catalog governed; do not create a classic cluster to
          have a mode to set.
      path:
        - >-
          Group the live all-purpose fleet by data_security_mode. Nulls are the first edits —
          any change writes the column.
        - >-
          Move NONE and LEGACY_* clusters to USER_ISOLATION or SINGLE_USER, starting with
          the ones people share.
        - >-
          Pin the policy so those modes cannot be chosen again.
      costs:
        - >-
          Standard mode refuses some Scala and machine-level access. Finding that out is a
          test run, not a configuration toggle.
        - >-
          Editing a long-lived cluster to write the column is also a restart.
      retain: >-
        The dated inventory grouped by data_security_mode, with a note of how many all-purpose
        rows were null and therefore unmeasured.
      revisit: >-
        A new access-mode name from the platform, a workload that fails on standard mode, or
        a cluster created outside the policy. Failing those, when you next review compute
        policies.

  # Enforce AWS Instance Metadata Service v2
  # rest-api: enableEnforceImdsV2. Secure true. whenAbsent unknown — unset is unmeasured.
  SCP-04-08:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enableEnforceImdsV2 is the stored workspace flag that requires Instance Metadata Service
      v2 on classic compute. The finding reports the key's value, or that the key has never
      been set.
    matters: >-
      IMDSv1 answers a simple GET with the instance's credentials. A process that can reach
      the metadata address can collect them. v2 requires a session token first.
    good:
      - enableEnforceImdsV2 is the string true, not false.
      - A missing key is treated as unknown, not as off — newer AWS workspaces may enforce without storing the key.
      - Workloads that read instance metadata have been tested with a token request.
      - The setting is AWS-only; other clouds have no key to set.
    examples:
      strong: >-
        enableEnforceImdsV2 is true. Clusters were restarted after it was set, and the one
        notebook that fetched metadata was rewritten to request a token first.
      partial: >-
        The key is true. Two long-running clusters have not been restarted since, so their
        nodes may still be on the previous enforcement state.
      weak: >-
        The key is false, or it has never been set and nobody has checked whether this
        workspace's default is already v2.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableEnforceImdsV2
        expect: '"enableEnforceImdsV2": "true"'
        caveat: >-
          A missing key is unmeasured, not a failure. Newer AWS workspaces enforce IMDSv2
          without the setting being present, so absence does not distinguish an unenforced
          workspace from one where enforcement is the platform default. The key does not
          apply to serverless.
      - how: ui
        where: Settings > Compute > Enforce AWS instance metadata v2
        expect: The toggle on, on an AWS workspace
    pitfalls:
      - >-
        Reading a missing key as disabled. That is the SAT error; this finding will not do it.
      - >-
        Setting the key and not restarting running clusters. Enforcement takes effect as
        nodes start.
      - >-
        Enabling it and discovering a Glue-catalog or old-SDK workload that still speaks
        IMDSv1, in production, with no test.
    partial_when: >-
      The key is true and running clusters have not been restarted since it was set, so the
      stored value and the nodes' current enforcement can differ.
    not_applicable_when: >-
      The workspace is not on AWS, so there is no IMDSv2 flag.
    references:
      - https://docs.databricks.com/aws/en/admin/cloud-configurations/aws/imdsv2
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableEnforceImdsV2 to true on each AWS workspace, test any workload that reads
        instance metadata, then restart the running clusters.
      depends_on:
        - >-
          An isolated AWS Glue catalog needs the documented Spark conf exception, not the
          flag left false for the whole workspace.
        - >-
          A workspace whose key is missing and whose creation date is recent may already
          enforce; confirm on a test cluster before treating absence as work to do.
      path:
        - >-
          Read the key. false is the first change; missing is a check, not a flip.
        - >-
          Upgrade old AWS SDKs and rewrite metadata fetches to request a token, then set
          true.
        - >-
          Restart running classic clusters and watch for MetadataNoToken in CloudWatch if
          you have it.
      costs:
        - >-
          A workload still on IMDSv1 fails at start after enforcement, which is why the
          test cluster comes first.
        - >-
          The restart is the same cost as any other image change, and it is what makes the
          flag true on the nodes rather than only in workspace-conf.
      retain: >-
        The get-status line for enableEnforceImdsV2, dated, showing true — or a note that
        the key is absent and how you confirmed enforcement another way.
      revisit: >-
        A new AWS workspace, a workload that starts fetching instance metadata, or a cluster
        that has been up since before the flag was set. Failing those, when you next rotate
        instance profiles.

  # Enable verbose audit logs (on Azure, diagnostic logs)
  # rest-api: enableVerboseAuditLogs. Secure true. whenAbsent enforcement — unset means off.
  SCP-04-09:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enableVerboseAuditLogs is the stored flag that adds notebook and SQL command text to
      the audit trail. The finding reports whether that key is true. Unset means the extra
      events are not being recorded.
    matters: >-
      Without the extra events, the audit log records that someone was in the workspace, not
      what they ran. An investigation that needs the command text cannot invent it later.
    good:
      - enableVerboseAuditLogs is the string true, not missing and not false.
      - A query for notebook runCommand or SQL commandSubmit in the last week returns rows.
      - Log volume and retention were sized for the extra events before the flag was flipped.
      - On Azure, the workspace diagnostic setting is decided as its own surface, not inferred from this key.
    examples:
      strong: >-
        enableVerboseAuditLogs is true. Last week's audit extract includes runCommand rows
        with commandText, and the security group already holds the grant to read them.
      partial: >-
        The key is true. Nobody has queried runCommand since it was set, so it is not known
        whether the extra events are arriving or being dropped by retention.
      weak: >-
        The key has never been set. Verbose events are off, which is the product default.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableVerboseAuditLogs
        expect: '"enableVerboseAuditLogs": "true"'
        caveat: >-
          A missing key is scored as off — verbose logging does not enable itself. This is
          not the account log-delivery configuration and not the system-table recency
          finding.
      - how: sql
        where: |-
          select action_name, count(*) as events
          from system.access.audit
          where event_date >= current_date() - 7
            and action_name in ('runCommand', 'commandSubmit', 'commandFinish')
          group by all
          order by events desc
        expect: >-
          Rows for those action names if people have been running notebooks or SQL. Zero
          rows with an active workspace means the flag is not doing what the key claims, or
          the events are not in this table yet
        caveat: >-
          Zero is unmeasured if the workspace was idle. commandText appears only when the
          flag is on; this query counts events, not whether the text field is populated.
      - how: ui
        where: Settings > Advanced > Verbose Audit Logs
        expect: The toggle on
    pitfalls:
      - >-
        Turning the flag on during an incident and expecting to see the command that caused
        it. Events start from that moment.
      - >-
        Pointing at Azure diagnostic logs as this key. The title mentions them; the collector
        reads enableVerboseAuditLogs.
      - >-
        Enabling verbose logging into a destination that cannot hold the volume, then reading
        a gap as a quiet afternoon.
    partial_when: >-
      The key is true and the extra action names have not been seen in the audit table, or
      the key is true and only account admins can read the events it produces.
    references:
      - https://docs.databricks.com/aws/en/admin/account-settings/verbose-logs
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableVerboseAuditLogs to true, confirm runCommand or commandSubmit rows appear
        after a day of ordinary work, and make sure the people who investigate already have
        SELECT on the audit schema.
      depends_on:
        - >-
          A workspace whose audit volume is already expensive wants the destination sized
          first — verbose logging is several times the events, which is the point.
        - >-
          Azure diagnostic settings are configured on the workspace resource; do not treat
          this key as that toggle.
      path:
        - >-
          Read the key. Missing or false is the change.
        - >-
          Flip it, then wait for a working day and query the three action names.
        - >-
          If the rows are missing on a busy workspace, the delivery path — not the toggle —
          is the next control.
      costs:
        - >-
          Verbose events include command text, which is what makes an investigation possible
          and also several times the log volume and a broader grant question.
        - >-
          The flag does not backfill. The first week after enablement is a thin record.
      retain: >-
        The get-status line showing true, and a dated count of runCommand / commandSubmit
        events from the following week.
      revisit: >-
        A new workspace (the key starts unset), an audit-volume surprise, or a SIEM that
        started dropping events. Failing those, quarterly with the other audit controls.

  # Workspace Unity Catalog metastore assignment
  # derived: census rows are the assignment. Do not say all tables are governed.
  SCP-04-10:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      This workspace is assigned to a Unity Catalog metastore. The assessment observes that
      by reading system.information_schema, which resolves through the assignment, so rows
      in it are the assignment.
    matters: >-
      A workspace with no assignment cannot govern objects in Unity Catalog. Grants, lineage
      and the rest of this assessment have nothing to attach to.
    good:
      - The census signal collected, which is the assignment.
      - The evidence names how many tables that metastore governs, without claiming that is the estate.
      - Adoption of those objects is a different control — DG-01-02 — and is not inferred here.
      - Hive residue, if it exists, is not disproved by this pass.
    examples:
      strong: >-
        The workspace was assigned at creation. The finding says assigned and names the table
        count the metastore governs. Hive managed tables, if any, are tracked elsewhere.
      partial: >-
        The workspace is assigned and most new objects land in Unity Catalog, but a Hive
        warehouse still holds tables this finding does not mention.
      weak: >-
        The census never collected. The assignment cannot be observed from here, and the
        rest of the governance numbers are missing with it.
    verify:
      - how: sql
        where: |-
          select current_metastore() as metastore_id,
          (select count(*) from system.information_schema.tables
           where table_schema <> 'information_schema') as tables_visible
        expect: >-
          A metastore id and a table count. The count is what this metastore can see, not
          what the workspace stored before it was assigned
        caveat: >-
          A result here is the assignment. It is not "all tables are governed". The app used
          to phrase it that way and the sentence was false: information_schema cannot see
          the legacy metastore.
      - how: cli
        where: databricks metastores current
        expect: A metastore id for this workspace, not an error that none is assigned
    pitfalls:
      - >-
        Reading "assigned, and governing N tables" as "the estate is in Unity Catalog". N is
        what this metastore holds.
      - >-
        Treating a pass here as a pass on Hive mounts, DBFS root tables, or workspace-registry
        models. Those are other fields.
      - >-
        Asking a person to confirm the assignment after the census has already run. The
        premise of the page is the answer.
    partial_when: >-
      The workspace is assigned and a material Hive or DBFS-root residue still holds objects
      this census cannot see — assignment without adoption.
    references:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/enable-workspaces
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices
    advice:
      start_from: >-
        Assign every workspace to the metastore in its region from the account console. Do
        not read the assignment as the migration.
      depends_on:
        - >-
          A region with no metastore needs the metastore created first — one per region, and
          a workspace cannot be assigned across that line.
        - >-
          Adoption of existing tables is DG-01-02; do not expand this control to count Hive
          objects it cannot see.
      path:
        - >-
          If the census collected, the assignment is already true. Stop treating it as a
          project.
        - >-
          If it did not, assign the workspace from the account console, then rerun the
          assessment.
        - >-
          Then look at DG-01-02 for what the metastore actually governs.
      costs:
        - >-
          Assignment is an account-admin action and is the easy half. Moving the tables is
          the rest of the year.
        - >-
          A workspace assigned to the wrong region's metastore cannot be pointed at another
          without a move.
      retain: >-
        The finding's evidence line — assigned, and governing N tables — dated, without
        rewriting N as "all".
      revisit: >-
        A new workspace (it needs its own assignment), a metastore created in a new region,
        or a census that stops collecting. Failing those, when you next review adoption.

  # Limit the lifetime of metastore Delta Sharing recipient token
  # rest-api: delta_sharing_recipient_token_lifetime_in_seconds and delta_sharing_scope.
  # Criteria flags INTERNAL_AND_EXTERNAL with a long lifetime. INTERNAL is not that flag.
  SCP-04-11:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      When delta_sharing_scope is INTERNAL_AND_EXTERNAL, the metastore's
      delta_sharing_recipient_token_lifetime_in_seconds is a bounded number, so a recipient
      token minted under that metastore cannot be issued with no end.
    matters: >-
      A recipient token is a bearer credential on the share. With no lifetime on the
      metastore, a token minted today can remain valid until someone revokes it by hand.
    good:
      - delta_sharing_scope is INTERNAL, or it is INTERNAL_AND_EXTERNAL and the lifetime field is a number of seconds you can convert to days.
      - The lifetime is short enough that a leaked token dies before the next review.
      - Per-recipient expiration_time is set as well — that is a different field, on a different control.
      - Someone can name who is allowed to create a recipient.
    examples:
      strong: >-
        Scope is INTERNAL_AND_EXTERNAL and the lifetime is 90 days in seconds. New open
        recipients inherit that ceiling, and last quarter's tokens were rotated before it.
      partial: >-
        Scope is INTERNAL_AND_EXTERNAL and a lifetime is set, but it is measured in years, so
        a minted token is still a long-lived bearer credential.
      weak: >-
        Scope is INTERNAL_AND_EXTERNAL and delta_sharing_recipient_token_lifetime_in_seconds
        is missing or zero. Open recipients can be minted with no end date.
    verify:
      - how: cli
        where: databricks metastores get-summary
        expect: >-
          delta_sharing_scope, and if it is INTERNAL_AND_EXTERNAL a finite
          delta_sharing_recipient_token_lifetime_in_seconds
        caveat: >-
          The lifetime field is often absent when scope is INTERNAL. That absence is not a
          missing ceiling — the criteria flags the lifetime only when scope is
          INTERNAL_AND_EXTERNAL. Do not invent a default number for a missing field.
      - how: ui
        where: Catalog > the metastore > Delta Sharing, recipient token lifetime
        expect: A number of days, if open sharing is on; not-applicable if scope is internal only
    pitfalls:
      - >-
        Scoring a missing lifetime as a failure while scope is INTERNAL. The collector's
        fixture looks like that: INTERNAL, and no lifetime field.
      - >-
        Setting the metastore lifetime and not looking at each recipient's expiration_time.
        Existing tokens keep the life they were minted with.
      - >-
        Pointing at Databricks-to-Databricks recipients as covered. Those use
        authentication_type DATABRICKS, not this token lifetime.
    partial_when: >-
      Open sharing is on and a lifetime is set, but the number of seconds converts to more
      than a review cycle, or the ceiling is set and existing recipient tokens predate it.
    not_applicable_when: >-
      delta_sharing_scope is INTERNAL, so this metastore is not minting open-sharing
      recipient tokens.
    references:
      - https://docs.databricks.com/aws/en/opensharing/create-recipient
      - https://docs.databricks.com/aws/en/opensharing/recipient
    advice:
      start_from: >-
        If you share outside the account, set
        delta_sharing_recipient_token_lifetime_in_seconds to 90 days or less. If you do not,
        leave scope INTERNAL and do not invent a lifetime.
      depends_on:
        - >-
          A recipient that cannot rotate inside 90 days is a named exception on that
          recipient, not a multi-year metastore ceiling.
        - >-
          Databricks-to-Databricks sharing does not use this token; do not change scope to
          INTERNAL_AND_EXTERNAL to "have something to set".
      path:
        - >-
          Read get-summary. If scope is INTERNAL, stop — this control is not-applicable.
        - >-
          If scope is INTERNAL_AND_EXTERNAL and the lifetime field is missing or huge, set
          a number of seconds you can defend.
        - >-
          Then list recipients and look at each expiration_time. The ceiling does not
          shorten tokens already minted.
      costs:
        - >-
          Shortening the ceiling forces every open recipient to rotate, which is a
          conversation with each consumer.
        - >-
          Opening the scope to set a lifetime is how an internal metastore becomes an
          external one.
      retain: >-
        The get-summary output, dated, showing scope and — when external — the lifetime in
        seconds.
      revisit: >-
        Scope changing to INTERNAL_AND_EXTERNAL, a new open recipient, or a request to
        lengthen the ceiling. Failing those, quarterly.

  # Delta Sharing IP access lists
  # rest-api: TOKEN recipients, ip_access_list.allowed_ip_addresses:count
  SCP-04-12:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      Every recipient whose authentication_type is TOKEN has an ip_access_list with at least
      one allowed address. A bearer token with no address restriction works from wherever it
      is presented.
    matters: >-
      A leaked open-sharing token is enough. Without an IP list, the copy works from any
      network the thief can reach, including one you will never see in the workspace IP
      allowlist.
    good:
      - Each TOKEN recipient shows a non-zero ip_access_list.allowed_ip_addresses count.
      - DATABRICKS-authenticated recipients are not in this check — they are a different authentication_type.
      - The addresses on the list are ones the recipient actually egresses from, not a /0.
      - Someone reviews the list when the recipient's network changes.
    examples:
      strong: >-
        Two TOKEN recipients exist. Each has an allowed-address list of the consumer's NAT
        ranges, and a change to that range last quarter was a ticket, not a guess.
      partial: >-
        Most TOKEN recipients have a list. One partner still has an empty
        ip_access_list because "they are on a VPN" that was never written down.
      weak: >-
        TOKEN recipients exist and allowed_ip_addresses is empty or missing on each. The
        token is the only control.
    verify:
      - how: cli
        where: databricks recipients list
        expect: >-
          For each row whose authentication_type is TOKEN, ip_access_list.allowed_ip_addresses
          is present and non-empty
        caveat: >-
          Recipients with authentication_type DATABRICKS are outside this criterion. An empty
          recipient list is not a pass on IP lists — there are no TOKEN recipients to flag.
      - how: ui
        where: Catalog > Delta Sharing > Recipients, each token-authenticated recipient's IP access list
        expect: At least one allowed address, not an empty list and not 0.0.0.0/0 unless that is a written exception
    pitfalls:
      - >-
        Putting 0.0.0.0/0 on the list so the field is "set". The count is then non-zero and
        the restriction is none.
      - >-
        Restricting workspace IP access and assuming recipient tokens inherit it. They do not.
      - >-
        Checking only activated recipients. A token that has not been used still works from
        anywhere it is copied.
    partial_when: >-
      Some TOKEN recipients have a real allowed-address list and at least one still has a
      zero count, or the lists exist and include a default-allow range.
    not_applicable_when: >-
      There are no TOKEN-type recipients, so there is no bearer token to restrict by address.
    references:
      - https://docs.databricks.com/aws/en/opensharing/recipient
      - https://docs.databricks.com/aws/en/opensharing/create-recipient
    advice:
      start_from: >-
        Do not mint a TOKEN recipient without an allowed-address list. Put the consumer's
        egress CIDRs on it before you send the token.
      depends_on:
        - >-
          A recipient whose address changes weekly wants Databricks-to-Databricks sharing
          instead, not a list you will always be behind.
        - >-
          A partner on many NATs needs their list maintained by them, in a ticket, not a
          /8 you added to stop the finding.
      path:
        - >-
          List recipients. Keep authentication_type TOKEN.
        - >-
          For each empty ip_access_list, get the egress ranges from the recipient, then set
          the list.
        - >-
          Re-issue the token only if the existing one was already copied; the list applies
          to presentations from then on.
      costs:
        - >-
          A wrong CIDR is an outage for the recipient and a support ticket for you, which is
          why they supply the ranges.
        - >-
          The list is not the workspace IP access list and is not updated when that one is.
      retain: >-
        A dated recipients list showing authentication_type and the allowed-address count
        for each TOKEN row.
      revisit: >-
        A new TOKEN recipient, a partner network change, or a token that starts appearing
        from an address not on the list. Failing those, quarterly.

  # Delta Sharing token expiration
  # rest-api: TOKEN recipients, expiration_time missing
  SCP-04-13:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      Every recipient whose authentication_type is TOKEN has an expiration_time set. A
      missing expiration_time is a token with no end date, not missing data.
    matters: >-
      A recipient token with no expiration_time is a permanent external grant on whatever
      the share contains, until a person revokes it. The metastore lifetime ceiling does
      not write this field on tokens already minted.
    good:
      - Each TOKEN recipient has expiration_time populated.
      - Rotation happens before that timestamp, and the new token is sent through the same channel as the first.
      - Recipients with authentication_type DATABRICKS are not scored here.
      - The metastore lifetime (SCP-04-11) is set as well, so new tokens cannot be minted without an end.
    examples:
      strong: >-
        Three TOKEN recipients, each with an expiration_time inside the next quarter, and a
        calendar that issues a replacement the week before.
      partial: >-
        New recipients have expiration_time. Two minted last year still show none, and
        nobody has re-issued them.
      weak: >-
        TOKEN recipients exist and expiration_time is empty on each. The share is as
        permanent as the token's holder.
    verify:
      - how: cli
        where: databricks recipients list
        expect: >-
          For each authentication_type TOKEN row, expiration_time is present
        caveat: >-
          This is the recipient's expiration_time, not
          delta_sharing_recipient_token_lifetime_in_seconds on the metastore. A lifetime on
          the metastore binds tokens minted after it was set. DATABRICKS recipients have no
          bearer token to expire.
      - how: ui
        where: Catalog > Delta Sharing > Recipients > each token-authenticated recipient, the token expiration
        expect: A date, not a blank
    pitfalls:
      - >-
        Setting the metastore lifetime and calling existing tokens fixed. Their
        expiration_time does not change.
      - >-
        Rotating by sending a new token and leaving the old one unexpired. Both work until
        the old expiration_time, if it has one.
      - >-
        Reading tokens:count as proof of expiry. The count says how many tokens exist, not
        whether any of them ends.
    partial_when: >-
      New TOKEN recipients have expiration_time and older ones still do not, or dates exist
      and they are years out with no rotation in between.
    not_applicable_when: >-
      There are no TOKEN-type recipients, so there is no expiration_time to set.
    references:
      - https://docs.databricks.com/aws/en/opensharing/create-recipient
      - https://docs.databricks.com/aws/en/opensharing/recipient
    advice:
      start_from: >-
        Give every TOKEN recipient an expiration_time inside 90 days, and re-issue before
        that date. Do not rely on the metastore ceiling to backfill it.
      depends_on:
        - >-
          A recipient that cannot take a new token inside 90 days gets a written exception
          and a named expiry, not a blank expiration_time.
        - >-
          Databricks-to-Databricks recipients are not in this list; do not add a fake
          expiration to them.
      path:
        - >-
          List TOKEN recipients. The ones with no expiration_time are the first re-issues.
        - >-
          Create a new token with a date, send it, confirm the recipient has moved, then
          revoke the undated one.
        - >-
          Confirm the metastore lifetime is set so the next mint cannot repeat this.
      costs:
        - >-
          Each re-issue is a coordination with the recipient. Revoking first is how their
          pipeline fails on a Monday.
        - >-
          Two valid tokens during cutover is a wider window; keep it short and dated.
      retain: >-
        A dated recipients list with authentication_type and expiration_time on every TOKEN
        row.
      revisit: >-
        A new TOKEN recipient, a metastore lifetime change, or an expiration_time that
        passed without a replacement. Failing those, quarterly.

  # Existence of Unity Catalog metastores
  # derived: cannot fail. Census in hand is the metastore.
  SCP-04-14:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      A Unity Catalog metastore exists for this workspace. The assessment observes that by
      having read system.information_schema at all. This control cannot fail: without a
      metastore the census is absent, and the finding is unmeasured with that error.
    matters: >-
      The governance numbers on this page are Unity Catalog views. If no metastore exists,
      those numbers were never collected, and the rest of the pillar is a blank.
    good:
      - The census collected, which is the existence.
      - Evidence names catalog and schema counts the metastore holds.
      - A pass here is the premise, not a maturity score — assignment is the next control, adoption is DG-01-02.
      - A missing census is reported as unmeasured, not as a failure you can remediate from the finding alone.
    examples:
      strong: >-
        The metastore was created with the first workspace in the region. The finding
        passes and names the catalog and schema counts. Nobody is treating that pass as
        "we are done with Unity Catalog".
      partial: >-
        A metastore exists and this workspace can see it, while a second region still has
        workspaces and no metastore — a fact this finding, scoped here, will not show.
      weak: >-
        The census is unmeasured. The collection error is the only evidence, and it is the
        one to open.
    verify:
      - how: sql
        where: |-
          select current_metastore() as metastore_id,
          (select count(*) from system.information_schema.catalogs) as catalogs,
          (select count(*) from system.information_schema.schemata) as schemas
        expect: >-
          A metastore id and non-zero catalog and schema counts — or an error, which is
          unmeasured rather than a fail
        caveat: >-
          This query succeeding is the control. It cannot return a row that means "no
          metastore". A permission error and a missing metastore look similar from here;
          the collection error on the finding is what distinguishes them.
      - how: cli
        where: databricks metastores list
        expect: A metastore in this workspace's region
    pitfalls:
      - >-
        Treating a pass as adoption. Existence is the premise; most of the estate can still
        sit outside this metastore.
      - >-
        Creating a metastore with a storage root "so it is complete". A metastore-level root
        applies to every catalog under it; give each catalog its own managed location.
      - >-
        Scoring an unmeasured census as a fail to "be conservative". The catalogue says it
        cannot fail, and inventing a failure hides the collection error.
    partial_when: >-
      A metastore exists for this workspace and another region you run has not created one
      yet — this finding will still pass here.
    references:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/create-metastore
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/enable-workspaces
    advice:
      start_from: >-
        Create one metastore per region, without a metastore-level storage root, and assign
        the workspaces in that region to it. If this finding already passed, the existence
        work is done.
      depends_on:
        - >-
          A second region is a second metastore, not a cross-region assignment.
        - >-
          Catalog-level managed locations keep one team's data out of another's bucket;
          a metastore root does the opposite.
      path:
        - >-
          If the census collected, stop. Create nothing.
        - >-
          If it did not, read the collection error. A missing metastore and a missing
          grant are different fixes.
        - >-
          Create the metastore in the workspace's region, assign the workspace, rerun.
      costs:
        - >-
          A metastore-level root is hard to unwind and is the older pattern the caveat
          exists to stop.
        - >-
          Creating a metastore you do not then assign leaves the next control unmeasured
          for the same reason this one was.
      retain: >-
        The finding's pass evidence — catalog and schema counts — or the collection error
        if it did not pass.
      revisit: >-
        A workspace in a region that has no metastore, or a census that stops. Failing
        those, when you add a region.

  # Delegation of the Unity Catalog metastore admin to a group
  # rest-api: metastores[].owner and .created_by. Heuristic: equal, 'System user', or contains @.
  SCP-04-15:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin, with the metastore admin
    means: >-
      The metastore owner is a group, not the principal who created it. The collector reads
      owner and created_by. The criterion flags owner equal to created_by, the string
      'System user', or an owner that contains @.
    matters: >-
      Metastore admin is the privilege that can grant everything else back. When it is still
      the creator, that person leaving is a lock-out, and while they stay it is a privilege
      no one else can pick up.
    good:
      - owner is a group name, not equal to created_by.
      - owner does not contain @ — that is the heuristic this criterion uses for a personal account, not proof of one.
      - The group has more than one member who still needs the role.
      - Account admin and metastore admin are different people or groups.
    examples:
      strong: >-
        owner is `metastore-admins`, created_by is a service principal from the original
        apply, and three people in the group can still grant.
      partial: >-
        owner was changed from the creator to a group, and that group has one member — the
        same person who created it.
      weak: >-
        owner and created_by are the same email. The metastore is administered by the
        person who clicked Create.
    verify:
      - how: cli
        where: databricks metastores list
        expect: >-
          owner differs from created_by, is not the string 'System user', and does not
          contain @
        caveat: >-
          An @ in owner is the criterion's stand-in for a personal account. A group whose
          name happens to include @ would also flag. A UUID owner is not classified as a
          group by this check — it is only "not those three shapes".
      - how: ui
        where: Catalog > the metastore's owner
        expect: A group you can name the members of, not the creator's user
    pitfalls:
      - >-
        Renaming the owner to a group of one. The field no longer matches created_by and
        the lock-out is unchanged.
      - >-
        Leaving owner as 'System user' after an automated create. That string is an
        explicit flag in the criterion.
      - >-
        Granting metastore admin to every workspace admin so "someone can always do it".
        That is the opposite delegation.
    partial_when: >-
      owner is a group and that group has a single member, or owner was changed and
      created_by is still the only person who knows the role is theirs.
    references:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices
    advice:
      start_from: >-
        Set the metastore owner to a group of at least two people who are not the account
        admin, then confirm a second member can still grant after the first is removed.
      depends_on:
        - >-
          A metastore created by automation can keep a service principal as created_by;
          the owner should still be the group, not that principal.
        - >-
          A one-person platform team is a dated exception and a recruiting problem, not a
          reason to leave owner as an email.
      path:
        - >-
          Read owner and created_by. If they match, or owner contains @, or owner is
          'System user', that is the change.
        - >-
          Create the group in the identity provider, put two people in it, then transfer
          ownership.
        - >-
          Remove the original owner from day-to-day grants so the group is the path, not a
          label.
      costs:
        - >-
          A wrong group is a silent over-grant of the most powerful role in the metastore.
        - >-
          The transfer is an account-admin action and is usually blocked on who is allowed
          to hold the group, not on the API.
      retain: >-
        The dated metastores list showing owner and created_by, and the identity-provider
        group membership beside it.
      revisit: >-
        The owner group shrinking to one, a metastore created in a new region, or the
        original creator leaving. Failing those, quarterly.

  # Init scripts stored in DBFS
  # system-table: dbfs_init_script_count. Unrecognised destination counts as governed.
  SCP-04-16:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator
    means: >-
      No cluster runs an init script whose destination is a DBFS root. The finding counts
      destinations that match dbfs:/ or /dbfs/. Destinations under /Volumes or /Workspace
      are not counted; an unrecognised destination is treated as governed.
    matters: >-
      An init script runs as root on every node before the cluster is usable. DBFS has no
      meaningful access control, so anyone who can write the path decides what that root
      process is.
    good:
      - Live clusters show dbfs_init_script_count of zero.
      - Remaining init scripts live on a volume or a workspace file, with write grants narrower than the cluster users.
      - Clusters whose init_scripts column is unwritten are edited so the column populates, not assumed clean.
      - Support for DBFS init scripts has been withdrawn — this is a migration as well as a hardening.
    examples:
      strong: >-
        Init scripts were copied to a volume last year. No live cluster still has a dbfs:/
        destination, and write on that volume is two platform engineers.
      partial: >-
        New clusters point at /Volumes. Two job clusters still start from dbfs:/databricks/init
        because the job definition was not edited.
      weak: >-
        Every all-purpose cluster installs from dbfs:/databricks/init, and that directory is
        writable by the users group.
    verify:
      - how: sql
        where: |-
          with current_clusters as (
            select * from system.compute.clusters
            qualify row_number() over (
              partition by workspace_id, cluster_id order by change_time desc) = 1
          )
          select cluster_name, cluster_source, init_scripts
          from current_clusters
          where delete_time is null
            and exists (
              select 1 from explode(coalesce(init_scripts, array())) as t(dest)
              where lower(dest) rlike '^(dbfs:/|/dbfs/)'
            )
          order by cluster_name
        expect: >-
          No rows. A cluster with init_scripts NULL is unmeasured, not "no scripts"
        caveat: >-
          init_scripts is an empty array when there are none, and NULL when the platform did
          not report them. Treating NULL as none would pass clusters the table could not
          see. Destinations this query does not match are not listed, including unrecognised
          ones the app counts as governed.
      - how: ui
        where: Compute > a cluster in the finding > Advanced > Init scripts
        expect: A /Volumes or /Workspace path, not dbfs:/
    pitfalls:
      - >-
        Copying the script to a volume anyone can write. Write on that volume is root on
        the cluster — the same finding, new path.
      - >-
        Removing the global /databricks/init copy and leaving cluster-scoped dbfs:/
        destinations. The security guide's folder is not the whole population.
      - >-
        Reading a clean result on clusters whose init_scripts column is NULL. The app
        reports those unmeasured.
    partial_when: >-
      At least 95% of clusters with a known init_scripts column have no DBFS destination
      and a remainder still has one, or the known set is clean and many clusters still
      have the column unwritten.
    not_applicable_when: >-
      The estate ran no classic clusters, so there are no init scripts. Serverless does
      not run them.
    references:
      - https://docs.databricks.com/aws/en/init-scripts/
      - https://docs.databricks.com/aws/en/admin/system-tables/compute
    advice:
      start_from: >-
        Copy every DBFS init script to a Unity Catalog volume, grant WRITE on that volume
        only to the platform group, and repoint each cluster. Then delete the DBFS copy.
      depends_on:
        - >-
          A script that must stay cluster-local for an air-gapped image still needs a
          governed path; DBFS is not that path.
        - >-
          Job clusters bake the destination into the job definition — edit the job, not
          only the all-purpose cluster you looked at first.
      path:
        - >-
          List live clusters whose init_scripts match dbfs:/ or /dbfs/. That is the
          backlog.
        - >-
          Create the volume, copy the files, grant narrowly, then edit each cluster or
          job.
        - >-
          Delete the DBFS originals last, so a missed pointer fails closed rather than
          silently running the old file.
      costs:
        - >-
          Every job definition that inlined a dbfs:/ destination is an edit and a test
          run.
        - >-
          Narrow write grants surprise the engineer who used to drop a new script in
          /databricks/init without asking.
      retain: >-
        The dated query of live clusters with a DBFS init destination, showing no rows,
        and the volume's privilege list.
      revisit: >-
        A job imported with a dbfs:/ init path, a new cluster created from an old
        template, or a volume grant widening. Failing those, when you next review
        cluster policies.

  # Govern model assets
  # rest-api: registered_models[].full_name. Criteria is "any models in UC".
  # system.ai.* models satisfy a naive "any" check — do not infer customer models are governed.
  SCP-04-17:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: ML platform lead, with the metastore admin
    means: >-
      Models the teams deploy are registered in Unity Catalog, so they have catalogue
      grants, lineage and an audit trail. The collector lists registered_models[].full_name
      from the Unity Catalog models endpoint.
    matters: >-
      A model in the workspace registry has no catalogue permission. Whoever can see the
      registry can load it, and there is no grant to revoke when the project ends.
    good:
      - Customer models the teams deploy have a three-level full_name in a catalog you own, not only system.ai.* foundation models.
      - The workspace model registry is empty of production aliases, or is scheduled for migration.
      - Serving endpoints load from the catalog name, not from a workspace-registry stage.
      - Grants on the model are to groups, the same way tables are.
    examples:
      strong: >-
        Production models live in `ml.prod` with group grants. Serving endpoints reference
        those full names. The workspace registry holds only abandoned experiments.
      partial: >-
        New models are registered in Unity Catalog. Two endpoints still pull from the
        workspace registry because the alias was never moved.
      weak: >-
        The models endpoint returns only system.ai.* rows — Databricks-provided foundation
        models — and the teams still register in the workspace registry.
    verify:
      - how: cli
        where: databricks registered-models list
        expect: >-
          full_name values in catalogs you own. system.ai.* rows say the endpoint works;
          they do not say your models are governed
        caveat: >-
          The criterion as written is "any models in UC". system.ai foundation models
          satisfy that literally. A non-empty list is not "ML teams register in Unity
          Catalog".
      - how: ui
        where: Catalog > Models, against Models in the workspace menu
        expect: Production names in the catalog; the workspace registry empty of what is served
    pitfalls:
      - >-
        Reading a list of system.ai.databricks-* models as a pass on governance. Those
        rows are provided by the platform.
      - >-
        Registering a copy in Unity Catalog and leaving the endpoint pointed at the
        workspace-registry stage.
      - >-
        Granting ALL PRIVILEGES on the ML catalog to the users group so "the models are
        in UC".
    partial_when: >-
      Some production models have a catalog full_name and at least one served model still
      lives only in the workspace registry, or the UC list is only system.ai.* while teams
      still register elsewhere.
    not_applicable_when: >-
      No team in this workspace trains or serves models, and nothing is registered in
      either registry.
    references:
      - https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
      - https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/migrate-models
    advice:
      start_from: >-
        Register new production models in a Unity Catalog catalog, point serving at that
        full_name, and migrate anything the endpoints still load from the workspace
        registry.
      depends_on:
        - >-
          An endpoint that can only load a workspace-registry stage stays listed until it
          is rebuilt — do not take the system.ai rows as coverage for it.
        - >-
          Foundation models in system.ai are already in Unity Catalog; they are not your
          migration.
      path:
        - >-
          List registered-models. Separate system.ai.* from names in your catalogs.
        - >-
          For each serving endpoint, read which model name it loads. Those that are not
          a catalog full_name are the backlog.
        - >-
          Register, grant, repoint, then remove the workspace-registry alias.
      costs:
        - >-
          A serving cutover is a new version and a traffic shift, not a rename.
        - >-
          Grants have to be invented; the workspace registry had none, which is why this
          finding exists.
      retain: >-
        A dated registered-models list with customer full_name values, and the endpoint
        config showing those names — not only system.ai.*.
      revisit: >-
        A new serving endpoint, a team still using the workspace registry, or a
        system.ai-only listing being treated as done. Failing those, quarterly.

  # Monitor audit logs with system tables (or see GOV-3)
  # system-table: same measurement as DG-02-02. Recency, max 2 days. 0 events = unmeasured.
  SCP-04-18:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Security operations, with the account admin
    means: >-
      Audit events are arriving in system.access.audit and the newest is no more than two
      days old. This is the same measurement as DG-02-02, scored once, read here as the
      security-monitoring requirement.
    matters: >-
      A trail that stopped last week looks like a quiet estate. The day you need it is the
      day after an incident, and a gap is permanent — the table does not backfill.
    good:
      - The newest event_time is today or yesterday, not last week.
      - Event volume is in line with the estate being used, including Unity Catalog actions, not only workspace admin.
      - Zero events in the window is reported unmeasured, not as a pass and not as a broken pipeline.
      - Someone would notice if the newest event aged past two days.
    examples:
      strong: >-
        Last event is from this morning. A scheduled query pages if the gap exceeds a day.
        Unity Catalog actions sit beside workspace ones in the same extract.
      partial: >-
        Events exist and the newest is four days old. The workspace was used on two of
        those days, so the gap is not idle time.
      weak: >-
        The table is empty in the window, or nobody has looked at max(event_time) since
        the schema was enabled.
    verify:
      - how: sql
        where: |-
          select max(event_time) as newest,
          datediff(current_date(), max(event_date)) as days_since,
          count(*) as events,
          count_if(service_name = 'unityCatalog') as unity_catalog_events
          from system.access.audit
          where event_date >= current_date() - 14
        expect: >-
          newest within two days, and a volume that matches the estate being used
        caveat: >-
          Zero events is unmeasured: the audit tables cannot be switched off, and a
          missing grant raises an error rather than an empty result, so empty means
          either no activity or delivery stopped. The app will not fail an idle
          account. This is scored with DG-02-02; a second pass is not a second
          measurement.
      - how: ui
        where: The finding's evidence line — event count, services, actors, last event
        expect: A last-event age of two days or less
    pitfalls:
      - >-
        Enabling the schema during an incident and expecting yesterday's command. Events
        start at enablement.
      - >-
        Pointing at an ENABLED log-delivery configuration as proof events are current.
        That is a different field.
      - >-
        Treating a two-day-old newest event on a busy Monday as fine because "we have
        audit on". The threshold is two days.
    partial_when: >-
      Events exist and the newest is more than two days old, which is this finding's
      partial — idle and interrupted delivery cannot be told apart from here.
    references:
      - https://docs.databricks.com/aws/en/admin/system-tables/audit-logs
      - https://docs.databricks.com/aws/en/admin/system-tables/
    advice:
      start_from: >-
        Confirm events are arriving and add one check that fires when the newest
        event_time is more than a day old. If the schema is not enabled, that is
        DG-02-02's path — enable first, then this recency is measurable.
      depends_on:
        - >-
          An estate that is genuinely idle will stay unmeasured; a second scan after
          ordinary work is what distinguishes idle from stopped delivery.
        - >-
          A retention obligation longer than the system table's own window needs the
          log-delivery copy (SCP-04-02), not a tighter recency here.
      path:
        - >-
          Read max(event_time). An error is a grant or a schema. Empty is a second
          scan after you do any work.
        - >-
          If the newest is older than two days on a used estate, follow delivery —
          system schema, then the bucket — before rewriting queries.
        - >-
          Then add the staleness page, because a silent stop looks like this finding's
          partial forever.
      costs:
        - >-
          The first day after enablement will still look stale. That is expected, not
          a failed fix.
        - >-
          A pager on a one-day gap will fire over long weekends unless you read it
          against known idle calendars.
      retain: >-
        A dated extract of newest event_time, event count, and the Unity Catalog share
        of those events.
      revisit: >-
        A new metastore, a log-delivery change, or a newest event that ages past two
        days. Failing those, weekly — this is the control that goes stale on its own.

  # Restrict workspace admins
  # rest-api: restrict_workspace_admins.status. ALLOW_ALL is the unrestricted value.
  SCP-04-19:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      restrict_workspace_admins.status is not ALLOW_ALL. ALLOW_ALL is the stored value
      that leaves the restriction off. The other documented value is
      RESTRICT_TOKENS_AND_JOB_RUN_AS.
    matters: >-
      With status ALLOW_ALL, a workspace admin can change a job's owner and its run-as
      identity to someone else, and can mint a token for a service principal they do not
      hold the user role on. The field does not say whether anyone has done that.
    good:
      - status is RESTRICT_TOKENS_AND_JOB_RUN_AS, not ALLOW_ALL.
      - disable_gov_tag_creation is decided on purpose — it is a second field on the same setting, not this criterion.
      - Account admins, not workspace admins, are the people who change this setting.
      - Service principals that jobs run as are ones the relevant admins already hold the user role on.
    examples:
      strong: >-
        status is RESTRICT_TOKENS_AND_JOB_RUN_AS. Job run-as changes now fail unless the
        admin is the new owner or holds the service-principal user role, and that was
        tested.
      partial: >-
        status is RESTRICT_TOKENS_AND_JOB_RUN_AS in production and ALLOW_ALL in the two
        sandbox workspaces that share production catalogs.
      weak: >-
        status is ALLOW_ALL, which is the value the collector's fixture shows and the
        product default.
    verify:
      - how: cli
        where: databricks settings restrict-workspace-admins get
        expect: >-
          status is RESTRICT_TOKENS_AND_JOB_RUN_AS, not ALLOW_ALL
        caveat: >-
          Report the status field. Do not infer from it that a job was or was not
          reassigned — the field is the restriction, not the history. disable_gov_tag_creation
          is a different boolean on the same object.
      - how: ui
        where: Account console > the workspace > Restrict workspace admins
        expect: The restriction on, matching RESTRICT_TOKENS_AND_JOB_RUN_AS
    pitfalls:
      - >-
        Setting the restriction and leaving jobs that already run as another user
        untouched. The field does not rewind those.
      - >-
        Reading ALLOW_ALL as "admins are doing something wrong". It is the default value,
        not an action log.
      - >-
        Changing the setting as a workspace admin. The docs say an account admin does it.
    partial_when: >-
      Production workspaces have RESTRICT_TOKENS_AND_JOB_RUN_AS and at least one
      workspace that can see production data still has ALLOW_ALL.
    references:
      - https://docs.databricks.com/aws/en/admin/workspace-settings/restrict-workspace-admins
      - https://docs.databricks.com/aws/en/jobs/privileges
    advice:
      start_from: >-
        Set restrict_workspace_admins.status to RESTRICT_TOKENS_AND_JOB_RUN_AS on every
        workspace, starting with the ones that run production jobs.
      depends_on:
        - >-
          A break-glass procedure that must reassign a job while the owner is away stays
          an account-admin action, not ALLOW_ALL left on for convenience.
        - >-
          Sandboxes that cannot see production data can stay ALLOW_ALL if that is written
          down; sandboxes that share a catalog cannot.
      path:
        - >-
          Read the status field on each workspace. ALLOW_ALL is the backlog.
        - >-
          Tell workspace admins what they will lose — reassigning run-as, minting tokens
          for principals they do not own — then set the restriction.
        - >-
          Confirm a workspace admin can still change a job they own to themselves, and
          cannot change one to a colleague.
      costs:
        - >-
          The first time someone used "change owner" to cover leave, the restriction
          looks like an outage. The substitute is an account admin, which is a ticket.
        - >-
          The setting is per workspace and is changed from the account console, so it is
          easy to do one and think you did them all.
      retain: >-
        The dated get output for restrict_workspace_admins.status on each workspace.
      revisit: >-
        A new workspace (it starts at ALLOW_ALL), a request to reassign a job as a
        workspace admin, or a sandbox that was given a production catalog. Failing
        those, quarterly.

  # Automatic cluster update
  # rest-api: automatic_cluster_update_workspace.enabled. Do not say clusters are unpatched.
  SCP-04-20:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      automatic_cluster_update_workspace.enabled is true. The finding reports that boolean.
      It does not report whether a given cluster has received a host-OS image since it
      started.
    matters: >-
      Classic compute picks up host-OS and container patches when it is restarted onto a
      new image. With the setting false, that restart happens only when a person schedules
      it.
    good:
      - enabled is true, not false.
      - The maintenance window is one you can name, and restart_even_if_no_updates_available is a deliberate choice.
      - can_toggle is understood — some profiles lock the setting.
      - Serverless is out of scope; this setting applies to classic compute.
    examples:
      strong: >-
        enabled is true. The window is the first Sunday of the month. Teams know attached
        notebooks will drop, and the last window's restart list was reviewed.
      partial: >-
        enabled is true in production and false in the workspace that still holds a copy
        of production data for "experiments".
      weak: >-
        enabled is false, which is the value the collector's fixture shows.
    verify:
      - how: cli
        where: databricks settings automatic-cluster-update get
        expect: >-
          automatic_cluster_update_workspace.enabled is true
        caveat: >-
          Report enabled. Do not conclude that clusters are patched or unpatched — the
          field is the setting, not a last-image date. Enabling it adds the Enhanced
          Security and Compliance add-on and needs the Enterprise tier. AWS and Azure
          only in this catalogue.
      - how: ui
        where: Account console > the workspace > Automatic cluster update
        expect: Enabled, with a maintenance window you recognise
    pitfalls:
      - >-
        Pointing at a recent start_time as proof this setting is on. A person can restart
        a cluster without the setting.
      - >-
        Enabling it without telling the people who leave notebooks attached over the
        weekend. The window is a restart.
      - >-
        Reading can_toggle false as a failure. Some compliance profiles force the setting
        on; the boolean to report is still enabled.
    partial_when: >-
      enabled is true on the production workspace and false on another workspace that can
      reach the same data, or enabled is true and the window has never been communicated.
    not_applicable_when: >-
      The workspace runs no classic compute, so there is no host image for this setting
      to rotate.
    references:
      - https://docs.databricks.com/aws/en/admin/clusters/automatic-cluster-update
      - https://docs.databricks.com/aws/en/security/privacy/enhanced-security-compliance
    advice:
      start_from: >-
        Set automatic_cluster_update_workspace.enabled to true, pick a weekly or monthly
        window people can plan around, and say so before the first restart.
      depends_on:
        - >-
          A compliance security profile that already forces this on needs only the window
          choosing, not another flip.
        - >-
          A workspace that cannot take the add-on cost stays on a documented manual
          restart calendar (SCP-04-03), not a silent false.
      path:
        - >-
          Read enabled. false is the change; tell the teams the window first.
        - >-
          Set true and confirm the next window on the account console.
        - >-
          After that window, spot-check start_time on a handful of classic clusters —
          the setting does not print a patched-or-not on each row.
      costs:
        - >-
          The add-on is a line on the bill, which is why this is an account-admin
          decision and not a workspace-admin toggle.
        - >-
          The window restarts classic compute. In-memory state and attached notebooks
          go with it.
      retain: >-
        The dated get output showing enabled true, and the window (frequency, start)
        beside it.
      revisit: >-
        A new workspace, a compliance-profile change that forces or unlocks the
        setting, or a window that was skipped. Failing those, quarterly.

  # Disable legacy features for new workspaces
  # rest-api: disable_legacy_features.value. Governs workspaces created from now on.
  SCP-04-21:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      disable_legacy_features.value is true at the account. The setting applies to
      workspaces created after it is enabled. It does not change workspaces that already
      exist.
    matters: >-
      A new workspace created with the default can still reach DBFS root, the Hive
      metastore, no-isolation shared clusters, and pre-13.3 LTS runtimes. Those are the
      paths the rest of this principle spends its time closing.
    good:
      - value is true, not false.
      - Existing workspaces are reviewed on their own controls — this field is not a statement about them.
      - People who create workspaces know the setting is on, so they do not file the first-day Hive ticket as an outage.
      - Where HIPAA or PCI-DSS regulated data will be processed, the compliance security profile is a separate enablement on the workspace, documented on those standard pages.
    examples:
      strong: >-
        value is true. The last three workspaces were created after it, and none of them
        offered DBFS root or a no-isolation cluster. Older workspaces are tracked on
        their own findings.
      partial: >-
        value is true, and two workspaces created last year still have Hive and DBFS
        root because the setting does not reach back.
      weak: >-
        value is false, which is the collector's fixture. New workspaces still arrive
        with the legacy paths available.
    verify:
      - how: cli
        where: databricks account settings disable-legacy-features get
        expect: >-
          disable_legacy_features.value is true
        caveat: >-
          Report the value. A true does not mean existing workspaces have lost Hive or
          DBFS root. A false does not mean those workspaces are using them. HIPAA and
          PCI-DSS pages require the compliance security profile for regulated data;
          this flag is not that profile.
      - how: ui
        where: Account console > Settings > Disable legacy features
        expect: The setting on
    pitfalls:
      - >-
        Setting value true and closing the Hive findings on old workspaces. They are
        unchanged.
      - >-
        Pointing at this flag as the HIPAA or PCI-DSS control. Those pages name the
        compliance security profile, which is a different setting and is not reversible
        once regulated data has been processed.
      - >-
        Creating a workspace "just to test" before the flag is on, then keeping it.
    partial_when: >-
      value is true and the workspaces you actually run were created before it, so the
      account default is right and the estate still has the legacy paths.
    references:
      - https://docs.databricks.com/aws/en/admin/account-settings/legacy-features
      - https://docs.databricks.com/aws/en/security/privacy/hipaa
      - https://docs.databricks.com/aws/en/security/privacy/pci
    advice:
      start_from: >-
        Set disable_legacy_features.value to true before the next workspace is created.
        Then close Hive, DBFS root and no-isolation on the workspaces you already have,
        using those controls, not this one.
      depends_on:
        - >-
          A workspace that must process HIPAA or PCI-DSS regulated data also needs the
          compliance security profile on that workspace — this account flag is not a
          substitute.
        - >-
          A training workspace that still teaches Hive is created only if you accept
          that it will not get the legacy paths once the flag is on.
      path:
        - >-
          Read the value. false is the first change, and it is cheap.
        - >-
          Tell whoever creates workspaces, then flip it.
        - >-
          Open the SCP-04-05, SCP-04-07 and related findings on the workspaces that
          predate it — they did not move.
      costs:
        - >-
          The first CREATE TABLE that expected Hive will fail in a new workspace, which
          is the point and also a support ticket if nobody was told.
        - >-
          The flag does not migrate anything. The cost of the estate you already have
          sits on the other rows.
      retain: >-
        The dated get output showing value true, and the creation dates of workspaces
        that predate it.
      revisit: >-
        A new workspace (confirm it was created after the flag), a request to process
        HIPAA or PCI-DSS data (that is the profile, not this flag), or an old workspace
        being rebuilt. Failing those, when you next create a workspace.

  # Jobs run as service principal
  # rest-api: run_as_user_name matching an email pattern. Do not say "this is a person".
  SCP-04-22:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the job owners
    means: >-
      Production jobs run as a service principal. The collector reads run_as_user_name
      and, when present, settings.run_as.user_name / service_principal_name. The criterion
      flags a run_as_user_name that matches an email pattern.
    matters: >-
      A job whose run_as_user_name looks like an email inherits everything that mailbox
      can reach, and it stops when that mailbox is disabled. The pattern is a heuristic,
      not a directory lookup.
    good:
      - Production jobs show settings.run_as.service_principal_name, or a run_as_user_name that is not email-shaped.
      - The service principal holds only the grants the job needs, not the owner's leftover access.
      - Job owners are still people; run-as is not.
      - Interactive and personal jobs can stay email-shaped if they are not the production set.
    examples:
      strong: >-
        Every scheduled production job has a service_principal_name. The principals are
        per domain, and the last owner to leave did not take a pipeline with them.
      partial: >-
        New jobs are created with a service principal. Two weekly jobs still have an
        email-shaped run_as_user_name from the engineer who first scheduled them.
      weak: >-
        run_as_user_name is an email on the production jobs. The collector's fixture
        looks like that.
    verify:
      - how: sql
        where: |-
          with current_jobs as (
            select * from system.lakeflow.jobs
            qualify row_number() over (
              partition by workspace_id, job_id order by change_time desc) = 1
          )
          select
            case when run_as ilike '%@%' then 'email-shaped' else 'not email-shaped' end as name_shape,
            count(*) as jobs
          from current_jobs
          where delete_time is null
          group by all
          order by jobs desc
        expect: >-
          Production scheduled jobs in the not-email-shaped bucket. Email-shaped is the
          criterion's heuristic, not a proof the identity is a person
        caveat: >-
          run_as can be a user email, a group, or a service-principal application id.
          The REST criterion flags the email pattern only. A UUID is not classified as
          a service principal by this query — it is only "not email-shaped". The qualify
          is required: this table keeps a row per edit.
      - how: cli
        where: databricks jobs list --expand-tasks false
        expect: >-
          Production jobs show settings.run_as.service_principal_name, or a
          run_as_user_name that does not match an email
        caveat: >-
          The listing may be truncated. A missing settings.run_as object with an
          email-shaped run_as_user_name is still the email pattern. Do not say the
          identity is a person — say the name matches the pattern.
      - how: ui
        where: Workflows > a production job > the Run as field
        expect: A service principal, not an email address
    pitfalls:
      - >-
        Changing run-as to a service principal that was granted the owner's role. The
        job still reaches everything the person could.
      - >-
        Reading a not-email-shaped run_as as a service principal. It may be a group or
        an application id; the field is the name.
      - >-
        Fixing the listing's first page and leaving the truncated remainder on emails.
    partial_when: >-
      New production jobs run as a service principal and older scheduled jobs still
      have an email-shaped run_as_user_name.
    not_applicable_when: >-
      The workspace has no jobs, so there is no run_as_user_name to flag.
    references:
      - https://docs.databricks.com/aws/en/admin/users-groups/service-principals
      - https://docs.databricks.com/aws/en/jobs/privileges
    advice:
      start_from: >-
        Create one service principal per production domain, grant it only what those
        jobs need, and set run-as to that principal on every scheduled job in the
        domain.
      depends_on:
        - >-
          A personal or training job can keep an email-shaped run-as if it is not
          scheduled against production data.
        - >-
          A partner tool that can only run as the installing user stays listed as the
          exception, with a named owner, until it can take a principal.
      path:
        - >-
          List jobs and keep those whose run_as_user_name matches *@*. Start with the
          scheduled ones.
        - >-
          Stand up the principal and its grants, set run-as, run once by hand.
        - >-
          Remove the person's extra grants that existed only so the job would work.
      costs:
        - >-
          Inventing the principal's grants is the week — they used to be "whatever
          the owner could do".
        - >-
          The first run after the change fails on the grant you forgot, which is why
          it is a hand run, not the Monday schedule.
      retain: >-
        A dated jobs list with run_as_user_name / service_principal_name for the
        production set, and the principal's grant list.
      revisit: >-
        A new scheduled job, an owner leaving, or a run_as_user_name that has become
        email-shaped again. Failing those, quarterly.

  # Jobs not granting CAN_MANAGE to non-admin principals
  # rest-api: permissions.jobs.{job_id} — not collected. Do not invent a table.
  SCP-04-23:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the job owners
    means: >-
      CAN_MANAGE on a job is held by the job owner and the admins group, not by other
      users or groups. The catalogue names the per-job permissions endpoint. This
      assessment does not collect that endpoint, so the finding is not produced from
      a table in this app.
    matters: >-
      CAN_MANAGE can edit the task and therefore change what runs as the job's run-as
      identity. A group that was given manage "so they can click Run" holds the
      authority to change the code.
    good:
      - On production jobs, CAN_MANAGE is the owner and admins, and everyone else has CAN_VIEW or CAN_MANAGE_RUN.
      - A sample of those jobs was opened, not inferred from a jobs list that has no permission field.
      - The users group does not hold CAN_MANAGE on any production job.
      - Service principals that must edit a job definition are named, few, and not the same principal the job runs as.
    examples:
      strong: >-
        Production jobs were reviewed last quarter. CAN_MANAGE is owner plus admins.
        Operators hold CAN_MANAGE_RUN. A CI principal holds CAN_MANAGE on the jobs it
        deploys, and that is written down.
      partial: >-
        New jobs inherit a tight ACL from the template. A handful of older jobs still
        grant CAN_MANAGE to an "engineers" group that most of the workspace is in.
      weak: >-
        Production jobs grant CAN_MANAGE to the users group, or nobody has opened the
        permissions dialog since the jobs were created.
    verify:
      - how: ui
        where: Workflows > a sample of production jobs > Permissions
        expect: >-
          CAN_MANAGE limited to the owner and admins; other principals at CAN_VIEW or
          CAN_MANAGE_RUN
        caveat: >-
          This endpoint is not in the collected probe set. There is no jobs-permissions
          table in this assessment to query. A jobs list without permissions says
          nothing about CAN_MANAGE.
      - how: cli
        where: databricks jobs get-permissions --job-id <job-id>
        expect: >-
          No access_control_list entry at CAN_MANAGE except the owner and the admins
          group
        caveat: >-
          The catalogue criterion also excludes creator_user_name. An owner who is not
          the creator is still an owner. Check the permission_level field; do not infer
          manage from being able to see the job.
      - how: by-hand
        where: Ask who can change what a production job runs, other than the owner and admins
        expect: A short named list, or nobody
    pitfalls:
      - >-
        Granting CAN_MANAGE so a team can click Run. CAN_MANAGE_RUN is that button.
      - >-
        Reading a clean jobs list as a clean ACL. The list has job_id and name; it
        does not have permission_level.
      - >-
        Giving the run-as service principal CAN_MANAGE on its own job. The principal
        can then rewrite the task it executes.
    partial_when: >-
      New production jobs are tight and a residue of older jobs still grant CAN_MANAGE
      to a broad group, or a CI principal holds CAN_MANAGE and that exception has not
      been written down.
    not_applicable_when: >-
      The workspace has no jobs, so there is no CAN_MANAGE grant to review.
    references:
      - https://docs.databricks.com/aws/en/jobs/privileges
      - https://docs.databricks.com/aws/en/security/auth/access-control
    advice:
      start_from: >-
        On every production job, leave CAN_MANAGE with the owner and admins. Give
        operators CAN_MANAGE_RUN. If CI must edit the definition, grant CAN_MANAGE to
        that one principal and write it down.
      depends_on:
        - >-
          A team that deploys through bundles already has a principal; use that one,
          not the users group.
        - >-
          Personal jobs can stay looser if they cannot reach production data or
          production run-as identities.
      path:
        - >-
          Open permissions on the production jobs you can name. The jobs list will not
          do this for you.
        - >-
          Demote broad CAN_MANAGE grants to CAN_MANAGE_RUN or CAN_VIEW.
        - >-
          Record any remaining non-admin CAN_MANAGE as a named exception.
      costs:
        - >-
          The first person who used Manage as a synonym for Run will lose the edit,
          which is the finding working.
        - >-
          Reviewing every job is a day on a large workspace, and this app will not
          produce the list — you are sampling until that probe is collected.
      retain: >-
        A dated note of the production jobs sampled, each with who holds CAN_MANAGE,
        and the get-permissions output for any exception.
      revisit: >-
        A new production job, a group that asks for Manage so they can "operate", or
        a CI principal changing. Failing those, quarterly — and whenever this probe
        starts being collected.

  # Global libraries
  # rest-api: statuses[].library_statuses[].is_library_for_all_clusters. No resolver.
  # SAT scores any true. The finding, when written, will be that boolean — not whether the library is needed.
  SCP-05-01:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      is_library_for_all_clusters is the boolean on each library_status from
      libraries/all-cluster-statuses. true means that library is installed on every
      cluster in the workspace, including ones created later. There is no resolver yet.
    matters: >-
      A library nobody attached to a cluster still starts on every cluster. A leftover
      coordinate, or one with a known CVE, is then present on interactive and job
      compute alike.
    good:
      - is_library_for_all_clusters is false on every library_status, or the listing is empty.
      - Libraries a workload needs are cluster- or notebook-scoped, so a cluster that does not need them does not load them.
      - Someone can name each remaining all-cluster library and why it is still there.
      - New installs go through a cluster policy or a job library, not the workspace-wide list.
    examples:
      strong: >-
        all-cluster-statuses shows no library_status with is_library_for_all_clusters
        true. Job clusters declare their own Maven coordinates; notebooks use notebook-
        scoped installs.
      partial: >-
        Two all-cluster libraries remain from the first year. Both are named, and one
        still has is_library_for_all_clusters true because a shared notebook imports it.
      weak: >-
        Several library_status rows have is_library_for_all_clusters true and nobody
        can say which notebook still needs them.
    verify:
      - how: cli
        where: databricks libraries all-cluster-statuses
        expect: >-
          No library_status with is_library_for_all_clusters true, or only ones you
          can account for by name
        caveat: >-
          This control has no resolver yet. The SAT criterion is any true. The
          collector also holds status and the library keys; those do not change the
          boolean.
      - how: ui
        where: Compute > the workspace library list, anything marked installed on all clusters
        expect: Empty, or a short named set
    pitfalls:
      - >-
        Reading a failed install status as "not present". The boolean is still true;
        the next cluster will try again.
      - >-
        Removing the library from one cluster and leaving is_library_for_all_clusters
        true, so every new cluster gets it back.
      - >-
        Treating a cluster policy library as this list. Policy libraries are a
        different install path.
    partial_when: >-
      One or two library_status rows still have is_library_for_all_clusters true and
      each has a named owner, or the listing is clean in production and true in a
      workspace that shares the same notebooks.
    references:
      - https://docs.databricks.com/aws/en/libraries/cluster-libraries
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/libraries-commands
    advice:
      start_from: >-
        Uninstall every library whose is_library_for_all_clusters is true. Put the
        ones a job still needs on that job or on a cluster policy.
      depends_on:
        - >-
          A notebook that cannot declare its own install keeps one named all-cluster
          library with an owner, not a growing workspace-wide set.
        - >-
          Init-script installs are a different list (SCP-05-02); clearing this
          boolean does not remove those.
      path:
        - >-
          Run all-cluster-statuses and keep the rows where is_library_for_all_clusters
          is true.
        - >-
          For each, find the caller, move the install onto that cluster or notebook,
          then uninstall the all-cluster copy.
        - >-
          Re-run the listing. New true rows are a process gap, not a leftover.
      costs:
        - >-
          The first cluster that assumed the library was "just there" will fail on
          import the morning after you remove it.
        - >-
          Re-adding as all-cluster is one click, so the listing has to be re-read
          or the next install will put it back.
      retain: >-
        A dated all-cluster-statuses extract showing no is_library_for_all_clusters
        true, or a ticket naming each remaining one.
      revisit: >-
        A request to "install this for everyone", a new workspace (the list starts
        empty), or a CVE on a coordinate you used to ship globally. Failing those,
        quarterly.

  # Global init script
  # rest-api: scripts[].script_id, .name, .enabled, .position. No resolver.
  # SAT scores any configured script. enabled is a different field on the same row.
  SCP-05-02:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The global-init-scripts list is every script that can run as root on classic
      clusters before Spark starts. Each row has script_id, name, enabled, and
      position. There is no resolver yet. SAT treats any configured row as the finding,
      whether enabled is true or false.
    matters: >-
      An enabled global init script is the most privileged code in the workspace. It
      runs on every new classic cluster, and a cluster owner cannot opt out.
    good:
      - The list is empty, or every remaining script is named, owned, and has enabled you can explain.
      - Cluster-scoped init scripts cover the cases that used to be global.
      - position is a deliberate order, not three scripts that happen to work in the order they were added.
      - A change to a script is reviewed the way a cluster policy change is reviewed.
    examples:
      strong: >-
        global-init-scripts list returns no rows. The one monitoring agent that used
        to live here is now a cluster-scoped script on the policy the jobs use.
      partial: >-
        One script remains, enabled is true, and its name matches a documented agent.
        Two disabled rows from a retired tool are still in the list.
      weak: >-
        Several scripts are enabled. Nobody can open the body of the oldest one, and
        position was never reviewed.
    verify:
      - how: cli
        where: databricks global-init-scripts list
        expect: >-
          No rows, or a short list whose name and enabled you can account for
        caveat: >-
          This control has no resolver yet. SAT scores any configured script. A
          disabled row is still configured. The collector does not return the script
          body.
      - how: ui
        where: Settings > Compute > Global init scripts
        expect: Empty, or scripts whose names and enabled state you recognise
    pitfalls:
      - >-
        Setting enabled to false and reading the workspace as clean. The SAT wording
        is configured, not enabled.
      - >-
        Copying a script from another workspace without reading it. It still runs as
        root here.
      - >-
        Pointing at a cluster-scoped script as this list. Those do not appear in
        global-init-scripts.
    partial_when: >-
      One enabled script is named and owned, and disabled leftovers remain in the
      list, or production is empty and a sibling workspace that can reach the same
      data still has an enabled row.
    references:
      - https://docs.databricks.com/aws/en/init-scripts/global
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/global-init-scripts-commands
    advice:
      start_from: >-
        Delete every global init script you cannot name. Move anything still required
        onto a cluster-scoped script on the policy that needs it, then confirm the
        list is empty.
      depends_on:
        - >-
          An agent that must run on every classic cluster stays as one named enabled
          script with an owner and a review date, not a pile of historical rows.
        - >-
          Serverless does not run these scripts; emptying the list does not change
          serverless startup.
      path:
        - >-
          List the scripts. Record name, enabled, and position before deleting
          anything.
        - >-
          Disable, then delete, the ones with no owner. Move the rest to cluster
          scope.
        - >-
          Re-list. A new row appearing is a process gap.
      costs:
        - >-
          The first cluster that assumed a package was "already on the image" will
          fail after you delete the script that installed it.
        - >-
          Disabled rows still satisfy SAT's "configured" wording, so cleanup is
          deletion, not only enabled false.
      retain: >-
        A dated global-init-scripts list, empty or with each remaining name and
        enabled state written down.
      revisit: >-
        A request to install an agent "on every cluster", a new workspace, or a
        script whose author has left. Failing those, quarterly.

  # Number of admins
  # rest-api: Resources[].members:count on the group whose displayName is admins.
  # thresholds is null in this catalogue — do not invent a number. No resolver.
  SCP-05-03:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      The SCIM Groups listing includes a row whose displayName is admins.
      members:count is how many identities are in that group. This catalogue stores
      no threshold against that count. There is no resolver yet.
    matters: >-
      Every member of admins can change workspace settings and read most objects.
      A group nobody can name is a group nobody reviews, and a leaver stays in it
      until someone looks.
    good:
      - You can name each member behind the admins members:count.
      - The count is small enough that a review can be done in one sitting.
      - Service principals that need admin are named, not mixed in with forgotten people.
      - Someone leaving the platform team is removed from admins in the same change as their other groups.
    examples:
      strong: >-
        displayName admins has members:count 3. Each is a named platform engineer or
        a break-glass principal, and last quarter's review removed one.
      partial: >-
        members:count is 8. Four are current platform staff; two are people who
        moved teams last year and were never removed.
      weak: >-
        members:count is in the dozens. The listing includes users nobody on the
        platform team recognises.
    verify:
      - how: cli
        where: databricks groups list
        expect: >-
          The Resources row with displayName admins, and a members:count you can
          walk name by name
        caveat: >-
          This catalogue has thresholds null for this control, so there is no
          shipped cut-off. SAT's "configured threshold" is not a number here. No
          resolver yet. members:count is the field; it is not a list of names.
      - how: ui
        where: Settings > Identity and access > Groups > admins
        expect: A membership you can read aloud without opening a directory
      - how: by-hand
        where: For each member, ask whether they still need workspace admin this quarter
        expect: A yes with a reason, or a removal
    pitfalls:
      - >-
        Comparing the count to a number SAT used to ship. This catalogue does not
        store one.
      - >-
        Adding a person for a one-off setting change and never taking them out.
      - >-
        Reading the users group members:count as this finding. The row is the one
        whose displayName is admins.
    partial_when: >-
      You can name most members and at least one leftover remains, or the count is
      reviewable and no review has a date.
    references:
      - https://docs.databricks.com/aws/en/admin/users-groups/groups
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/groups-v2-commands
    advice:
      start_from: >-
        List the admins group, remove anyone who does not need workspace admin this
        quarter, and keep the remainder small enough that you can name them without
        a spreadsheet.
      depends_on:
        - >-
          A break-glass principal stays in the group if it is named and its sign-in
          is watched; an unnamed extra person does not.
        - >-
          Account admin is a different role. Shrinking this group does not shrink
          that one.
      path:
        - >-
          Read members:count on displayName admins, then open the membership.
        - >-
          Remove leavers and one-off additions first. Tell the people who stay.
        - >-
          Re-read the count after the removals, not from memory.
      costs:
        - >-
          The first setting change that used to be done by a former admin becomes
          a ticket to someone still in the group.
        - >-
          SCIM can put people back if the identity-provider admins group is mapped
          here, so the IdP side has to move too.
      retain: >-
        A dated groups list extract showing the admins members:count and the names
        behind it, plus the review that removed someone.
      revisit: >-
        A leaver from the platform team, a new workspace (it starts with whoever
        created it), or a request to "just add me for a minute". Failing those,
        quarterly.

  # Job view ACLs are set consistently
  # rest-api: enableJobViewAcls. Secure true. Unset is not enforcing.
  # The finding is the flag, not the CAN VIEW grants on any job.
  SCP-05-04:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enableJobViewAcls is the workspace-conf key this finding reads. The string
      true means job visibility is enforced. A missing key is scored as not
      enforcing. The grants on a given job are a different surface.
    matters: >-
      A job definition can hold a notebook path, a run-as identity, and a schedule.
      Until the key is true, Workflows lists jobs beyond the caller's CAN VIEW.
    good:
      - enableJobViewAcls is the string true, not missing and not false.
      - CAN VIEW on production jobs is granted to the groups that operate them, not inferred from this key.
      - A user without a grant does not see those jobs in their list.
      - New jobs inherit the same visibility, because the key is workspace-wide.
    examples:
      strong: >-
        enableJobViewAcls is true. A colleague outside the platform group cannot
        see the production jobs in Workflows, and get-status returns true.
      partial: >-
        The key is true. Two production jobs still grant CAN VIEW to all users, so
        the list is filtered and those two remain visible anyway.
      weak: >-
        The key has never been set. Every workspace user can list every job.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableJobViewAcls
        expect: '"enableJobViewAcls": "true"'
        caveat: >-
          A missing key is scored as not enforcing. This is not a listing of job
          ACLs. The blocked question asks about grants; the resolver reads this
          key only.
      - how: ui
        where: Settings > the job visibility / access-control toggle
        expect: Enforcement on
      - how: by-hand
        where: Workflows, signed in as someone who should not see production jobs
        expect: Those jobs absent from the list, not present and failing to open
    pitfalls:
      - >-
        Setting the key and leaving CAN VIEW on all users, then reading the flag
        as proof jobs are hidden.
      - >-
        Pointing at a job's Permissions tab as this finding. The collector does
        not open that tab.
      - >-
        Turning the key on without telling operators. Jobs they used to see
        disappear from the list.
    partial_when: >-
      enableJobViewAcls is true and at least one production job still grants view
      to all users, or the key is true in production and missing in a workspace
      that can see the same jobs.
    references:
      - https://docs.databricks.com/aws/en/jobs/privileges
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Set enableJobViewAcls to true, then fix the CAN VIEW grants on the jobs
        people suddenly cannot see.
      depends_on:
        - >-
          A workspace used only for demos can stay unset if that is written down;
          one that holds production jobs cannot.
        - >-
          Cluster and folder visibility are different keys (SCP-05-05, SCP-05-06);
          this one does not move them.
      path:
        - >-
          Read enableJobViewAcls. Missing or false is the change.
        - >-
          Tell the job owners the list will shrink, then set true.
        - >-
          Walk the jobs that generated tickets and grant CAN VIEW to the operating
          group, not to all users.
      costs:
        - >-
          The first morning, people will report "the job is gone". It is hidden,
          and the fix is a grant.
        - >-
          The key is workspace-wide. There is no per-job enforcement flag.
      retain: >-
        The dated get-status line showing enableJobViewAcls true.
      revisit: >-
        A new workspace (the key starts unset), a job that must be visible to a
        new team, or a request to turn enforcement off. Failing those, quarterly.

  # Cluster view ACLs are set consistently
  # rest-api: enforceClusterViewAcls. Secure true. Unset is not enforcing.
  # The finding is the flag, not the CAN ATTACH TO grants on any cluster.
  SCP-05-05:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enforceClusterViewAcls is compared to the string true. Until that key is
      set, Compute lists clusters beyond the caller's attach permission. This
      finding does not open a cluster's Permissions tab.
    matters: >-
      A cluster page shows its instance profile, init scripts, and who can attach.
      While the key is missing or false, that inventory is listed for every
      workspace user.
    good:
      - enforceClusterViewAcls is the string true, not missing and not false.
      - CAN ATTACH TO on shared clusters is granted to the groups that use them.
      - A user without a grant does not see those clusters in Compute.
      - Job clusters that terminate with the run are not the population this list is about.
    examples:
      strong: >-
        enforceClusterViewAcls is true. Analysts see only the policy cluster their
        group can attach to, and get-status returns true.
      partial: >-
        The key is true. One "shared analytics" cluster still grants CAN MANAGE to
        all users, so it stays on everyone's list.
      weak: >-
        The key has never been set. Every running cluster is visible in Compute
        to every user.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enforceClusterViewAcls
        expect: '"enforceClusterViewAcls": "true"'
        caveat: >-
          A missing key is scored as not enforcing. The blocked question asks
          about grants to all users; the resolver reads this key only.
      - how: ui
        where: Settings > the cluster visibility / access-control toggle
        expect: Enforcement on
      - how: by-hand
        where: Compute, signed in as someone who should not attach to production clusters
        expect: Those clusters absent from the list
    pitfalls:
      - >-
        Setting the key and leaving CAN MANAGE on all users on a shared cluster.
      - >-
        Reading a cluster ACL export as this finding. The collector does not
        fetch cluster permissions.
      - >-
        Turning the key on without granting CAN ATTACH TO first. Teams lose the
        cluster they were using and file it as an outage.
    partial_when: >-
      A shared all-purpose cluster remains listed for every identity because
      its ACL still names the all-users group, even though enforcement is
      already on; or a second workspace using that policy has never stored
      the key.
    references:
      - https://docs.databricks.com/aws/en/compute/clusters-manage#cluster-level-permissions
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Grant CAN ATTACH TO on the clusters each team uses, then set
        enforceClusterViewAcls to true.
      depends_on:
        - >-
          A single shared cluster that the whole company attaches to needs a
          group on CAN ATTACH TO before the key is flipped, or Compute goes empty
          for them.
        - >-
          Job visibility is enableJobViewAcls, not this key.
      path:
        - >-
          Read enforceClusterViewAcls. Missing or false is the backlog.
        - >-
          Put groups on the clusters people actually start, then set true.
        - >-
          Confirm Compute as a non-admin user shows only those clusters.
      costs:
        - >-
          Anyone who browsed every cluster for a Spark UI will lose that tour.
        - >-
          Grants have to exist first. The key does not create them.
      retain: >-
        The dated get-status line showing enforceClusterViewAcls true.
      revisit: >-
        A new shared cluster, a new workspace, or a team that cannot see the
        cluster they were told to use. Failing those, quarterly.

  # Workspace View ACLs are set consistently
  # rest-api: enforceWorkspaceViewAcls. Secure true. Unset is not enforcing.
  # Once on, a notebook in an ungranted folder disappears rather than refusing to open.
  SCP-05-06:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enforceWorkspaceViewAcls stores whether workspace objects are hidden from
      people without a grant. A missing key is not enforcement. A folder ACL is
      not this key.
    matters: >-
      A notebook in someone else's folder is source, and often a credential.
      Until the key is true, those objects remain listed even when open would
      fail.
    good:
      - enforceWorkspaceViewAcls is the string true, not missing and not false.
      - Top-level folders grant to the teams that work there, not to all users.
      - A user without a grant does not see those folders in the workspace tree.
      - The first "missing notebook" ticket is treated as a grant, not as a reason to set the key false.
    examples:
      strong: >-
        enforceWorkspaceViewAcls is true. Each domain has a folder with a group
        grant. A user from another domain does not see that folder.
      partial: >-
        The key is true. The /Shared folder still grants to all users, so most
        notebooks remain listed.
      weak: >-
        The key has never been set. The workspace tree shows every folder to
        every user.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enforceWorkspaceViewAcls
        expect: '"enforceWorkspaceViewAcls": "true"'
        caveat: >-
          A missing key is scored as not enforcing. After it is true, an
          ungranted notebook disappears from the tree rather than appearing and
          refusing to open. The collector does not read folder ACLs.
      - how: ui
        where: Settings > the workspace object visibility / access-control toggle
        expect: Enforcement on
      - how: by-hand
        where: The workspace tree, signed in as someone who should not see another team's folder
        expect: That folder absent, not present and forbidden
    pitfalls:
      - >-
        Setting the key and leaving /Shared open to all users, then reading the
        flag as a private workspace.
      - >-
        Turning enforcement back off because someone reported a missing notebook.
        The fix is a grant on the folder.
      - >-
        Pointing at a notebook's Permissions dialog as this finding.
    partial_when: >-
      enforceWorkspaceViewAcls is true and a top-level folder still grants to all
      users, or the key is true and people are reporting missing work that is a
      grant problem.
    references:
      - https://docs.databricks.com/aws/en/security/auth/access-control#folders
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Grant the teams their folders, then set enforceWorkspaceViewAcls to true.
        Expect missing-notebook tickets the first day; those are grants.
      depends_on:
        - >-
          A workspace that is one team's scratch space can stay unset if written
          down; one that holds several domains cannot.
        - >-
          Job and cluster visibility are other keys. This one hides folders and
          notebooks, not Workflows or Compute.
      path:
        - >-
          Read enforceWorkspaceViewAcls. Missing or false is the change.
        - >-
          Put group grants on the folders people live in, then set true.
        - >-
          Treat the first wave of "it vanished" as grant work, not a rollback.
      costs:
        - >-
          Bookmarks to a notebook in someone else's folder will 404 until a
          grant exists.
        - >-
          The key is workspace-wide. You cannot enforce it on /prod and leave
          /Shared listed.
      retain: >-
        The dated get-status line showing enforceWorkspaceViewAcls true.
      revisit: >-
        A new top-level folder, a new workspace, or a missing-notebook ticket
        that was "fixed" by turning the key off. Failing those, quarterly.

  # Workspace for supporting Git repos
  # rest-api: enableProjectTypeInWorkspace. Secure true. Absent is unmeasured —
  # current workspaces have Git folders without the key being present.
  SCP-05-07:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enableProjectTypeInWorkspace is the workspace-conf key that records whether
      Git folders are offered. The finding reports that key. An absent value is
      unmeasured: current workspaces have the feature without the key being set.
      The finding does not say any notebook is backed by a repository.
    matters: >-
      On a workspace old enough to have the key off, Repos / Git folders are not
      offered. Notebooks then have no in-product source of truth outside the
      workspace file.
    good:
      - enableProjectTypeInWorkspace is the string true, or the key is absent on a current workspace and Git folders are visible in the UI.
      - Production notebooks that matter live in a Git folder, which is a separate check from this key.
      - A workspace old enough to have the key explicitly false is treated as a finding, not as "default on".
      - The Git allowlist (SCP-05-15) is decided separately — this key does not restrict remotes.
    examples:
      strong: >-
        get-status returns true, or the key is absent and Workspace shows Git
        folders. Production jobs pull from those folders.
      partial: >-
        Git folders are offered. Most production notebooks still live as
        workspace files with no remote.
      weak: >-
        The key is explicitly false on an older workspace. The Git folder type
        is not offered.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableProjectTypeInWorkspace
        expect: >-
          "true", or no key on a workspace where Git folders are visible
        caveat: >-
          Absent is unmeasured, not a failure. The resolver will not guess the
          platform default. This is not a count of notebooks in Git, and it is
          not the allowlist key.
      - how: ui
        where: Workspace, Add > Git folder, or Settings > Git integration
        expect: The Git folder type offered
    pitfalls:
      - >-
        Reading an absent key as "Git is off". On current workspaces the setting
        is absent because the feature is already there.
      - >-
        Pointing at this key as proof production code is in Git. The key offers
        the type; it does not move notebooks.
      - >-
        Confusing this with enableProjectsAllowList. That key restricts remotes.
    partial_when: >-
      Git folders are offered and production notebooks still live only as
      workspace files, or the key is true and nobody has connected a remote.
    references:
      - https://docs.databricks.com/aws/en/repos
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        If get-status returns false, set enableProjectTypeInWorkspace to true.
        If the key is absent and Git folders are already offered, move production
        notebooks into them; do not flip a key that is not there.
      depends_on:
        - >-
          A workspace old enough to have the key false needs the flip before
          anyone can add a Git folder.
        - >-
          Remotes you will allow are enableProjectsAllowList, decided after this
          type exists.
      path:
        - >-
          Read the key. false is a flip; absent plus a visible Git folder type
          is already the offering.
        - >-
          Connect one production notebook to a remote and run from that folder.
        - >-
          Then decide the allowlist. An open Git type with any remote is the
          next control.
      costs:
        - >-
          Moving a notebook into a Git folder is a cut-over: paths, jobs, and
          permissions all change.
        - >-
          Setting a missing key to true on a current workspace is a no-op that
          looks like progress.
      retain: >-
        The dated get-status line, or a screenshot that Git folders are offered
        when the key is absent.
      revisit: >-
        A newly created workspace, an older workspace being brought up to date,
        or a request to disable Git folders. Failing those, when you next review
        the allowlist.

  # Direct use of Unity Catalog metastore storage credentials
  # rest-api: storage_credentials[].name, .read_only, .isolation_mode,
  # .used_for_managed_storage. No grants. No resolver.
  # SAT's securable_type = STORAGE_CREDENTIAL is true of every row in this list.
  SCP-05-08:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      The storage-credentials listing returns name, read_only, isolation_mode,
      and used_for_managed_storage. It does not return who holds READ FILES or
      WRITE FILES. There is no resolver yet. SAT's criterion that looks for
      securable_type STORAGE_CREDENTIAL is true of every row in this list.
    matters: >-
      A storage credential is the cloud identity that can read the bucket. A
      person granted READ FILES on that credential can reach paths the external
      location was meant to hide — and that grant is not a field this collector
      holds.
    good:
      - isolation_mode on credentials that back production locations is one you can name, not a surprise ISOLATION_MODE_OPEN.
      - used_for_managed_storage is reserved for the metastore's own credential, not reused as a team's scratch identity.
      - READ FILES and WRITE FILES on each credential are held by groups that own the locations, confirmed outside this listing.
      - Users reach files through external locations and volumes, not through a direct credential grant.
    examples:
      strong: >-
        The listing shows the managed credential plus one named credential per
        cloud account. SHOW GRANTS on each has no READ FILES to a person.
      partial: >-
        isolation_mode and names look tidy. Two engineers still hold WRITE FILES
        on the production credential from the week the location was created.
      weak: >-
        One open credential backs every location. Nobody has run SHOW GRANTS, and
        the SAT wording would pass because every row is a STORAGE_CREDENTIAL.
    verify:
      - how: cli
        where: databricks storage-credentials list
        expect: >-
          Named credentials whose isolation_mode and used_for_managed_storage
          you can account for
        caveat: >-
          This listing is not a privilege table. SAT's securable_type check
          cannot fail a real credential. There is no resolver. Grants are a
          different command.
      - how: cli
        where: databricks grants get --securable-type storage-credential --full-name <name>
        expect: >-
          No READ FILES or WRITE FILES to an individual person
        caveat: >-
          The collector does not call this. A clean storage-credentials list is
          not a clean grant list.
      - how: ui
        where: Catalog > External data > Storage credentials, Permissions on each
        expect: Groups, not people, on READ FILES / WRITE FILES
    pitfalls:
      - >-
        Treating a non-empty storage-credentials list as a SAT pass. That is
        what the criterion literally asks, and it is true of every metastore.
      - >-
        Granting READ FILES on the credential because the external location
        grant felt slower. That is the bypass.
      - >-
        Reading isolation_mode as a privilege. It is a visibility mode, not
        who can use the identity.
    partial_when: >-
      The listing is tidy and SHOW GRANTS still names people on READ FILES, or
      used_for_managed_storage is true on a credential teams also use directly.
    references:
      - https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/storage-credentials-commands
    advice:
      start_from: >-
        Keep storage credentials for external locations only. Revoke READ FILES
        and WRITE FILES held by people; grant on the location instead.
      depends_on:
        - >-
          A pipeline that must list a prefix the location does not cover needs
          a narrower location, not a credential grant to the job's principal.
        - >-
          The managed storage credential is the metastore's; do not grant it to
          users to "make a volume work".
      path:
        - >-
          List credentials. Note isolation_mode and used_for_managed_storage.
        - >-
          SHOW GRANTS on each. Move person-level READ FILES / WRITE FILES onto
          the matching external location.
        - >-
          Re-read grants. The listing fields will not have moved, and they were
          never the grants.
      costs:
        - >-
          The first job that used the credential as a bucket key will fail until
          it has a location grant or a volume.
        - >-
          This app cannot score the grant half until a resolver exists, so a
          clean listing will look done when it is not.
      retain: >-
        A dated storage-credentials list plus the grants get output for each
        name, showing no person on READ FILES or WRITE FILES.
      revisit: >-
        A new storage credential, a request for "just READ FILES on the
        credential", or a location that cannot see a prefix. Failing those,
        quarterly.

  # Users with Delta Sharing permissions to create a recipient or create a share
  # Catalogue collector is unity-catalog.permissions; reach probes token permission
  # levels instead. Not collected. No resolver.
  SCP-05-09:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      CREATE_SHARE and CREATE_RECIPIENT on the metastore are the two privileges
      that let someone publish data out of the account. This app has not collected
      those grants: the reach probe attached to this control id asks token
      permission levels, which is a different object. There is no resolver.
    matters: >-
      Anyone who holds both privileges can create a share and a recipient without
      a second approver. The listing this control names is not in the evidence
      pack.
    good:
      - CREATE_SHARE and CREATE_RECIPIENT are held by a named group, not by every metastore admin by accident.
      - People who only consume shares do not hold CREATE_RECIPIENT.
      - The last review of those two privileges has a date and a removal.
      - Sharing that is internal-only is still gated — the privileges work either way.
    examples:
      strong: >-
        SHOW GRANTS ON METASTORE names one platform group on CREATE_SHARE and
        CREATE_RECIPIENT. Last quarter's review removed an engineer who had moved.
      partial: >-
        A sharing team holds the two privileges, and two leftover personal grants
        remain from the first recipient that was created by hand.
      weak: >-
        Nobody has listed CREATE_SHARE or CREATE_RECIPIENT. Several users can
        open the Create share dialog.
    verify:
      - how: sql
        where: |-
          select privilege_type, grantee, count(*) as grants
          from system.information_schema.metastore_privileges
          where privilege_type in ('CREATE_SHARE', 'CREATE_RECIPIENT')
          group by all
          order by grants desc
        expect: >-
          A short set of grantees, groups rather than people
        caveat: >-
          This query is not the app's collector. Coverage for this control is
          not collected. metastore_privileges shows only grants the reader can
          see.
      - how: cli
        where: databricks grants get --securable-type metastore --full-name <metastore-id>
        expect: >-
          CREATE_SHARE and CREATE_RECIPIENT on a named group, not on a crowd
      - how: ui
        where: Catalog > the metastore > Permissions, filtered to CREATE SHARE and CREATE RECIPIENT
        expect: A small named set
    pitfalls:
      - >-
        Reading a token-permissions probe as this answer. That is the reach
        family this control id is attached to, and it is the wrong object.
      - >-
        Granting CREATE_RECIPIENT to whoever asked to "try sharing", then
        leaving it.
      - >-
        Pointing at an empty recipient list as proof nobody can create one.
        The privilege is the finding, not the current recipients.
    partial_when: >-
      A named group holds both privileges and at least one personal grant
      remains, or the privileges are tight and have never been reviewed.
    references:
      - https://docs.databricks.com/aws/en/opensharing/create-recipient
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/grants-commands
    advice:
      start_from: >-
        Grant CREATE_SHARE and CREATE_RECIPIENT to one platform group. Revoke
        them from individual users, including the person who created the first
        share.
      depends_on:
        - >-
          A domain that must create its own shares gets a dedicated group on
          those two privileges, not metastore admin.
        - >-
          If you do not share outside the metastore, still list the grants —
          unused privileges are how the first accidental recipient appears.
      path:
        - >-
          Run the metastore_privileges query. People on either privilege are
          the backlog.
        - >-
          Create or reuse a group, grant the two privileges, revoke the
          personal ones.
        - >-
          Confirm Create share / Create recipient fails for a user outside
          that group.
      costs:
        - >-
          The first share created by a departing engineer will need the new
          group to exist first, or sharing stops for a day.
        - >-
          This app will not score the listing until collection is wired, so
          the SQL extract is the record.
      retain: >-
        A dated metastore_privileges extract for CREATE_SHARE and
        CREATE_RECIPIENT, and the grants get output that matches it.
      revisit: >-
        A new share request from a team that does not have the group, a new
        metastore, or a recipient created by someone you did not expect.
        Failing those, quarterly.

  # Streamline the usage and management of various large language model(LLM) providers
  # rest-api: serving-endpoints, servedExternalModel. Empty inventory is not-applicable.
  # Endpoints with none external is partial, not fail. Does not see notebook API calls.
  SCP-05-10:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Platform administrator, with the ML owners
    means: >-
      The serving-endpoints inventory is scored on whether any endpoint has
      servedExternalModel. At least one such endpoint is a pass. Endpoints that
      exist with none external is partial. An empty inventory is not-applicable.
      The finding does not say notebooks are not calling a provider API.
    matters: >-
      A provider key pasted into a notebook is a key in every revision of that
      notebook. Routing the same model through a serving endpoint is what puts
      that key in one secret and the calls in one request log — and the endpoint
      list cannot see the paste.
    good:
      - At least one serving endpoint has servedExternalModel, if third-party models are in use.
      - Provider keys for those endpoints live in a secret scope, not in the endpoint JSON as plaintext.
      - Notebooks that used to call the provider HTTP API have been pointed at the endpoint.
      - An empty endpoint list is treated as not-applicable, not as a pass and not as a fail.
    examples:
      strong: >-
        Two endpoints front OpenAI and Anthropic. Keys are in a secret scope.
        The notebooks that used to call the provider have been switched.
      partial: >-
        Serving endpoints exist and none has servedExternalModel. Teams still
        call a provider from notebooks; that call is not on this inventory.
      weak: >-
        Endpoints exist, none is external, and provider keys are still in
        notebook source.
    verify:
      - how: cli
        where: databricks serving-endpoints list
        expect: >-
          At least one config whose served entity is an external model, if you
          use third-party providers
        caveat: >-
          Zero endpoints is not-applicable. Endpoints with none external is
          partial — the resolver cannot see notebook calls. SAT's "alert if
          none" is not this outcome.
      - how: ui
        where: Serving, each endpoint's served entity, whether it names an external provider
        expect: An external-model endpoint if third-party models are in use
      - how: by-hand
        where: Search production notebooks for provider SDK constructors and raw HTTPS to those hosts
        expect: Those calls gone, or only in archived folders
    pitfalls:
      - >-
        Creating an external-model endpoint and leaving the old key in the
        notebooks. The inventory will pass; the keys will not have moved.
      - >-
        Reading an empty serving list as a failure. The resolver scores that
        not-applicable.
      - >-
        Treating a foundation-model endpoint as servedExternalModel. That is a
        different served-entity shape.
    partial_when: >-
      Serving endpoints exist and none has servedExternalModel, which is this
      finding's partial — it is only a gap if third-party models are in use,
      and that is not on the inventory.
    not_applicable_when: >-
      There are no model serving endpoints in this workspace, so there is no
      external-model routing to assess.
    references:
      - https://docs.databricks.com/aws/en/machine-learning/foundation-models/external-models
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/serving-endpoints-commands
    advice:
      start_from: >-
        If third-party models are in use, create one serving endpoint per
        provider, put the key in a secret scope, and point callers at that
        endpoint. If they are not in use, do not create an endpoint to satisfy
        the inventory.
      depends_on:
        - >-
          An estate that does not call external providers should stay
          not-applicable, not grow an unused endpoint.
        - >-
          GCP is not in this control's clouds; do not treat a missing
          inventory there as a skip you invented.
      path:
        - >-
          List serving-endpoints. Empty is stop, unless you already know
          notebooks call a provider.
        - >-
          If keys are in notebooks, create the endpoint and move the key,
          then switch the callers.
        - >-
          Re-list. servedExternalModel should be present on the new
          endpoint; the notebook search is the half the inventory cannot do.
      costs:
        - >-
          Each external endpoint is a serving bill and a secret to rotate.
        - >-
          A pass on this inventory with keys still in notebooks is the
          failure mode the caveat exists for.
      retain: >-
        A dated serving-endpoints list showing at least one servedExternalModel,
        and the secret-scope name the key moved into.
      revisit: >-
        A new provider, a notebook that grew a new SDK call, or an endpoint
        deleted as unused. Failing those, quarterly.

  # Compliance security profile for new workspaces
  # rest-api: csp_enablement_account.is_enforced. Account setting. AWS only.
  # Governs workspaces created after it is true. No resolver.
  SCP-05-11:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      csp_enablement_account.is_enforced is the AWS account default for the
      compliance security profile. A true means the next workspace is minted
      with the profile on. There is no resolver yet, and this collector is
      not listed for Azure or GCP.
    matters: >-
      A new workspace created while is_enforced is false arrives without the
      profile. The workspace-level control cannot be assumed from this field,
      and turning the profile on later is a separate, permanent decision.
    good:
      - csp_enablement_account.is_enforced is true, not false.
      - Existing workspaces are reviewed on compliance_security_profile_workspace.is_enabled — this field is not a statement about them.
      - People who create workspaces know new ones will arrive with the profile, including the compute constraints that come with it.
      - The account is AWS; this collector is not listed for Azure or GCP.
    examples:
      strong: >-
        is_enforced is true. The last three workspaces were created after that
        date and show the profile on at the workspace setting.
      partial: >-
        is_enforced is true. Two workspaces created last year still have
        compliance_security_profile_workspace.is_enabled false.
      weak: >-
        is_enforced is false, which is the value the collector's fixture shows.
        New workspaces arrive without the profile.
    verify:
      - how: cli
        where: databricks account settings compliance-security-profile get
        expect: >-
          csp_enablement_account.is_enforced is true
        caveat: >-
          Report is_enforced. Do not conclude existing workspaces have the
          profile — that is SCP-05-13. No resolver yet. AWS only in this
          catalogue.
      - how: ui
        where: Account console > Settings > Compliance security profile, the default for new workspaces
        expect: Enforced for new workspaces
    pitfalls:
      - >-
        Setting is_enforced and reading the estate as covered. Workspaces
        created before the date are unchanged.
      - >-
        Naming a regulation as the reason without a source that names it.
        This field is the default for new workspaces, not a legal outcome.
      - >-
        Looking for this setting on Azure or GCP in this collector. It is
        not in those clouds here.
    partial_when: >-
      is_enforced is true and at least one existing workspace that holds
      production data still has the workspace profile off.
    references:
      - https://docs.databricks.com/aws/en/security/privacy/security-profile
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/account-settings-v2-commands
    advice:
      start_from: >-
        Set csp_enablement_account.is_enforced to true so the next workspace
        arrives with the profile, then review existing workspaces on SCP-05-13
        one by one.
      depends_on:
        - >-
          A sandbox account that must keep unconstrained runtimes stays false
          if that is written down; an account that creates production
          workspaces does not.
        - >-
          The workspace flip is permanent. Use this account default to avoid
          creating another workspace you will have to decide later.
      path:
        - >-
          Read is_enforced. false is the account change.
        - >-
          Tell the people who create workspaces what compute they will lose,
          then set true.
        - >-
          List existing workspaces and score each on the workspace setting.
          This field will not have moved them.
      costs:
        - >-
          New workspaces inherit the profile's runtime and instance-type
          constraints from day one, which is the point and also the first
          ticket.
        - >-
          The add-on is a line on the bill for each workspace that lands
          with the profile.
      retain: >-
        The dated account get output showing csp_enablement_account.is_enforced
        true.
      revisit: >-
        A new workspace (confirm it arrived with the profile), an account
        that was copied, or a request to create an unconstrained workspace.
        Failing those, quarterly.

  # Third-party library control
  # rest-api: artifact_matchers[].artifact and .match_type for LIBRARY_JAR and
  # LIBRARY_MAVEN. Empty object in the fixture. No resolver.
  SCP-05-12:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Metastore admin
    means: >-
      The artifact-allowlists call returns artifact_matchers for LIBRARY_JAR
      and LIBRARY_MAVEN. Each matcher has an artifact and a match_type. An
      empty object means no matchers were returned. There is no resolver yet.
    matters: >-
      On standard-access compute, an empty JAR or Maven allowlist is the
      documented default that permits any coordinate. A cluster can then
      install a library no one has reviewed.
    good:
      - LIBRARY_JAR and LIBRARY_MAVEN each have artifact_matchers you can name.
      - match_type is the one you intended — prefix versus exact — not a leftover from a trial.
      - Init scripts that fetch JARs are covered by the same review, not assumed from this list.
      - Shared-access clusters that ignore the allowlist are a different compute mode, not a pass here.
    examples:
      strong: >-
        Both types return matchers for the internal Maven prefix and the
        approved JAR bucket. A trial install of an unknown coordinate fails.
      partial: >-
        LIBRARY_MAVEN has matchers. LIBRARY_JAR returns an empty object, so
        JARs are still unrestricted.
      weak: >-
        Both types return no artifact_matchers, which is the fixture's empty
        object.
    verify:
      - how: cli
        where: |-
          databricks artifact-allowlists get LIBRARY_JAR
          databricks artifact-allowlists get LIBRARY_MAVEN
        expect: >-
          artifact_matchers with artifact values you recognise on both types
        caveat: >-
          No resolver yet. SAT's wording is any matcher configured. An empty
          object is not a hidden default allowlist. Standard-access compute
          is the population this list governs.
      - how: ui
        where: Catalog > the metastore > Allowed JARs / Maven coordinates
        expect: Entries on both types, not an empty page
    pitfalls:
      - >-
        Adding a matcher on Maven and reading JARs as covered. The collector
        asks both types.
      - >-
        Populating the list and leaving standard-access clusters able to
        reach public Maven because match_type PREFIX was too broad.
      - >-
        Pointing at is_library_for_all_clusters as this control. That is a
        different install path.
    partial_when: >-
      One artifact type has matchers and the other returns an empty object,
      or matchers exist and a standard-access cluster can still install a
      coordinate you did not list.
    references:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/allowlist
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/artifact-allowlists-commands
    advice:
      start_from: >-
        Put your internal Maven prefix and the approved JAR locations on
        LIBRARY_MAVEN and LIBRARY_JAR, then confirm an unknown coordinate
        fails on a standard-access cluster.
      depends_on:
        - >-
          An estate that runs only dedicated-access personal compute still
          wants the list before the first shared cluster appears.
        - >-
          Global libraries (SCP-05-01) bypass a lot of "who installed this"
          questions; clear those first or the allowlist will fight a
          workspace-wide install.
      path:
        - >-
          Get both types. Empty object is the backlog.
        - >-
          Add the prefixes you already use, not the entire Maven Central
          tree.
        - >-
          Try an unknown coordinate on a standard-access cluster. If it
          installs, the matcher is wrong.
      costs:
        - >-
          The first job that pulled a one-off coordinate from Maven Central
          will fail until someone adds a matcher.
        - >-
          A PREFIX that is too short is an allowlist that does not allow-
          list.
      retain: >-
        The dated get output for LIBRARY_JAR and LIBRARY_MAVEN showing
        artifact_matchers on both.
      revisit: >-
        A new coordinate a job needs, a new metastore, or a standard-access
        cluster that installed something you did not list. Failing those,
        quarterly.

  # Compliance security profile for the workspace
  # rest-api: compliance_security_profile_workspace.is_enabled. Permanent once
  # true. AWS and Azure. No resolver.
  SCP-05-13:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      The collector's object is compliance_security_profile_workspace, and
      is_enabled is the boolean on it. Once true, the product does not offer
      a path back to false. This control has no resolver. Clouds in the
      catalogue are aws and azure.
    matters: >-
      With is_enabled false, the workspace is not under the profile's
      monitoring and compute constraints. The account default for new
      workspaces does not change this field on a workspace that already
      exists.
    good:
      - compliance_security_profile_workspace.is_enabled is true, not false.
      - The standards selected on the profile are ones you can name from the setting, not inferred from a regulation.
      - enhanced_security_monitoring_workspace.is_enabled is understood to follow this field when the profile is on.
      - People who start clusters know which runtimes and instance types the profile removes.
    examples:
      strong: >-
        is_enabled is true. The last cluster-create that asked for a removed
        runtime failed as expected, and the account default is also on so new
        workspaces match.
      partial: >-
        is_enabled is true in production and false in a workspace that still
        holds a copy of production data.
      weak: >-
        is_enabled is false, which is the value the collector's fixture shows.
    verify:
      - how: cli
        where: databricks settings compliance-security-profile get
        expect: >-
          compliance_security_profile_workspace.is_enabled is true
        caveat: >-
          Report is_enabled. Do not conclude a regulation is satisfied — the
          field is the profile, not an audit outcome. Enablement is
          permanent. No resolver yet. AWS and Azure only.
      - how: ui
        where: Settings > Security > Compliance security profile
        expect: Enabled, with the standards the setting lists
    pitfalls:
      - >-
        Reading the account default as this workspace's is_enabled. They are
        different fields.
      - >-
        Enabling it on a Friday without telling the teams which instance
        types will disappear.
      - >-
        Stating that a named regulation requires this without a citation
        that names the regulation.
    partial_when: >-
      The production workspace has is_enabled true and a workspace that
      holds a replica of the same tables still has it false.
    references:
      - https://docs.databricks.com/aws/en/security/privacy/security-profile
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/settings-commands
    advice:
      start_from: >-
        Set compliance_security_profile_workspace.is_enabled to true on each
        production workspace after you have read the compute constraints, and
        treat the flip as one-way.
      depends_on:
        - >-
          A workspace that cannot take the add-on or the runtime set stays
          false with that written down; do not flip it to "try it".
        - >-
          If the account default is already true, new workspaces skip this
          flip — existing ones still need this field.
      path:
        - >-
          Read is_enabled. false is the decision, not a toggle to experiment
          with.
        - >-
          Tell the teams the runtimes and types they will lose, then set
          true.
        - >-
          Read enhanced_security_monitoring_workspace.is_enabled next. The
          docs say it follows the profile; confirm the field.
      costs:
        - >-
          The add-on is a bill line, and the flip cannot be undone.
        - >-
          Clusters on a removed runtime will not start after the change.
      retain: >-
        The dated get output showing compliance_security_profile_workspace.is_enabled
        true.
      revisit: >-
        A new workspace (check the account default first), a request to run
        a runtime the profile removes, or a copy of production data landing
        in a workspace where is_enabled is still false. Failing those,
        quarterly.

  # Enhanced security monitoring for the workspace
  # rest-api: enhanced_security_monitoring_workspace.is_enabled. AWS and Azure.
  # Docs: on when the compliance profile is on. No resolver.
  SCP-05-14:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Account admin
    means: >-
      enhanced_security_monitoring_workspace.is_enabled records whether the
      monitoring add-on is switched on. Documentation states it becomes true
      when the compliance profile is enabled, and can be toggled on its own
      when that profile is off. No resolver scores this field yet.
    matters: >-
      With is_enabled false, the extra host monitoring the add-on records is
      not in effect on this workspace. The field does not say whether an
      antivirus finding has been raised.
    good:
      - enhanced_security_monitoring_workspace.is_enabled is true, not false.
      - If compliance_security_profile_workspace.is_enabled is true, this field is also true — confirm both, do not infer one.
      - Someone can find the monitoring events the add-on writes after it is on.
      - A workspace that cannot take the add-on has that written down, rather than a silent false.
    examples:
      strong: >-
        is_enabled is true. The profile is also on. Last week's audit extract
        includes the monitoring actions the add-on documents.
      partial: >-
        is_enabled is true in production and false in a workspace that can
        still read production tables.
      weak: >-
        is_enabled is false, which is the value the collector's fixture shows.
    verify:
      - how: cli
        where: databricks settings enhanced-security-monitoring get
        expect: >-
          enhanced_security_monitoring_workspace.is_enabled is true
        caveat: >-
          Report is_enabled. Do not conclude hosts are clean — the field is
          the setting, not a scan result. No resolver yet. AWS and Azure
          only. The profile being on is a different field.
      - how: ui
        where: Settings > Security > Enhanced security monitoring
        expect: The toggle on, matching is_enabled true
    pitfalls:
      - >-
        Pointing at the compliance profile and skipping this get. The docs
        say it follows; the field is still the one to read.
      - >-
        Reading is_enabled true as "no malware". The setting does not carry
        that sentence.
      - >-
        Enabling it without the add-on entitlement, then reading a get error
        as a pass.
    partial_when: >-
      Monitoring is on where the nightly jobs run and off on a sibling
      that can SELECT the same catalogs, or the profile get is true and
      this get has not been opened.
    references:
      - https://docs.databricks.com/aws/en/security/privacy/enhanced-security-monitoring
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/settings-commands
    advice:
      start_from: >-
        Set enhanced_security_monitoring_workspace.is_enabled to true on
        production workspaces. If you are turning the compliance profile on,
        read this field after that flip rather than assuming it moved.
      depends_on:
        - >-
          A profile that is already on should show this field true; if it
          does not, that is a ticket, not a second product story.
        - >-
          A workspace that cannot take the add-on stays false with that
          written down.
      path:
        - >-
          Read is_enabled and the profile field in the same sitting.
        - >-
          If both are false and the workspace holds production data, decide
          the profile first — this field follows it when the profile is on.
        - >-
          If the profile must stay off, set this field true on its own, then
          confirm get returns true.
      costs:
        - >-
          The add-on is a bill line. Classic compute images change.
        - >-
          The setting does not print a clean-or-not on each host; expecting
          that report is how people stop trusting the toggle.
      retain: >-
        The dated get output showing enhanced_security_monitoring_workspace.is_enabled
        true.
      revisit: >-
        A compliance-profile change, a new workspace, or a get that does not
        match the profile field. Failing those, quarterly.

  # Git repository allowlist configured
  # rest-api: enableProjectsAllowList. Secure true. Unset is not enforcing.
  # The finding is the flag, not the prefixes on the list.
  SCP-05-15:
    status: authored
    last_reviewed: '2026-08-18'
    owner_role: Workspace admin
    means: >-
      enableProjectsAllowList is the workspace-conf key that records whether
      the Git remote allowlist is enforced. The string true means it is
      enforced. A missing key is scored as not enforcing. The finding does
      not list the prefixes.
    matters: >-
      Until the key is true, a user can connect a Git folder to any remote
      they can authenticate to. Code then leaves, or arrives, on a host you
      did not review.
    good:
      - enableProjectsAllowList is the string true, not missing and not false.
      - The prefixes on the allowlist are repositories you control, populated before the key is flipped.
      - Existing Git folders keep working; the list is applied when a remote is added.
      - enableProjectTypeInWorkspace is already offering Git folders — this key restricts remotes, it does not invent the type.
    examples:
      strong: >-
        enableProjectsAllowList is true. The allowlist holds the company Git
        host prefixes. A connection to a personal GitHub remote is refused.
      partial: >-
        The key is true. The list still includes a wildcard from the week
        someone could not find the right prefix.
      weak: >-
        The key has never been set. Any remote can be connected.
    verify:
      - how: cli
        where: databricks workspace-conf get-status --keys enableProjectsAllowList
        expect: '"enableProjectsAllowList": "true"'
        caveat: >-
          A missing key is scored as not enforcing. The resolver does not
          read the prefix list. An empty list with the key true stops new
          connections; populate the list first. This is not
          enableProjectTypeInWorkspace.
      - how: ui
        where: Settings > Developer > Git integration > the repository allowlist, then the enforce toggle
        expect: Prefixes you recognise, and enforcement on
      - how: by-hand
        where: Add a Git folder pointed at a remote that is not on the list
        expect: The connection refused
    pitfalls:
      - >-
        Setting the key true against an empty list. Nobody can add a
        repository until prefixes exist.
      - >-
        Reading this key as proof Git folders are offered. That is
        enableProjectTypeInWorkspace.
      - >-
        Populating the list and leaving the key unset, then reading the
        prefixes as enforcement.
    partial_when: >-
      enableProjectsAllowList is true and the prefix list still allows a host
      you do not control, or the key is true in production and unset in a
      workspace that can clone the same notebooks.
    references:
      - https://docs.databricks.com/aws/en/repos/repos-setup
      - https://docs.databricks.com/aws/en/dev-tools/cli/reference/workspace-conf-commands
    advice:
      start_from: >-
        Add the company Git host prefixes to the allowlist, then set
        enableProjectsAllowList to true. Do not flip the key on an empty
        list.
      depends_on:
        - >-
          A contractor who must use a vendor Git host gets that prefix
          added, not the key left unset.
        - >-
          If Git folders are not offered yet, fix enableProjectTypeInWorkspace
          first — an allowlist on a workspace that cannot add a Git folder
          does nothing.
      path:
        - >-
          Read enableProjectsAllowList. Missing or false is the backlog, but
          only after the prefix list is populated.
        - >-
          Add the hosts you already use. Try a remote that is not on the
          list.
        - >-
          Set the key true. Existing Git folders should keep working.
      costs:
        - >-
          The first personal GitHub remote a developer used for a spike will
          fail to connect.
        - >-
          An empty enforced list is an outage for every new Git folder.
      retain: >-
        The dated get-status line showing enableProjectsAllowList true, and
        a screenshot or export of the prefixes that were on the list that
        day.
      revisit: >-
        A new Git host, a new workspace (the key starts unset), or a
        connection that succeeded to a remote you do not recognise. Failing
        those, quarterly.
