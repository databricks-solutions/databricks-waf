    <title>Well-Architected assessment</title>
    <!--
      Applies the stored theme before first paint. Without this, a user whose explicit choice
      differs from their operating system sees one frame of the wrong theme, because the
      bundle that would set it is deferred behind HTML parsing.

      Inline and synchronous by necessity: a module script is deferred and a separate file is a
      round trip, either of which lands after the first paint this exists to get right. If a
      platform CSP ever blocks it, the prefers-color-scheme block in wa-theme.css still themes
      system users correctly and only an explicit override flashes — degraded, not broken.

      Kept to reading a key and writing three attributes. The logic it mirrors lives in
      lib/theme.ts and theme.test.ts asserts this markup and that module still agree.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('wa-theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.classList.toggle('dark', resolved === 'dark');
          root.classList.toggle('light', resolved === 'light');
          root.style.colorScheme = resolved;
        } catch (error) {
          /* Storage or matchMedia unavailable: the stylesheet's media query decides. */
        }
      })();
    </script>

    <div id="root"></div>
